<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wellbe</title>
<meta name="description" content="Your Wellbe Health Center app: sessions, packages, physio and supplements.">
<meta name="theme-color" content="#0a0e0f">
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" href="icon-192.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wellbe">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f5; --card:#fff; --ink:#151b1e; --ink-2:#47535a; --ink-3:#6d787c; --line:#e1e7e5;
  --mint:#6fc7b1; --mint-deep:#1f6e5b; --mint-soft:#e3f4ef; --mint-ink:#0f3d33;
  --crimson:#a3263f; --crimson-soft:#f9e8ec; --amber:#8a5a00; --amber-soft:#fff3d9;
  --wa:#1f8f4e; --track:#e6ecea;
  --pink:#a3263f; --pink-2:#c2405a; --pink-soft:#f9e8ec; --accent:var(--pink);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:Barlow,"Segoe UI",Roboto,Arial,sans-serif;
  --r:18px; --shadow:0 1px 2px rgba(16,40,34,.06),0 6px 20px rgba(16,40,34,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1315; --card:#172024; --ink:#eef2f1; --ink-2:#bcc6c3; --ink-3:#8f9b98; --line:#26323a;
  --mint:#6fc7b1; --mint-deep:#7fd3bd; --mint-soft:#15362e; --mint-ink:#d9f3ec;
  --crimson:#ef7c93; --crimson-soft:#3a1820; --amber:#f2c46b; --amber-soft:#3a2d10; --wa:#2fae63; --track:#24302f;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1315; --card:#172024; --ink:#eef2f1; --ink-2:#bcc6c3; --ink-3:#8f9b98; --line:#26323a;
  --mint:#6fc7b1; --mint-deep:#7fd3bd; --mint-soft:#15362e; --mint-ink:#d9f3ec;
  --crimson:#ef7c93; --crimson-soft:#3a1820; --amber:#f2c46b; --amber-soft:#3a2d10; --wa:#2fae63; --track:#24302f;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);font-size:16px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--ink)}
h1,h2,h3{font-family:var(--display);line-height:1.05;text-wrap:balance;letter-spacing:.01em}
:focus-visible{outline:3px solid var(--mint-deep);outline-offset:2px;border-radius:10px}
.icon{width:22px;height:22px;flex:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
s{color:var(--ink-3)}

/* shell */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);padding-top:env(safe-area-inset-top,0px)}
.top .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;height:60px;padding-inline:16px}
.brand{font:800 24px/1 var(--display);letter-spacing:.14em;color:var(--mint-deep);flex:1}
.help{text-decoration:none;display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding:9px 13px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);color:var(--wa)}
main{max-width:640px;margin:0 auto;padding:4px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.accs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.acc{padding:9px 16px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:15px;white-space:nowrap}
.acc[aria-pressed="true"]{background:var(--mint-deep);color:#fff}
.hello{margin:6px 0 16px}
.hello h1{font-size:34px}
.hello h1 em{font-style:normal;color:var(--accent)}
:root[data-accent="mint"]{--accent:#1f6e5b}:root[data-accent="ocean"]{--accent:#1e5f8c}:root[data-accent="sunset"]{--accent:#c2571a}:root[data-accent="plum"]{--accent:#6b2d7a}
.top{background-image:linear-gradient(115deg,transparent 0 78%,rgba(163,38,63,.10) 78% 86%,rgba(111,199,177,.18) 86% 100%)}
.hello p{color:var(--ink-3);font-size:15px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 10px}
.sec h2{font-size:23px;display:flex;align-items:center;gap:8px}
.sec h2::before{content:"";width:6px;height:20px;border-radius:3px;background:var(--accent)}
.sec small{color:var(--ink-3);font-size:14px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.stack>*+*{margin-top:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}

/* buttons */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:14px;font-weight:700;font-size:16px;background:var(--mint-deep);color:#fff;transition:transform .12s ease,filter .12s ease}
.btn:active{transform:scale(.97)}
.btn.block{display:flex;width:100%}
.btn.sec2{background:var(--mint-soft);color:var(--mint-deep)}
.btn.ghost{background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:var(--crimson);color:#fff}
.btn.wa{background:var(--wa);color:#fff}
.btn.sm{min-height:42px;padding:0 14px;font-size:15px;border-radius:12px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btns{display:flex;gap:10px}.btns>*{flex:1}
.link{text-decoration:none;color:var(--mint-deep);font-weight:700;font-size:15px;padding:8px 0}

/* quote */
.quote{position:relative;overflow:hidden;border-radius:22px;min-height:150px;color:#fff;background:linear-gradient(135deg,#1f6e5b 0%,#2a8f77 55%,#6fc7b1 100%);box-shadow:0 10px 30px rgba(31,110,91,.28);width:100%;text-align:left;display:block;padding:20px}
.quote .tag{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.quote .lock{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:110px;text-align:center}
.quote .lock b{font:800 26px/1.05 var(--display);letter-spacing:.02em}
.quote .lock span{font-size:14px;opacity:.9}
.quote .orb{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;animation:pulse 1.8s ease-in-out infinite}
.quote .orb svg{width:30px;height:30px}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,255,255,.35)}50%{transform:scale(1.06);box-shadow:0 0 0 14px rgba(255,255,255,0)}}
.quote blockquote{font:700 25px/1.18 var(--display);letter-spacing:.01em;margin:10px 0 12px;text-wrap:pretty}
.quote cite{font-style:normal;font-size:14px;opacity:.9;font-weight:600}
.quote.reveal blockquote,.quote.reveal cite,.quote.reveal .tag{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.quote.reveal cite{animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;pointer-events:none;animation:spark .9s ease-out forwards}
@keyframes spark{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--x),var(--y)) scale(.2)}}
.quote .glow{position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}

/* next session */
.next{display:flex;gap:16px;align-items:center}
.datebox{width:68px;flex:none;text-align:center;border-radius:14px;background:var(--pink-soft);color:var(--pink);padding:8px 0}
.today{margin-bottom:14px;border-radius:22px;padding:18px;color:#fff;background:linear-gradient(140deg,#a3263f,#c2405a 55%,#e0607a);box-shadow:0 10px 28px rgba(163,38,63,.3);position:relative;overflow:hidden}
.today .tag{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.today h3{font:800 34px/1 var(--display);margin:6px 0 2px}
.today p{opacity:.92}
.today .acts .btn{background:#fff;color:#a3263f}.today .acts .btn.ghost{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}
.promise{border-radius:24px;padding:20px;color:#fff;background:radial-gradient(120% 90% at 100% 0%,#e0607a 0%,rgba(224,96,122,0) 55%),linear-gradient(150deg,#151b1e,#2a1d24 60%,#4a1f2e);position:relative;overflow:hidden;box-shadow:0 12px 30px rgba(74,31,46,.35)}
.promise .tag{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#f3a8b8}
.promise blockquote{font:700 26px/1.15 var(--display);margin:8px 0 14px;text-wrap:pretty}
.promise .edit{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff}
.hlabel{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#f3a8b8;margin:0 0 8px}
.keys{display:flex;flex-direction:column;gap:8px}
.key{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:14px;background:rgba(255,255,255,.08);color:#fff;font-weight:600;font-size:15.5px;line-height:1.3;transition:background .2s}
.key .n{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 15px var(--display);background:rgba(255,255,255,.14)}
.key[aria-pressed="true"]{background:rgba(111,199,177,.22)}
.key[aria-pressed="true"] .n{background:var(--mint);color:#0f3d33}
.key[aria-pressed="true"] span.t{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.5)}
.promise .foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13.5px;color:#f3c9d3;font-weight:600}
.onb{min-height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding:calc(26px + env(safe-area-inset-top,0px)) 22px 26px}
.onb h1{font-size:40px;line-height:1;margin:18px 0 10px}.onb h1 em{font-style:normal;color:var(--pink)}
.onb .chipset{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.onb .chipset{flex-direction:column;flex-wrap:nowrap}
.pcar{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:12px -16px 0;padding:4px 16px 12px;scrollbar-width:none}.pcar::-webkit-scrollbar{display:none}
.pc{flex:0 0 78%;scroll-snap-align:center;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;padding:16px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);border:2px solid transparent}
.pc .pn{font-size:12px;font-weight:800;color:var(--ink-3);letter-spacing:.08em}.pc .pt{font:700 19px/1.3 var(--display);margin:10px 0}.pc .pu{font-size:13px;font-weight:800;color:var(--pink)}
.pc[aria-pressed="true"]{border-color:var(--pink);background:color-mix(in srgb,var(--pink) 8%,var(--card))}.pc[aria-pressed="true"] .pu::before{content:'✓ Chosen · '}
.stepnote{font-size:12.5px;color:#f3a8b8;margin:8px 2px 0;font-weight:600}
.onb .chipset button{padding:12px 14px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:15px;font-weight:600;text-align:left;line-height:1.3;border-left:4px solid var(--pink)}
.thinking{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;flex:1}
.thinking .orb2{width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--pink),var(--mint),var(--pink));animation:spin 1.4s linear infinite;-webkit-mask:radial-gradient(circle,transparent 52%,#000 54%);mask:radial-gradient(circle,transparent 52%,#000 54%)}
@keyframes spin{to{transform:rotate(360deg)}}
.invite{border-radius:22px;padding:20px;background:linear-gradient(150deg,var(--mint-soft),var(--card));box-shadow:var(--shadow)}
.invite h3{font-size:26px;line-height:1.08;margin-bottom:14px}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px;border-radius:16px;background:var(--card);border:2px dashed var(--mint);color:var(--ink)}
.pick:active{transform:scale(.98)}
.pick .ic{width:46px;height:46px;border-radius:50%;background:var(--mint-deep);color:#fff;display:grid;place-items:center;flex:none}
.pick b{display:block;font-size:16.5px}.pick .grow span{font-size:13.5px;color:var(--ink-3)}
.reward{margin-top:14px;padding:14px;border-radius:16px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(242,196,107,.35)}
.reward .rw-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#f2c46b;font-weight:700}
.reward .rw-top span{display:flex;align-items:center;gap:6px}.reward .rw-top b{color:#fff;font-size:15px}
.rw-bar{position:relative;height:12px;border-radius:999px;background:rgba(255,255,255,.12);margin:10px 0 8px;overflow:hidden}
.rw-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#e8a400,#f2c46b);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.rw-bar em{position:absolute;top:2px;bottom:2px;width:2px;background:rgba(0,0,0,.25)}
.rw-sub{font-size:13px;color:#f3c9d3;line-height:1.35}
.reward.won{display:flex;gap:12px;align-items:center;background:linear-gradient(120deg,#e8a400,#f2c46b);box-shadow:none;color:#3a2600}
.reward.won .gift{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.4);display:grid;place-items:center;flex:none}
.reward.won b{display:block;font-size:16px}.reward.won span{font-size:13.5px}
.fuel{scroll-snap-align:start;flex:none;width:150px;text-align:left;background:#fff;color:#151b1e;border-radius:18px;padding:12px;box-shadow:0 1px 2px rgba(16,40,34,.08),0 6px 18px rgba(16,40,34,.10);border:1px solid #e6ecea;display:flex;flex-direction:column;gap:2px;transition:transform .12s}
.fuel:active{transform:scale(.97)}
.fuel .fi{height:92px;display:grid;place-items:center;margin-bottom:6px}
.fuel b{font-size:15px;line-height:1.25;color:#151b1e}
.fuel .fp{font:800 20px var(--display);color:#151b1e;margin-top:2px}
.fuel .fadd{display:inline-flex;align-items:center;gap:4px;margin-top:8px;align-self:flex-start;padding:6px 12px;border-radius:999px;background:#151b1e;color:#fff;font-size:13px;font-weight:700}
.madero{border-radius:22px;padding:20px;background:linear-gradient(150deg,#5b2a6e,#7a3a8c 60%,#a35bb5);color:#fff;position:relative;overflow:hidden}
.madero .tag{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.madero h3{font-size:30px;line-height:1.02;margin:6px 0 14px}
.madero .btn{background:#fff;color:#5b2a6e;font-weight:800;letter-spacing:.04em}
.slots{display:grid;grid-template-columns:1fr;gap:8px}
.slot{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line)}
.slot b{font:800 22px var(--display);min-width:78px}
.slot .grow span{display:block;font-size:13.5px;color:var(--ink-3)}
.slot.instant{box-shadow:inset 0 0 0 2px var(--mint-deep);background:var(--mint-soft)}
.slot.full{opacity:.5;pointer-events:none}
.slot .tagx{font-size:12.5px;font-weight:800;padding:5px 10px;border-radius:999px;white-space:nowrap}
.slot.instant .tagx{background:var(--mint-deep);color:#fff}.slot.request .tagx{background:var(--card);color:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--line)}.slot.full .tagx{background:var(--track);color:var(--ink-3)}
.review{display:flex;gap:14px;align-items:center;border-radius:18px;padding:16px;background:var(--card);box-shadow:var(--shadow);border:1.5px solid #f2d27a}
.stars{color:#e8a400;font-size:20px;letter-spacing:2px;line-height:1}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.swatches button{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 3px var(--card),0 0 0 2px var(--line)}
.swatches button[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--card),0 0 0 3px var(--ink)}
.datebox small{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.datebox b{display:block;font:800 30px/1 var(--display)}
.next h3{font-size:24px}
.next p{color:var(--ink-3);font-size:15px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--mint-soft);color:var(--mint-deep);white-space:nowrap}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.bad{background:var(--crimson-soft);color:var(--crimson)}
.pill.mute{background:var(--track);color:var(--ink-2)}

/* progress */
.ring{width:84px;height:84px;flex:none;position:relative}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .v b{font:800 26px var(--display)}
.ring .v small{display:block;font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.04em}
.bar{height:10px;border-radius:999px;background:var(--track);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;border-radius:999px;background:var(--mint)}
.kv{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-3)}

/* offers */
.offer{border-radius:22px;padding:20px;background:linear-gradient(160deg,#151b1e,#24343a);color:#fff;position:relative;overflow:hidden}
.offer .save{display:inline-block;font:800 13px var(--display);letter-spacing:.12em;text-transform:uppercase;background:var(--mint);color:#0f3d33;padding:4px 10px;border-radius:999px}
.offer h3{font-size:28px;margin:10px 0 6px}
.offer p{opacity:.85;font-size:15px;margin-bottom:14px}
.offer .btn{background:var(--mint);color:#0f3d33}
.physio{border-radius:22px;padding:20px;background:linear-gradient(150deg,#a3263f,#c2405a);color:#fff;position:relative;overflow:hidden}
.physio h3{font-size:27px;line-height:1.05;margin:6px 0}
.physio .price{display:flex;align-items:baseline;gap:8px;margin:6px 0 14px}
.physio .price b{font:800 34px var(--display)}
.physio .price s{color:rgba(255,255,255,.7);font-size:18px}
.physio .btn{background:#fff;color:#a3263f;font-weight:800;letter-spacing:.04em}
.physio .tag,.offer .tag{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.deco{position:absolute;right:-30px;bottom:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08)}

/* spots */
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.hscroll::-webkit-scrollbar,.accs::-webkit-scrollbar{display:none}
.spot{scroll-snap-align:start;flex:none;width:150px;text-align:left;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px}
.spot small{color:var(--ink-3);font-size:13px;font-weight:600}
.spot b{display:block;font:800 22px/1.1 var(--display);margin:2px 0}
.spot .pill{margin-top:6px}

/* lists */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;width:100%;text-align:left}
.item .t{font-weight:700}
.item .s{font-size:14px;color:var(--ink-3)}
.mini{width:52px;flex:none;text-align:center;line-height:1.05}
.mini small{display:block;font-size:11px;font-weight:800;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.mini b{font:800 22px var(--display)}
.acts{display:flex;gap:8px;margin-top:12px}
.acts .btn{flex:1}
.empty{text-align:center;padding:22px;color:var(--ink-3);background:var(--card);border-radius:16px;box-shadow:var(--shadow)}

/* shop */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prod{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.prod .img{aspect-ratio:1;background:linear-gradient(180deg,#f5f8f7,#e8efed);display:grid;place-items:center;padding:12px}
.prod .img img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.12))}
.ph{width:64%;aspect-ratio:1;border-radius:50%;background:var(--mint-soft);display:grid;place-items:center;font:800 26px var(--display);color:var(--mint-deep)}
.prod .b{padding:12px;display:flex;flex-direction:column;gap:2px;flex:1}
.prod .n{font-weight:700;font-size:15px;line-height:1.25}
.prod .d{font-size:13px;color:var(--ink-3);line-height:1.3}
.prod .p{font:800 22px var(--display);margin-top:auto;padding-top:6px}
.qty{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:8px}
.qty button{width:40px;height:40px;border-radius:12px;background:var(--mint-soft);color:var(--mint-deep);font-weight:800;font-size:22px;line-height:1}
.qty b{font:800 20px var(--display);min-width:24px;text-align:center}
.add{width:100%;min-height:42px;border-radius:12px;background:var(--mint-deep);color:#fff;font-weight:700;margin-top:8px}
.cart{position:fixed;left:50%;transform:translateX(-50%) translateY(140%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(608px,calc(100% - 32px));z-index:25;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.cart.on{transform:translateX(-50%) translateY(0)}
.cart .btn{width:100%;box-shadow:0 10px 30px rgba(31,110,91,.35);justify-content:space-between;min-height:58px}
.plist .item{padding:10px 14px}
.plist img,.plist .ph2{width:44px;height:44px;object-fit:contain;flex:none}
.ph2{border-radius:12px;background:var(--mint-soft);display:grid;place-items:center;font:800 16px var(--display);color:var(--mint-deep)}

/* tab bar */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs .lk{position:absolute;top:5px;left:calc(50% + 7px);width:16px;height:16px;border-radius:8px;background:var(--ink-3);color:#fff;display:grid;place-items:center}.tabs .lk .icon{width:10px;height:10px}
.me{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--mint-deep);color:#fff;font-weight:800;font-size:15px;box-shadow:var(--shadow);flex:none}.me[aria-current="page"]{outline:3px solid var(--accent);outline-offset:2px}
.subnav{display:flex;gap:6px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}.subnav::-webkit-scrollbar{display:none}
.subnav button{position:relative;padding:9px 15px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:14.5px;white-space:nowrap;color:var(--ink-2,var(--ink))}
.subnav button[aria-current="page"]{background:var(--accent);color:#fff}.subnav .dot{position:static;display:inline-grid;margin-left:6px;min-width:18px;height:18px;border-radius:9px;background:var(--crimson);color:#fff;font-size:11px;place-items:center;padding:0 5px}
.lobby{position:relative;border-radius:28px;overflow:hidden;color:#fff;isolation:isolate;padding:18px 18px 18px;background:#080d10;box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.06)}
.lobby:before{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(120% 70% at 100% 0%,rgba(163,38,63,.55) 0%,rgba(163,38,63,0) 55%),radial-gradient(90% 60% at 0% 100%,rgba(31,110,91,.55) 0%,rgba(31,110,91,0) 60%),linear-gradient(180deg,#0b1216 0%,#070b0e 100%)}
.lobby .sky{position:absolute;left:0;right:0;bottom:0;height:46%;z-index:-1;opacity:.55;pointer-events:none}
.lobby .bar1{display:flex;justify-content:space-between;align-items:center;font:700 11.5px var(--display);letter-spacing:.22em;color:rgba(255,255,255,.62)}
.lobby .bar1 i{font-style:normal;padding:4px 9px;border-radius:99px;border:1px solid rgba(255,255,255,.18);letter-spacing:.16em}
.lobby .stage{position:relative;min-height:250px;margin-top:4px}
.lobby .ttl{position:relative;z-index:2;font:800 clamp(48px,15vw,64px)/.84 var(--display);letter-spacing:-.005em;text-transform:uppercase;margin:18px 0 0;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.lobby .ttl span{display:block;background:linear-gradient(180deg,#fff 0%,#ffd1da 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lobby .ttl span+span{background:linear-gradient(180deg,#ff6f8c 0%,#a3263f 100%);-webkit-background-clip:text;background-clip:text}
.lobby .tag{position:relative;z-index:2;max-width:56%;margin:12px 0 0;font-size:14px;line-height:1.45;color:rgba(255,255,255,.72);font-weight:500}
.lobby .hero{position:absolute;right:-26px;top:-4px;width:62%;height:290px;z-index:1;-webkit-mask-image:linear-gradient(180deg,#000 48%,transparent 86%);mask-image:linear-gradient(180deg,#000 48%,transparent 86%)}
.lobby .hero:before{content:"";position:absolute;left:12%;right:12%;top:8%;height:70%;border-radius:50%;background:radial-gradient(50% 50% at 50% 45%,rgba(224,69,122,.55),rgba(163,38,63,.18) 55%,transparent 72%);filter:blur(6px);z-index:-1}
.lobby .hero img{width:100%;height:100%;object-fit:contain;object-position:50% 0;filter:drop-shadow(0 18px 24px rgba(0,0,0,.55))}
.lobby .stats{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border-radius:18px;background:rgba(255,255,255,.06);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.lobby .stats div{padding:12px 6px;text-align:center}.lobby .stats div+div{box-shadow:inset 1px 0 0 rgba(255,255,255,.08)}
.lobby .stats b{display:block;font:800 25px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lobby .stats b.gold{color:#f2c46b}
.lobby .stats small{display:block;margin-top:5px;font:700 10.5px var(--display);letter-spacing:.18em;color:rgba(255,255,255,.55);text-transform:uppercase}
.lobby .play{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;margin-top:14px;border-radius:18px;color:#fff;font:800 21px var(--display);letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(180deg,#c9405e 0%,#a3263f 55%,#86172f 100%);box-shadow:0 14px 34px rgba(163,38,63,.55),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .12s}
.lobby .play:active{transform:scale(.98)}
.lobby .play:after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.lobby .play svg{width:20px;height:20px}
.lobby .alt{display:block;width:100%;margin-top:8px;padding:10px;font:700 13px var(--display);letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.62)}
@media (prefers-reduced-motion:reduce){.lobby .play:after{animation:none;display:none}}
.gh{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 10px}.gh h2{font:800 15px var(--display);letter-spacing:.2em;text-transform:uppercase;margin:0;color:var(--ink-2)}.gh small{font-size:12.5px;color:var(--ink-3);font-weight:600}
.moves{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mv{border-radius:18px;background:var(--card);box-shadow:var(--shadow);padding:14px 4px 12px;text-align:center}
.mv .o{width:44px;height:44px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,rgba(163,38,63,.22),rgba(163,38,63,.08));color:#ff7a93;box-shadow:inset 0 0 0 1px rgba(255,122,147,.25)}
.mv .o svg{width:22px;height:22px}
.mv b{display:block;font:800 16px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}.mv span{display:block;margin-top:4px;font-size:11.5px;color:var(--ink-3);font-weight:600}
.pups{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pu{display:flex;align-items:center;gap:12px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);padding:12px}
.pu .o{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff}.pu .o svg{width:22px;height:22px}
.pu b{display:block;font:800 18px/1 var(--display);letter-spacing:.04em}.pu span{display:block;margin-top:3px;font-size:12px;color:var(--ink-3);font-weight:600;line-height:1.3}
.chase{display:flex;gap:14px;align-items:center;margin-top:8px;border-radius:18px;padding:14px;background:var(--card);box-shadow:var(--shadow)}
.chase .o{width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;background:#2a1418;color:#ff7a93}.chase .o svg{width:22px;height:22px}
.chase p{margin:0;font-size:13.5px;line-height:1.45;color:var(--ink-2)}.chase p b{color:var(--ink)}
.boost{display:flex;gap:10px;align-items:center;margin-top:14px;padding:12px 14px;border-radius:16px;background:linear-gradient(120deg,rgba(242,196,107,.22),rgba(242,196,107,.06));box-shadow:inset 0 0 0 1px rgba(242,196,107,.35);font-weight:700;font-size:14px;color:#f2c46b}
.boost.off{background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);color:var(--ink-2);font-weight:600}
.boost b{font:800 20px var(--display)}.boost svg{width:24px;height:24px;flex:none}
.rcard{border-radius:18px;background:var(--card);box-shadow:var(--shadow);padding:6px 14px}
.mis{display:flex;gap:12px;align-items:center;padding:11px 0}.mis+.mis{border-top:1px solid var(--line)}
.mis .ck{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);color:transparent}.mis.done .ck{background:#2fb7a0;box-shadow:none;color:#fff}.mis .ck svg{width:16px;height:16px}
.mis .t{font-weight:700;font-size:14.5px;line-height:1.3}.mis .bar{height:5px;border-radius:9px;background:rgba(255,255,255,.1);margin-top:7px;overflow:hidden}.mis .bar i{display:block;height:100%;background:#f2c46b;border-radius:9px}
.mis .rw{font:800 15px var(--display);color:#f2c46b;white-space:nowrap}.mis.done .t{color:var(--ink-3);text-decoration:line-through}
.tabs3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.06);margin-bottom:6px}
.tabs3 button{padding:9px 0;border-radius:10px;font:800 13px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}.tabs3 button.on{background:#a3263f;color:#fff}
.lb{display:flex;align-items:center;gap:12px;padding:10px 4px}.lb+.lb{border-top:1px solid var(--line)}
.lb .n{width:28px;font:800 18px var(--display);color:var(--ink-3);text-align:center}.lb.top .n{color:#f2c46b}.lb .nm{flex:1;font-weight:700}.lb .sc{font:800 18px var(--display);font-variant-numeric:tabular-nums}
.lb.mine{background:rgba(224,69,122,.12);border-radius:12px;margin:2px -6px;padding:10px}.lb.mine .nm:after{content:" · you";color:#ff7a93;font-weight:800}
.lbe{padding:16px 4px;color:var(--ink-3);font-size:14px}
.prize{border-radius:18px;padding:16px;background:linear-gradient(135deg,#2a1418,#16090c);box-shadow:inset 0 0 0 1px rgba(255,122,147,.25)}
.prize b{display:block;font:800 22px var(--display)}.prize p{margin:4px 0 0;color:var(--ink-2);font-size:13.5px}
.prize .bar{height:8px;border-radius:9px;background:rgba(255,255,255,.1);margin:12px 0 6px;overflow:hidden}.cashc{background:linear-gradient(135deg,#0f2a22,#08140f);box-shadow:inset 0 0 0 1px rgba(126,240,200,.28)}.cashc b{color:#7ef0c8}.cashc .bar i{background:linear-gradient(90deg,#7ef0c8,#2fbf8f)!important}.cnote{margin-top:10px;font-size:13px;color:var(--ink-2)}.cnote.ok{color:#7ef0c8;font-weight:700}
.prize .bar i{display:block;height:100%;background:linear-gradient(90deg,#f2c46b,#ff7a93);border-radius:9px}
.prize small{color:var(--ink-3);font-weight:700}.prize .btn{margin-top:12px}
.upg{display:flex;gap:12px;align-items:center;border-radius:18px;background:var(--card);box-shadow:var(--shadow);padding:12px}.upg+.upg{margin-top:8px}
.upg .o{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff}.upg .o svg{width:22px;height:22px}
.upg b{display:block;font:800 17px/1 var(--display);letter-spacing:.04em}.upg span{display:block;margin-top:4px;font-size:12px;color:var(--ink-3);font-weight:600}
.upg .dots{display:flex;gap:4px;margin-top:6px}.upg .dots i{width:14px;height:5px;border-radius:3px;background:rgba(255,255,255,.14)}.upg .dots i.on{background:#f2c46b}
.upg button{margin-left:auto;padding:9px 12px;border-radius:12px;background:rgba(242,196,107,.15);color:#f2c46b;font:800 14px var(--display);letter-spacing:.06em;white-space:nowrap}.upg button:disabled{opacity:.45}
.bdg{display:flex;flex-wrap:wrap;gap:6px}.bdg span{padding:7px 11px;border-radius:99px;font-size:12.5px;font-weight:800;background:rgba(255,255,255,.05);color:var(--ink-3)}.bdg span.on{background:rgba(242,196,107,.16);color:#f2c46b}
.skel2{padding:18px;text-align:center;color:var(--ink-3);font-weight:700}
.wh{display:flex;gap:6px;align-items:center;justify-content:center;padding:14px 0 6px}.wh i{width:36px;height:42px;border-radius:11px;display:grid;place-items:center;font:800 24px var(--display);font-style:normal;background:rgba(255,255,255,.06);color:var(--ink-3)}
.wh i.on{background:rgba(242,196,107,.18);color:#f2c46b;box-shadow:inset 0 0 0 1px rgba(242,196,107,.4)}.wh img{width:44px;height:44px;margin-left:4px;opacity:.25;filter:grayscale(1)}.wh img.on{opacity:1;filter:none}
.whp{margin:2px 0 12px;text-align:center;font-size:13px;color:var(--ink-3);font-weight:600}
.soon{text-align:center;padding:46px 18px 20px}.soon .lockbig{width:84px;height:84px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);color:var(--accent)}.soon .lockbig .icon{width:36px;height:36px}
.soon h1{font-size:32px;margin:0 0 8px}.soon p{color:var(--ink-3);font-size:16px;max-width:340px;margin:0 auto}
.soonlist{margin-top:22px;text-align:left}.soonlist .item{opacity:.75}
.prof{text-align:center;padding:10px 0 18px}.prof .av{width:84px;height:84px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:var(--mint-deep);color:#fff;font:800 32px var(--display)}.prof h1{font-size:28px;margin:0}.prof p{color:var(--ink-3);margin:4px 0 0}
#gameFrame{position:fixed;inset:0;z-index:60;border:0;width:100%;height:100%;background:#0b1418;display:none}#gameFrame.on{display:block}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;font-size:12.5px;font-weight:700;color:var(--ink-3);position:relative}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tabs .dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--crimson);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92dvh;display:flex;flex-direction:column;background:var(--card);border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 0}
.sheet header{display:flex;align-items:center;gap:10px;padding:10px 18px 6px}
.sheet header h2{flex:1;font-size:26px}
.x{width:40px;height:40px;border-radius:50%;background:var(--track);display:grid;place-items:center}
.sheet .body{overflow-y:auto;padding:6px 18px 18px;overscroll-behavior:contain}
.sheet .foot{padding:12px 18px 16px;border-top:1px solid var(--line)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:15px;background:var(--mint-soft);color:var(--mint-ink)}
.note.bad{background:var(--crimson-soft);color:var(--crimson)}
.note.warn{background:var(--amber-soft);color:var(--amber)}
.note .icon{margin-top:1px}
.field{margin-top:16px}
.field label,.flabel{display:block;font-weight:700;font-size:15px;margin-bottom:8px}
.inp{width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);padding:12px 14px;font-size:17px}
.inp:focus{outline:none;border-color:var(--mint-deep);background:var(--card)}
textarea.inp{min-height:84px;resize:vertical}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;min-width:64px;padding:9px 12px;border-radius:14px;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line);text-align:center;line-height:1.15}
.chip small{display:block;font-size:12px;font-weight:700;color:var(--ink-3)}
.chip b{font:800 20px var(--display)}
.chip[aria-pressed="true"]{background:var(--mint-deep);box-shadow:none;color:#fff}
.chip[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.times button{min-height:48px;border-radius:12px;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700}
.times button[aria-pressed="true"]{background:var(--mint-deep);color:#fff;box-shadow:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--track);padding:5px;border-radius:14px}
.seg button{min-height:46px;border-radius:10px;font-weight:700;font-size:15px;line-height:1.15}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:var(--shadow);color:var(--mint-deep)}
.big{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px;border-radius:18px;background:var(--card);box-shadow:var(--shadow)}
.book{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .12s}
.book:active{transform:scale(.98)}
.book::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--bk)}
.book .ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex:none;background:var(--bk-soft);color:var(--bk)}
.book .ic svg{width:26px;height:26px}
.book small{display:block;font-size:12.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--bk)}
.book b{display:block;font:800 22px/1.1 var(--display);margin:2px 0 3px}
.book span{font-size:14px;color:var(--ink-3);line-height:1.3}
.book .go{width:40px;height:40px;border-radius:50%;background:var(--wa);color:#fff;display:grid;place-items:center;flex:none}
.book .go svg{width:20px;height:20px}
:root[data-theme="dark"] .physio .btn,:root[data-theme="dark"] .madero .btn,.physio .btn,.madero .btn{background:#fff;box-shadow:0 8px 20px rgba(0,0,0,.25)}
:root[data-theme="dark"] .physio .btn,.physio .btn{color:#a3263f}:root[data-theme="dark"] .madero .btn,.madero .btn{color:#5b2a6e}
.brand.lg{display:flex;align-items:center}.brand.lg img{height:30px;width:auto;display:block}
:root[data-theme="dark"] .brand.lg::after{display:none}
.lobby .bar1 span{display:flex;align-items:center;gap:8px}.lobby .bar1 span img{width:22px;height:22px}
.book.bk-physio{--bk:#a3263f;--bk-soft:#f9e8ec}.book.bk-madero{--bk:#7a3a8c;--bk-soft:#f3e6f6}.book.bk-train{--bk:#1f6e5b;--bk-soft:#e3f4ef}

.big .ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--mint-soft);color:var(--mint-deep)}
.big b{display:block;font-size:17px}
.big span{font-size:14px;color:var(--ink-3)}
.done{text-align:center;padding:16px 4px 6px}
.done .ok{width:78px;height:78px;border-radius:50%;margin:6px auto 14px;background:var(--mint-soft);color:var(--mint-deep);display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.done .ok svg{width:40px;height:40px}
.done h3{font-size:28px;margin-bottom:6px}
.done p{color:var(--ink-2)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:#151b1e;color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;z-index:60;transition:all .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* login */
.login{min-height:100dvh;display:flex;flex-direction:column;max-width:460px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) 22px 28px}
.hero{border-radius:26px;padding:28px 22px;color:#fff;background:linear-gradient(140deg,#1f6e5b,#2f9a80 60%,#6fc7b1);box-shadow:0 14px 36px rgba(31,110,91,.3);margin-bottom:26px}
.hero .brand{color:#fff;font-size:30px}
.hero h1{font-size:40px;margin:22px 0 8px}
.hero p{opacity:.92}
.login .foot2{margin-top:auto;padding-top:24px;text-align:center;font-size:14px;color:var(--ink-3)}
.codein{letter-spacing:.5em;text-align:center;font:800 30px var(--display)}
.skel{background:linear-gradient(90deg,var(--track),var(--card),var(--track));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:18px}
@keyframes sh{to{background-position:-200% 0}}
.status{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-3);margin-top:10px}
.physio,.madero{padding:14px 16px;border-radius:18px}
.physio h3,.madero h3{font-size:22px;margin:4px 0 8px}
.physio .price{margin:0 0 10px}.physio .price b{font-size:26px}.physio .price s{font-size:15px}
.physio .btn,.madero .btn{min-height:42px;font-size:14px;border-radius:12px}
.physio .tag,.madero .tag{font-size:11px}
.physio .deco,.madero .deco{width:90px;height:90px;right:-24px;bottom:-24px}

function gWay(ic,t,sub,act){return '<button class="book" data-act="'+act+'"><span class="ic">'+ICON(ic)+'</span><div class="grow"><b>'+t+'</b><span>'+sub+'</span></div><span class="go">›</span></button>'}
function gLabel(p){return /x\/month/.test(p.label)?tabName(p.kind)+' · '+p.n+' a month':p.label}
function gPkgList(list){return '<div class="list">'+list.map(function(p){return '<button class="card gpkg" data-act="gpkg|'+esc(p.name)+'"><div class="grow"><b>'+esc(gLabel(p))+'</b><span>'+p.n+' session'+(p.n>1?'s':'')+(p.n>1?' · '+money(Math.round(p.price/p.n*10)/10)+' per session':'')+'</span></div><span class="gp num">'+money(p.price)+'</span></button>'}).join('')+'</div>'}
VIEWS.gwork=function(){return '<div class="hello"><h1>Your <em>workouts</em></h1></div><div class="empty" style="text-align:left"><b style="font-size:18px">Your coach builds your plan</b><p class="muted">After your first session, your coach writes a program made for your body. It shows here, one workout at a time, with your weights.</p>'+
  (D.guest.trial?gTrialCard():'<button class="btn block" style="margin-top:14px" data-act="gtrial">'+ICON('i-gift')+'Book my free trial</button>')+'</div>'}
function gPhoneField(){return '<label class="flabel" for="gph" style="margin-top:16px">Your WhatsApp number</label><input class="inp" id="gph" type="tel" inputmode="tel" autocomplete="tel" placeholder="70 123 456" value="'+esc(D.guest.phone||'')+'">'}
function gSend(op,data,btn,done){var ph=$('#gph')?$('#gph').value.trim():D.guest.phone;if(String(ph||'').replace(/\D/g,'').length<7){toast('Type your WhatsApp number');return}
  busy(btn,true);data.op=op;data.phone=ph;api('app_cl_guest',Object.assign({cid:ACC().cid},data)).then(function(j){D.guest.phone=ph;if(j.asked)D.guest.asked=j.asked;if(j.trial)D.guest.trial=j.trial;store(cacheKey(),JSON.stringify(D));closeSheet();render();done(j);boot(true)}).catch(function(e){fail(btn,e)})}
function gActs(){ACT.gtrial=function(){var days=(D.guest.slots||[]).filter(function(d){return d.slots.some(function(x){return x.type!=='full'})});
  if(!days.length){openSheet('Free trial','<p class="muted">No open morning slot this week. Message Romy and she will find you a time.</p>','<a class="btn wa block" target="_blank" rel="noopener" href="'+waLink('Hi Romy, I want to book my free trial at Wellbe.')+'">'+ICON('i-wa')+'Message Romy</a>');return}
  var sel=days[0].date,hr=null;
  var paint=function(){var d=days.filter(function(x){return x.date===sel})[0];$('#gslots').innerHTML=d.slots.map(function(x){return '<button class="slot" aria-pressed="'+(x.hour===hr)+'" data-h="'+x.hour+'"'+(x.type==='full'?' disabled':'')+'><b>'+hl((x.hour<10?'0':'')+x.hour+':00')+'</b><span class="muted">'+(x.type==='full'?'Full':'Small group 1:3 with Joe')+'</span></button>'}).join('');
    $$('#gslots [data-h]').forEach(function(b){b.onclick=function(){hr=+b.dataset.h;paint()}})};
  openSheet('Book your free trial','<p class="muted" style="margin-top:0">One free small group session, 60 minutes. Pick a day and a time.</p>'+dayChips(days.map(function(d){return d.date}),sel,'gdays')+'<div class="slots" id="gslots" style="margin-top:12px"></div>'+gPhoneField(),'<button class="btn block" id="gok">Book my free trial</button>');
  pickOne('#gdays',function(b){sel=b.dataset.d;hr=null;paint()});paint();
  $('#gok').onclick=function(){if(hr==null){toast('Pick a time');return}gSend('trial',{date:sel,hour:hr},this,function(j){success('Your free trial is booked','<b>'+dayLong(j.trial.date)+' at '+esc(j.trial.time)+'</b><br>Romy will confirm on WhatsApp. Bring water and comfortable shoes.')})}};
ACT.gcall=function(){openSheet('Free 15 min coach call','<p class="muted" style="margin-top:0">A coach WhatsApps you to understand your goal, your past injuries and your schedule, then tells you exactly how we would train you.</p><label class="flabel" for="gnote">Your goal (optional)</label><input class="inp" id="gnote" placeholder="e.g. lose 6 kg, back pain, get strong">'+gPhoneField(),'<button class="btn block" id="gok">Ask for my call</button>');
  $('#gok').onclick=function(){gSend('call',{note:$('#gnote').value.trim()},this,function(){success('Call requested','A coach will WhatsApp you soon. Keep your phone close.')})}};
ACT.gpkgs=function(){var P=D.guest.packages,kinds=['1:3','1:2','1:1','Prehab','Physio','Osteo','Madero'];
  openSheet('Packages',kinds.map(function(k){var l=P.filter(function(p){return p.kind===k});return l.length?'<div class="sec" style="margin-top:14px"><h2>'+tabName(k)+'</h2></div>'+gPkgList(l):''}).join('')+'<p class="muted" style="font-size:14px">Pay at the center, cash or Whish. Not sure which one fits you? Ask for a free coach call.</p>');bind()};
ACT.gpkg=function(name){var p=D.guest.packages.filter(function(x){return x.name===name})[0];if(!p)return;
  openSheet('Get this package','<div class="card" style="box-shadow:none;background:var(--bg)"><b style="font-size:18px">'+esc(gLabel(p))+'</b><div class="muted">'+p.n+' session'+(p.n>1?'s':'')+' · '+money(p.price)+'</div></div><p class="muted">Romy WhatsApps you to choose your start date and times. You pay at the center (cash or Whish).</p>'+gPhoneField(),'<button class="btn block" id="gok">Request this package</button>');
  $('#gok').onclick=function(){gSend('pkg',{pkg:p.name},this,function(){success('Package requested','Romy will WhatsApp you to set your start date. Welcome to Wellbe!')})}};
}

function bookBtn(k,ic,q,t,s,act){return '<button class="book bk-'+k+'" data-act="'+act+'"><span class="ic">'+ICON(ic)+'</span><div class="grow"><small>'+q+'</small><b>'+t+'</b><span>'+s+'</span></div><span class="go">'+ICON('i-wa')+'</span></button>'}
function bigBtn(ic,t,s,act){return '<button class="big" data-act="'+act+'"><span class="ic">'+ICON(ic)+'</span><div class="grow"><b>'+t+'</b><span>'+s+'</span></div>'+ICON('i-wa','color:var(--wa)')+'</button>'}
function reqItem(q){var st=q.status==='New'?(/Cancelled|Joined/.test(q.type)?'<span class="pill mute">Logged</span>':'<span class="pill warn">Waiting</span>'):q.status==='Declined'?'<span class="pill bad">Not possible</span>':'<span class="pill">Done</span>';

/* ---------- shop ---------- */
function shopItems(){return (D.shop||[]).map(function(x){var m=CATALOG.filter(function(c){return c[0].test(x.n)})[0];return {n:x.n,price:x.price,left:x.left,img:m?m[1]:'',desc:m?m[2]:'',rank:m?m[3]:0}})}
function featured(){return shopItems().filter(function(x){return x.rank}).sort(function(a,b){return a.rank-b.rank})}
function imgTag(x,h){return x.img?'<img src="'+IMG[x.img]+'" alt="'+esc(x.n)+'" style="max-height:'+h+'px;max-width:100%" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=\'<span class=ph>'+esc(x.n[0])+'</span>\'">':'<span class="ph">'+esc(x.n[0])+'</span>'}
function prodCard(x){var q=CART[x.n]||0;
  return '<div class="prod"><div class="img">'+imgTag(x,200)+'</div><div class="b"><div class="n">'+esc(x.n)+'</div><div class="d">'+esc(x.desc)+'</div><div class="p num">'+money(x.price)+'</div><div class="d">'+(x.left?'In stock':'We order it in for you')+'</div>'+
   (q?'<div class="qty"><button data-dec="'+esc(x.n)+'" aria-label="Less">−</button><b class="num">'+q+'</b><button data-inc="'+esc(x.n)+'" aria-label="More">+</button></div>':'<button class="add" data-inc="'+esc(x.n)+'">Add to order</button>')+'</div></div>'}
function cartTotal(){var it=shopItems(),t=0,n=0;Object.keys(CART).forEach(function(k){var x=it.filter(function(y){return y.n===k})[0];if(x){t+=x.price*CART[k];n+=CART[k]}});return {t:t,n:n}}
function cartBar(){var c=cartTotal();if(!D||!ACC().full)return '';return '<div class="cart'+(c.n&&(VIEW==='shop'||VIEW==='home')?' on':'')+'" id="cart"><button class="btn" data-act="order"><span>Pick up from center · '+c.n+' item'+(c.n>1?'s':'')+'</span><span class="num">'+money(c.t)+'</span></button></div>'}
function setQty(n,d){CART[n]=Math.max(0,Math.min(10,(CART[n]||0)+d));if(!CART[n])delete CART[n];store('wbc_cart',JSON.stringify(CART));var y=scrollY;render();scrollTo(0,y)}

/* ---------- bind ---------- */
function bind(){
  $$('[data-nav]').forEach(function(b){b.onclick=function(){VIEW=b.dataset.nav;SEC='center';store('wbc_sec','center');render();scrollTo(0,0)}});
  $$('[data-sec]').forEach(function(b){b.onclick=function(){var v=b.dataset.sec;if(v==='me'&&SEC==='me')v='center';SEC=v;if(v!=='me')store('wbc_sec',v);render();scrollTo(0,0)}});
  $$('[data-acc]').forEach(function(b){b.onclick=function(){A=+b.dataset.acc;store('wbc_acc',A);VIEW='home';render()}});
  var q=$('#quote');if(q)q.onclick=function(){unlockQuote(q)};
  $$('[data-act]').forEach(function(b){b.onclick=function(){var x=b.dataset.act.split('|');ACT[x[0]]&&ACT[x[0]](x[1])}});
  $$('[data-cancel]').forEach(function(b){b.onclick=function(){cancelSheet(findSess(b.dataset.cancel))}});
  $$('[data-resch]').forEach(function(b){b.onclick=function(){reschSheet(findSess(b.dataset.resch))}});
  $$('[data-join]').forEach(function(b){b.onclick=function(){joinSheet(ACC().open[+b.dataset.join])}});
  $$('[data-freeze]').forEach(function(b){b.onclick=function(){freezeSheet(ACC().pkgs.filter(function(p){return p.id===b.dataset.freeze})[0])}});
  $$('[data-inc]').forEach(function(b){b.onclick=function(){var had=CART[b.dataset.inc];setQty(b.dataset.inc,1);if(!had)addedSheet(b.dataset.inc)}});
  $$('[data-prod]').forEach(function(b){b.onclick=function(){prodSheet(b.dataset.prod)}});
  $$('[data-dec]').forEach(function(b){b.onclick=function(){setQty(b.dataset.dec,-1)}});
  $$('[data-late]').forEach(function(b){b.onclick=function(){lateSheet(findSess(b.dataset.late))}});
  $$('[data-key]').forEach(function(b){b.onclick=function(){var a=ACC(),k=keyState(a),i=+b.dataset.key;k[i]=!k[i];store('wbc_keys_'+a.cid+'_'+D.today,JSON.stringify(k));if(STK[a.cid]&&!STK[a.cid].off)STK[a.cid].keys=k.slice();saveKeys(a,k);if(k.every(Boolean)){var st=streakDays(a);st[D.today]=1;store('wbc_streak_'+a.cid,JSON.stringify(st));toast('All 3 done today. That\u2019s how promises are kept.')}var y=scrollY;render();scrollTo(0,y)}});
  $$('[data-accent]').forEach(function(b){b.onclick=function(){var v=b.dataset.accent;store('wbc_accent',v);if(v==='rose')document.documentElement.removeAttribute('data-accent');else document.documentElement.setAttribute('data-accent',v);var y=scrollY;render();scrollTo(0,y)}});
  $$('[data-review]').forEach(function(b){b.onclick=function(){store('wbc_reviewed','1');window.open(D.review||'https://search.google.com/local/writereview?placeid=ChIJ35Nmu5s_HxURBmvCuEEY8U0','_blank')}});
}
function findSess(id){return ACC().upcoming.filter(function(s){return s.id===id})[0]}

/* ---------- sheets ---------- */
function openSheet(title,body,foot){$('#shTitle').textContent=title;$('#shBody').innerHTML=body;$('#shFoot').innerHTML=foot||'';$('#shFoot').hidden=!foot;$('#scrim').classList.add('on');$('#sheet').classList.add('on');$('#shBody').scrollTop=0}
function closeSheet(){$('#scrim').classList.remove('on');$('#sheet').classList.remove('on')}
$('#scrim').onclick=closeSheet;$('#shClose').onclick=closeSheet;addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
var tt;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2800)}
function success(title,msg){openSheet('',' <div class="done"><div class="ok">'+ICON('i-check')+'</div><h3>'+esc(title)+'</h3><p>'+msg+'</p></div>','<button class="btn block" id="okb">Done</button>');$('#okb').onclick=closeSheet;if(navigator.vibrate)try{navigator.vibrate([10,40,10])}catch(e){}}
function busy(btn,on,txt){if(!btn)return;btn.disabled=on;if(on){btn.dataset.t=btn.innerHTML;btn.innerHTML=txt||'Sending...'}else if(btn.dataset.t)btn.innerHTML=btn.dataset.t}
function fail(btn,e){busy(btn,false);toast(e.message||'Not sent, try again')}
function sessLine(s){return '<div class="card" style="box-shadow:none;background:var(--bg)"><b style="font-size:18px">'+dayLong(s.date)+' · '+hl(s.start)+'</b><div class="muted">'+tabName(s.tab)+' with '+esc(s.trainer)+'</div></div>'}
function dayChips(days,sel,id){return '<div class="chips" id="'+id+'">'+days.map(function(d){var x=dOf(d);return '<button class="chip" aria-pressed="'+(d===sel)+'" data-d="'+d+'"><small>'+(d===D.today?'Today':d===addDays(D.today,1)?'Tmrw':x.toLocaleDateString('en-GB',{weekday:'short'}))+'</small><b class="num">'+x.getDate()+'</b><small>'+x.toLocaleDateString('en-GB',{month:'short'})+'</small></button>'}).join('')+'</div>'}
function nextDays(n,from){var out=[],d=from||D.today;while(out.length<n){if(dOf(d).getDay()!==0)out.push(d);d=addDays(d,1)}return out}
function pickOne(sel,cb){$$(sel+' [aria-pressed]').forEach(function(b){b.onclick=function(){$$(sel+' [aria-pressed]').forEach(function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true');cb&&cb(b)}})}

function cancelSheet(s){if(!s)return;var early=s.date>D.today;
  openSheet('Cancel this session?',sessLine(s)+
   (early?'<div class="note" style="margin-top:14px">'+ICON('i-check')+'<span><b>You are cancelling a day or more before.</b> This session is not counted. You keep it.</span></div>'
         :'<div class="note bad" style="margin-top:14px">'+ICON('i-alert')+'<span><b>Late cancellation.</b> Your session is today, so cancelling now will be deducted from your passes (counts as done). Running late instead? Tell us and keep your session.</span></div>')+
   '<p class="muted" style="margin-top:12px;font-size:15px">Want another time instead? Rescheduling never costs a session.</p>',
   '<div class="btns"><button class="btn sec2" id="keep">Keep it</button><button class="btn '+(early?'ghost':'danger')+'" id="yes">'+(early?'Yes, cancel':'Cancel anyway')+'</button></div><button class="btn ghost block" style="margin-top:10px" id="rs">'+ICON('i-swap','width:18px;height:18px')+'Reschedule instead</button>');
  $('#keep').onclick=closeSheet;$('#rs').onclick=function(){reschSheet(s)};
  $('#yes').onclick=function(){var b=this;busy(b,true,'Cancelling...');send('app_cl_cancel',{ref:s.ref,id:s.id}).then(function(j){
    s.att=j.kind;ACC().upcoming=ACC().upcoming.filter(function(x){return x!==s});render();
    success(j.kind==='Early Cancel'?'Done, it\u2019s cancelled':'Cancelled, 1 session used',j.kind==='Early Cancel'?'You cancelled in time, so nothing is deducted. Your session stays on your package.':'Because it was cancelled on the same day, this session is deducted from your passes (late cancellation).')}).catch(function(e){fail(b,e)})}}

function reschSheet(s){if(!s)return;var days=nextDays(8,s.date>D.today?D.today:addDays(D.today,1)),sel='',part='';
  openSheet('Reschedule',sessLine(s)+'<div class="note" style="margin-top:12px">'+ICON('i-check')+'<span>Rescheduling never costs a session. Romy finds the new time and confirms with you.</span></div>'+
   '<div class="field"><span class="flabel">Which day suits you?</span>'+dayChips(days,'','rd')+'</div>'+
   '<div class="field"><span class="flabel">What time of day?</span><div class="seg" id="rp"><button aria-pressed="false" data-p="Morning">Morning</button><button aria-pressed="false" data-p="Afternoon">Afternoon</button><button aria-pressed="false" data-p="Evening">Evening</button></div></div>'+

  $$('[data-fmt]').forEach(function(b){b.onclick=function(){var f=b.dataset.fmt,nm={'1:1':'private 1:1','1:2':'duo 1:2','1:3':'small group 1:3'}[f];
    window.open(waLink('Hi Romy, this is '+a.name+'. I would like to book a '+nm+' training session. What times work this week?'),'_blank');closeSheet()}})};
ACT.session=function(){var a=ACC();if(a.grid&&a.grid.length)return gridSheet(a);return ACT.sessionForm()};
function gridSheet(a){var days=[],by={};a.grid.forEach(function(g){if(!by[g.date]){by[g.date]=[];days.push(g.date)}by[g.date].push(g)});var sel=days[0];
  var list=function(){return '<div class="slots">'+by[sel].map(function(g,i){return '<button class="slot '+g.state+'" data-g="'+i+'"><b>'+hl(g.start)+'</b><div class="grow">'+(g.trainer?'with '+esc(g.trainer):'Small group 1:3')+'<span>'+(g.state==='instant'?g.spots+' spot'+(g.spots>1?'s':'')+' left':g.state==='full'?'Full':'Romy confirms it with you')+'</span></div><span class="tagx">'+(g.state==='instant'?'Book instantly':g.state==='full'?'Full':'Request to book')+'</span></button>'}).join('')+'</div>'};
  openSheet('Book a session','<div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:4px"><span class="pill">Small group 1:3</span><span class="pill mute">'+a.canJoin+' session'+(a.canJoin===1?'':'s')+' to book</span></div>'+
   '<div class="field"><span class="flabel">Pick a day</span>'+dayChips(days,sel,'gd')+'</div><div class="field"><span class="flabel">Pick a time</span><div id="gl">'+list()+'</div></div>'+
   '<p class="muted" style="font-size:13.5px;margin-top:12px"><b>Book instantly</b>: a group is already running, you are in straight away. <b>Request to book</b>: Romy opens the hour and confirms on WhatsApp.</p>',
   '<button class="btn ghost block" id="gOther">Another type or time? Message Romy</button>');
  var bindL=function(){$$('[data-g]').forEach(function(b){b.onclick=function(){var g=by[sel][+b.dataset.g];
    if(g.state==='instant')return joinSheet({date:g.date,start:g.start,trainer:g.trainer,spots:g.spots});
    openSheet('Request this time?','<div class="card" style="box-shadow:none;background:var(--bg)"><b style="font-size:18px">'+dayLong(g.date)+' · '+hl(g.start)+'</b><div class="muted">Small group 1:3</div></div><div class="note" style="margin-top:12px">'+ICON('i-check')+'<span>Romy confirms it with you on WhatsApp. It uses 1 session of your package once confirmed.</span></div>','<button class="btn block" id="go">Send request</button>');
    $('#go').onclick=function(){var bb=this;busy(bb,true);send('app_cl_request',{kind:'session',what:'Small group 1:3',when:dayShort(g.date)+' '+hl(g.start)+' ('+g.date+' '+g.start+')',note:''}).then(function(){success('Request sent','Romy will confirm '+dayLong(g.date)+' at '+hl(g.start)+' on WhatsApp.')}).catch(function(e){fail(bb,e)})}}})};
  bindL();pickOne('#gd',function(b){sel=b.dataset.d;$('#gl').innerHTML=list();bindL()});
  $('#gOther').onclick=function(){ACT.sessionForm()}}
ACT.sessionForm=function(){var a=ACC(),kinds=[];a.pkgs.forEach(function(p){if(p.phase!=='past'&&kinds.indexOf(p.kind)<0)kinds.push(p.kind)});if(!kinds.length)kinds=['1:3'];
  var what=kinds[0],sel='',part='';
  openSheet('Request a session',(kinds.length>1?'<div class="field" style="margin-top:0"><span class="flabel">Type</span><div class="seg" id="sk">'+kinds.map(function(k,i){return '<button aria-pressed="'+(i===0)+'" data-k="'+k+'">'+tabName(k)+'</button>'}).join('')+'</div></div>':'<div class="card" style="box-shadow:none;background:var(--bg)"><b>'+tabName(what)+'</b></div>')+
   '<div class="field"><span class="flabel">Which day?</span>'+dayChips(nextDays(10,addDays(D.today,1)),'','sd')+'</div>'+
   '<div class="field"><span class="flabel">Time of day</span><div class="seg" id="sp"><button aria-pressed="false" data-p="Morning">Morning</button><button aria-pressed="false" data-p="Afternoon">Afternoon</button><button aria-pressed="false" data-p="Evening">Evening</button></div></div>'+
   '<div class="field"><label for="sn">Note (optional)</label><input class="inp" id="sn" placeholder="e.g. every Tuesday at 7 PM"></div>','<button class="btn block" id="go">Send request</button>');
  pickOne('#sk',function(b){what=b.dataset.k});pickOne('#sd',function(b){sel=b.dataset.d});pickOne('#sp',function(b){part=b.dataset.p});
  $('#go').onclick=function(){var b=this,note=$('#sn').value.trim();if(!sel&&!note){toast('Pick a day or write a note');return}
    busy(b,true);send('app_cl_request',{kind:'session',what:tabName(what),when:(sel?dayShort(sel):'any day')+(part?' '+part:''),note:note}).then(function(){success('Request sent','Romy will book it and message you to confirm.')}).catch(function(e){fail(b,e)})}};
ACT.physio=function(){var days=[],by={};(D.slots||[]).forEach(function(s){if(!by[s.d]){by[s.d]=[];days.push(s.d)}by[s.d].push(s.t)});
  if(!days.length){openSheet('Book your physio visit','<div class="note warn">'+ICON('i-alert')+'<span>Majd is fully booked for the next 2 weeks.</span></div>','<a class="btn wa block" target="_blank" href="'+waLink('Hi Romy, this is '+ACC().name+'. I want a physio visit with Majd but the app shows no free time. Can you find me one?')+'">'+ICON('i-wa')+'Ask Romy for a time</a>');return}
  var sel=days[0],t='';
  var times=function(){return '<div class="times" id="pt">'+by[sel].map(function(x){return '<button aria-pressed="false" data-t="'+x+'">'+hl(x)+'</button>'}).join('')+'</div>'};
  openSheet('Book your physio visit','<div class="row" style="gap:10px;margin-bottom:6px"><span class="pill">60 min with Majd</span></div>'+
   '<div class="field"><span class="flabel">Pick a day</span>'+dayChips(days,sel,'pd')+'</div><div class="field"><span class="flabel">Pick a time</span><div id="ptw">'+times()+'</div></div>'+
   '<div class="field"><label for="pn">What should Majd know? (optional)</label><input class="inp" id="pn" placeholder="e.g. lower back pain since last week"></div>'+
   '<p class="muted" style="font-size:14px;margin-top:12px">This is a request. Romy confirms with Majd and messages you. Pay at the center.</p>','<button class="btn danger block" id="go" disabled>Choose a time</button>');
  var go=$('#go'),bt=function(){pickOne('#pt',function(b){t=b.dataset.t;go.disabled=false;go.textContent='Request '+dayShort(sel)+', '+hl(t)})};bt();
  pickOne('#pd',function(b){sel=b.dataset.d;t='';$('#ptw').innerHTML=times();go.disabled=true;go.textContent='Choose a time';bt()});
  go.onclick=function(){busy(go,true);send('app_cl_request',{kind:'physio',d:sel,t:t,note:$('#pn').value.trim()}).then(function(){ACC().physio.pending=true;render();success('Physio request sent','Romy confirms '+dayLong(sel)+' at '+hl(t)+' with Majd and messages you on WhatsApp.')}).catch(function(e){fail(go,e);boot(true)})}};
ACT.m3=function(){var o=ACC().offers.m3;
  openSheet('3 months, 7% off','<div class="card" style="box-shadow:none;background:var(--bg)"><b style="font-size:18px">'+esc(o.type)+'</b><div class="row" style="align-items:baseline;gap:10px;margin-top:6px"><b style="font:800 34px var(--display)">'+money(o.p3)+'</b><s>'+money(o.t3)+'</s><span class="pill">Save '+money(o.save)+'</span></div><div class="muted">3 months, one payment. Starts when your current package ends ('+dmy(o.starts)+').</div></div>'+
   '<div class="note" style="margin-top:12px">'+ICON('i-check')+'<span>Same spot, same coach, price locked for 3 months.</span></div>','<button class="btn block" id="go">Yes, I want it</button>');
  $('#go').onclick=function(){var b=this;busy(b,true);send('app_cl_request',{kind:'offer3'}).then(function(){success('Great choice!','Romy will message you to set it up. Pay at the center.')}).catch(function(e){fail(b,e)})}};
ACT.m6=function(){var o=ACC().offers.m6;
  openSheet('Upgrade to 6 months','<div class="card" style="box-shadow:none;background:var(--bg)"><div class="muted">You paid for months 1 to 3</div><b style="font-size:18px">'+esc(o.type)+'</b><div class="row" style="align-items:baseline;gap:10px;margin-top:6px"><span class="muted">Pay now</span><b style="font:800 34px var(--display)">'+money(o.due)+'</b></div><div class="muted">6 months for '+money(o.p6)+' instead of '+money(o.t6)+' (15% off all 6 months)</div></div>'+
   '<div class="list" style="margin-top:12px">'+[0,1,2].map(function(k){return '<div class="item"><div class="mini"><small>Month</small><b>'+(4+k)+'</b></div><div class="grow"><div class="t">From '+dmy(addDays(o.starts,30*k))+'</div><div class="s">'+money(k<2?o.each:o.due-o.each*2)+'</div></div>'+ICON('i-check','color:var(--mint-deep)')+'</div>'}).join('')+'</div>'+
   '<p class="muted" style="font-size:14px;margin-top:12px">Months 4, 5 and 6 are added to your plan right away. Pay '+money(o.due)+' at the center at your next session.</p>','<button class="btn block" id="go">Upgrade me to 6 months</button>');
  $('#go').onclick=function(){var b=this;busy(b,true,'Upgrading...');send('app_cl_upgrade6',{}).then(function(j){success('You’re on 6 months!','Months 4 to 6 are in your plan. Pay '+money(j.due)+' at the center.')}).catch(function(e){fail(b,e)})}};
ACT.order=function(){var it=shopItems(),c=cartTotal(),lines=Object.keys(CART).map(function(k){var x=it.filter(function(y){return y.n===k})[0];return x?{x:x,q:CART[k]}:null}).filter(Boolean);
  if(!lines.length)return;
  openSheet('Your order','<div class="list">'+lines.map(function(l){return '<div class="item">'+(l.x.img?'<img src="'+IMG[l.x.img]+'" alt="" style="width:44px;height:44px;object-fit:contain" referrerpolicy="no-referrer" onerror="this.outerHTML=\'<span class=ph2 style=width:44px;height:44px>'+esc(l.x.n[0])+'</span>\'">':'<span class="ph2" style="width:44px;height:44px">'+esc(l.x.n[0])+'</span>')+'<div class="grow"><div class="t">'+esc(l.x.n)+'</div><div class="s">'+l.q+' x '+money(l.x.price)+(l.x.left<l.q?' · we order it in':'')+'</div></div><b class="num">'+money(l.x.price*l.q)+'</b></div>'}).join('')+'</div>'+
   '<div class="row" style="justify-content:space-between;margin:16px 4px 4px"><b style="font-size:18px">Total</b><b class="num" style="font:800 30px var(--display)">'+money(c.t)+'</b></div>'+
   '<div class="note" style="margin-top:8px">'+ICON('i-bag')+'<span>We get it ready for you at Wellbe. Pay and pick it up at your next session.</span></div>','<button class="btn block" id="go">'+ICON('i-bag')+'Pick up from center · '+money(c.t)+'</button>');
  $('#go').onclick=function(){var b=this;busy(b,true,'Ordering...');send('app_cl_request',{kind:'order',items:lines.map(function(l){return {n:l.x.n,q:l.q}})}).then(function(j){CART={};store('wbc_cart','{}');render();success('See you at the center!','Total '+money(j.total)+'. Romy gets your order ready, pick it up at your next session.')}).catch(function(e){fail(b,e)})}};
function addedSheet(n){var c=cartTotal();
  openSheet('',' <div class="done"><div class="ok">'+ICON('i-bag')+'</div><h3>Added to your order</h3><p>'+esc(n)+'<br><b>'+c.n+' item'+(c.n>1?'s':'')+' · '+money(c.t)+'</b></p></div>',
   '<button class="btn block" id="aPick">'+ICON('i-bag')+'Pick up from center</button><button class="btn ghost block" style="margin-top:8px" id="aMore">Keep shopping</button>');
  $('#aPick').onclick=function(){ACT.order()};$('#aMore').onclick=closeSheet}
function prodSheet(n){var x=shopItems().filter(function(y){return y.n===n})[0];if(!x)return;
  openSheet(x.n,'<div style="display:grid;place-items:center;background:linear-gradient(180deg,#f5f8f7,#e8efed);border-radius:18px;padding:16px;height:220px">'+imgTag(x,190)+'</div>'+
   '<div class="row" style="justify-content:space-between;margin-top:14px"><div><div class="muted" style="font-size:14px">'+esc(x.desc)+'</div><div class="muted" style="font-size:13px">'+(x.left?'In stock':'We order it in for you')+'</div></div><b class="num" style="font:800 32px var(--display)">'+money(x.price)+'</b></div>'+
   '<p class="muted" style="font-size:14px;margin-top:10px">Pay and pick up at your next session. No delivery fee.</p>',
   '<button class="btn block" id="pAdd">'+ICON('i-plus')+(CART[x.n]?'Add one more ('+CART[x.n]+' in your order)':'Add to my order')+'</button><button class="btn ghost block" style="margin-top:8px" id="pShop">See all supplements</button>');
  $('#pAdd').onclick=function(){setQty(x.n,1);addedSheet(x.n)};
  $('#pShop').onclick=function(){closeSheet();VIEW='shop';render();scrollTo(0,0)}}
ACT.supp=function(){openSheet('Ask for a supplement','<div class="field" style="margin-top:0"><label for="sq">Which supplement or brand?</label><textarea class="inp" id="sq" placeholder="e.g. Omega 3, magnesium, a vegan protein"></textarea></div>','<button class="btn block" id="go">Send</button>');
  $('#go').onclick=function(){var b=this,v=$('#sq').value.trim();if(!v){toast('Write the supplement name');return}busy(b,true);send('app_cl_request',{kind:'supp',note:v}).then(function(){success('Sent','Romy checks it and tells you the price.')}).catch(function(e){fail(b,e)})}};

/* ---------- start ---------- */
render();boot();
document.addEventListener('visibilitychange',function(){if(!document.hidden&&TOKEN&&D)boot(true)});
</script>
