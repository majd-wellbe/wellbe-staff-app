<style>

/* place name: a location pin chip at the bottom middle, above the swipe hint and below the runner; slides up and fades out */
.zone{position:absolute;left:50%;bottom:calc(60px + env(safe-area-inset-bottom));z-index:3;pointer-events:none;display:flex;align-items:center;gap:9px;max-width:calc(100% - 32px);padding:7px 16px 7px 10px;border-radius:99px;background:rgba(16,24,28,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;transform:translate(-50%,14px);visibility:hidden}

.spr:not([hidden])~.zone{bottom:calc(14px + env(safe-area-inset-bottom))}
