<style>

.ch.sel{box-shadow:0 0 0 4px #ffc23d,0 10px 26px rgba(0,0,0,.25)}.ch .you{position:absolute;top:8px;left:8px;background:#ffc23d;color:#10181c;font:400 11px var(--disp);letter-spacing:.06em;padding:4px 8px;border-radius:99px}

<div id="pick"><button class="back" id="exit" hidden>← Back to Wellbe</button><h1>CORNICHE RUN</h1><p>Pick your runner. Dodge, jump, slide and grab coins along Beirut’s sea. Your coach is right behind you.</p><div class="grid" id="grid"></div></div>
<div class="load" id="load">Loading your runner…</div>
<div id="game"><div id="cv"></div>
 <div class="hud"><div class="pill lives" id="lives"></div><div class="pill score"><b id="sc">0</b><span>SCORE</span></div><div class="pill coins"><b id="cn">0</b><span id="bs">BEST 0</span></div></div>
 <div class="mult" id="mult" hidden>x1</div>
 <div class="pw" id="pw"></div>
 <button class="cbtn" id="mute" aria-label="Sound">🔊</button><button class="cbtn" id="pause" aria-label="Pause">❚❚</button>
 <div class="msg" id="msg"></div><div class="zone" id="zone"><b id="zb"></b><span id="zs"></span></div>
 <div class="hint" id="hint"><span>Swipe ← → to change lane · ↑ jump · ↓ slide</span></div>
 <div class="flash" id="flash"></div>
 <div class="pz" id="pz"><div><h2>PAUSED</h2><p id="pzs"></p><button id="resume">Resume</button><button id="pquit">End run</button><button id="pchg">Change runner</button></div></div>
 <div class="count" id="count">3</div>
 <div class="end" id="end"><h2 id="eh">CAUGHT!</h2><div class="big"><div><b id="em">0</b><span>SCORE</span></div><div><b id="ec">0</b><span>COINS</span></div><div><b id="ed">0 m</b><span>DISTANCE</span></div></div><div class="sub" id="es"></div><div class="btns"><button id="again">Run again</button><button id="back">Change runner</button></div><button id="home" class="homeb" hidden>← Back to Wellbe</button></div>
</div>

var $=function(s){return document.querySelector(s)},D2R=Math.PI/180,store=function(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};

document.querySelectorAll('.ch').forEach(function(b){b.onclick=function(){start(+b.dataset.i)}});

/* ---------- rig: the lunge is computed on a simple skeleton, then copied onto the 3D model's bones ---------- */
function V(x,y,z){return new THREE.Vector3(x,y,z)}
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function ikP(A,C,l1,l2,poleT){var ax=C.clone().sub(A),d=ax.length();d=Math.min(d,l1+l2-0.002);d=Math.max(d,Math.abs(l1-l2)+0.002);ax.normalize();

  var a=Math.acos(Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*d))));return A.clone().addScaledVector(ax,l1*Math.cos(a)).addScaledVector(p,l1*Math.sin(a))}
var SZ=.2,HZ=.09;

  J.sh=[shC.clone().setZ(SZ),shC.clone().setZ(-SZ)];J.hp=[J.pel.clone().setZ(HZ),J.pel.clone().setZ(-HZ)];return J}

function arms(J,ha,poles){J.ha=ha;J.el=[0,1].map(function(s){return ikP(J.sh[s],ha[s],.27,.25,poles[s])})}
// one walking lunge, u = 0..1 from the bottom of one lunge to the bottom of the next. Planted foot never slides; back leg steps through
function walkJ(S,u,swing,low,wt){var e=ease(u),hx=-.45*S+S*e,hy=low+(.67-low)*Math.sin(Math.PI*u),J=base(hy,4);
  var an=[];an[swing]=V(-S+2*S*e-hx,.14*Math.sin(Math.PI*u),swing?-HZ:HZ);an[1-swing]=V(-hx,0,swing?HZ:-HZ);legs(J,an);
  var sw=wt?.05:.17,ha=[0,1].map(function(s){var f=(s===swing?-1:1)*sw*(2*e-1),sd=s?-1:1;return V(J.sh[s].x+f,J.sh[s].y-.48,J.sh[s].z+sd*(wt?.07:.03))});

  var sw=wt?.06:.13+.12*k,ha=[0,1].map(function(s){var q=th+s*Math.PI;return V(J.sh[s].x-sw*Math.sin(q)+.1,J.sh[s].y-.3+.05*Math.cos(q),J.sh[s].z+(s?-.04:.04))});
  arms(J,ha,[0,1].map(function(s){return V(J.sh[s].x-.5,J.sh[s].y-.2,J.sh[s].z+(s?-.15:.15))}));return J}

  arms(J,[V(J.sh[0].x+.15,J.sh[0].y+.42,SZ+.08),V(J.sh[1].x+.15,J.sh[1].y+.42,-SZ-.08)],[V(-.5,1.2,1),V(-.5,1.2,-1)]);return J}

  // print on the back of the shirt (follows the upper back bone)
