<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<style>
:root{--ink:#10181c;--pink:#e0457a;--crim:#a3263f;--mint:#1f6e5b;--sun:#ffc23d;--sea:#0fa3c9;--card:#fff;--disp:'Archivo Black',Impact,system-ui,sans-serif;--body:Inter,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#0b1418;color:#fff;font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
#pick{position:fixed;inset:0;overflow-y:auto;touch-action:pan-y;background:linear-gradient(180deg,#ffd9a8 0%,#ff9a8b 32%,#2fb6d6 70%,#0b6f8f 100%);padding:calc(18px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 30px max(16px,env(safe-area-inset-left))}
#pick h1{font:400 40px/1 var(--disp);margin:6px 0 4px;color:#10181c;letter-spacing:-.01em}#pick p{margin:0 0 16px;color:#10181c;font-weight:700;opacity:.8}
.back{display:inline-flex;align-items:center;gap:6px;background:rgba(16,24,28,.82);color:#fff;font-weight:800;font-size:15px;padding:9px 14px;border-radius:99px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:520px}
.ch{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:3/4;background:#e9eef0;box-shadow:0 10px 26px rgba(0,0,0,.25)}
.ch img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.ch .tag{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(16,24,28,.82);border-radius:14px;padding:7px 9px;text-align:left}
.ch .tag b{display:block;font:400 15px var(--disp)}.ch .tag span{font-size:11.5px;opacity:.85;font-weight:700}
#game{position:fixed;inset:0;display:none}
#cv{position:absolute;inset:0}#cv canvas{display:block;width:100%!important;height:100%!important}
.hud{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));z-index:3;pointer-events:none}
.row1{display:flex;align-items:center;gap:8px}
.pill{background:rgba(16,24,28,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:16px;padding:7px 11px;line-height:1}
.hearts{font-size:20px;letter-spacing:1px}.timer{flex:1;text-align:center}.timer b{font:400 30px var(--disp);display:block}.timer span,.dist span{font-size:10.5px;font-weight:800;letter-spacing:.1em;opacity:.8}
.dist{text-align:right}.dist b{font:400 26px var(--disp);display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.bar span{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.bar div{height:9px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:100%;background:#7ef0c8;transition:width .12s}.bar.pace i{background:var(--sun)}.bar i.low{background:var(--pink)}
.badge{display:inline-block;margin-top:8px;font-size:12px;font-weight:800;background:var(--crim);border-radius:99px;padding:4px 10px}
.mute{pointer-events:auto;position:absolute;right:max(12px,env(safe-area-inset-right));top:calc(126px + env(safe-area-inset-top));width:40px;height:40px;border-radius:50%;background:rgba(16,24,28,.55);font-size:18px;z-index:4}
.call{position:absolute;left:0;right:0;top:36%;text-align:center;font:400 56px var(--disp);text-shadow:0 6px 24px rgba(0,0,0,.45);opacity:0;transform:scale(.8);transition:all .12s;z-index:3;pointer-events:none}.call.on{opacity:1;transform:none}
.msg{position:absolute;left:50%;top:24%;transform:translate(-50%,-8px);z-index:3;padding:8px 16px;border-radius:99px;background:rgba(16,24,28,.75);font-weight:800;font-size:16px;opacity:0;transition:all .2s;white-space:nowrap;pointer-events:none}
.msg.on{opacity:1;transform:translate(-50%,0)}.msg.ok{color:#7ef0c8}.msg.bad{color:#ff9fbd}
.zone{position:absolute;left:0;right:0;top:44%;text-align:center;z-index:3;pointer-events:none;opacity:0;transition:opacity .4s}.zone.on{opacity:1}
.zone b{display:block;font:400 44px/1 var(--disp);color:var(--sun);text-shadow:0 6px 24px rgba(0,0,0,.5)}.zone span{font-weight:800;font-size:17px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.pad{position:absolute;left:0;right:0;bottom:0;z-index:3;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 max(12px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));height:17vh;min-height:120px;grid-template-rows:1fr auto}
.z{border-radius:24px;display:grid;place-items:center;font:400 24px var(--disp);letter-spacing:.08em;background:rgba(16,24,28,.28);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5);touch-action:none}
.z.hit{animation:zh .14s}.z.bad{background:rgba(163,38,63,.75)}@keyframes zh{50%{transform:scale(.95)}}
.help{grid-column:1/-1;justify-self:center;font-size:11.5px;font-weight:700;background:rgba(16,24,28,.6);border-radius:99px;padding:5px 12px}
.count{position:absolute;inset:0;display:grid;place-items:center;font:400 96px var(--disp);background:linear-gradient(180deg,rgba(11,20,24,.35),rgba(11,20,24,0) 45%);z-index:6;pointer-events:none;text-align:center;text-shadow:0 6px 24px rgba(0,0,0,.45)}.count small{display:block;font:800 18px/1.3 var(--body);margin-bottom:10px}
.quit{position:absolute;left:max(12px,env(safe-area-inset-left));top:calc(126px + env(safe-area-inset-top));width:40px;height:40px;border-radius:50%;background:rgba(16,24,28,.55);z-index:4}
.end{position:absolute;inset:0;z-index:7;display:none;flex-direction:column;justify-content:flex-end;padding:20px max(16px,env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:linear-gradient(180deg,rgba(11,20,24,0) 20%,rgba(11,20,24,.94) 55%)}
.end h2{font:400 52px/1 var(--disp);margin:0;color:var(--sun)}.end .big{font-size:20px;margin-top:8px}.end .big b{font:400 30px var(--disp)}
.end .sub{opacity:.85;margin-top:6px;font-weight:700}.end .btns{display:flex;gap:10px;margin-top:18px}
.end .btns button{flex:1;min-height:54px;border-radius:16px;font-weight:800;font-size:17px;background:var(--pink)}.end .btns button+button{background:rgba(255,255,255,.14)}
.spark{position:absolute;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:8;animation:sp .9s ease-out forwards}@keyframes sp{to{transform:translate(var(--x),var(--y));opacity:0}}
.load{position:fixed;inset:0;display:none;place-items:center;background:#0b1418;z-index:9;font-weight:800;text-align:center;padding:20px}
</style>

<div id="pick"><button class="back" id="exit" hidden>← Back to Wellbe</button><h1>CORNICHE RUN</h1><p>Pick your runner. Race along the sea, your coach is chasing you. How far can you go?</p><div class="grid" id="grid"></div></div>
<div class="load" id="load">Loading your athlete…</div>
<div id="game"><div id="cv"></div>
 <div class="hud"><div class="row1"><div class="pill hearts" id="hearts"></div><div class="pill timer"><b id="tm">0:00</b><span>TIME</span></div><div class="pill dist"><b id="mt">0 m</b><span id="bs">BEST 0 m</span></div></div>
  <div class="row2"><div class="pill bar"><span>Stamina</span><div><i id="sta"></i></div></div><div class="pill bar pace"><span id="gapt">Coach 7 m behind</span><div><i id="gap"></i></div></div></div><span class="badge" id="badge" hidden></span></div>
 <button class="mute" id="mute" aria-label="Sound">🔊</button><button class="quit" id="quit" aria-label="Stop">✕</button>
 <div class="call" id="call"></div><div class="msg" id="msg"></div><div class="zone" id="zone"><b id="zb"></b><span id="zs"></span></div>
 <div class="pad"><div class="z" data-s="l">LEFT</div><div class="z" data-s="r">RIGHT</div><div class="help">Tap left, right fast to run · swipe ↑ jump · ↓ slide</div></div>
 <div class="count" id="count">3</div>
 <div class="end" id="end"><h2 id="eh">GAME OVER</h2><div class="big"><b id="em">0</b> meters in <b id="et">0:00</b></div><div class="sub" id="es"></div><div class="btns"><button id="again">Run again</button><button id="back">Change athlete</button></div></div>
</div>
<script>
/* ---------- characters: 3D models made from these images ---------- */
var CDN='https://d2ol7oe51mr4n9.cloudfront.net/user_3FXl8unlEq04htattdPxfwi7yXL/';
var CHARS=[
 {img:'29d62ee4-0fab-4f8b-b082-9db1d3a8ac71.webp',glb:'dcd96293-3c49-4357-8218-342cc0af2869.glb',h:1.65,t:'Runner',d:'Fast feet',st:{str:0,end:2,agi:3,stb:0}},
 {img:'e59d7954-b2eb-4b33-a08a-1e6ed7e8e8a9.webp',glb:'99e2a66e-f32c-43b1-879d-09de81012a90.glb',h:1.65,t:'All rounder',d:'Best stamina',st:{str:1,end:3,agi:1,stb:0}},
 {img:'328f010c-8bfe-4264-811e-423940c58df0.webp',glb:'7f434260-ab8b-43fd-a104-6d31499b5163.glb',h:1.64,t:'Power legs',d:'Long strides, steady',st:{str:3,end:1,agi:0,stb:2}},
 {img:'619911df-97ac-4ab8-8b8c-95848d115cbf.webp',glb:'252ae7c8-f604-43ae-9c2f-709314f69432.glb',h:1.63,t:'Steady pacer',d:'Stamina and balance',st:{str:0,end:3,agi:1,stb:2}},
 {img:'1a6e4965-75a6-4c50-81e0-f8bbe6594a25.webp',glb:'90ed38a2-6cb6-4fdf-be21-c260342fe6b9.glb',h:1.78,t:'Sprinter',d:'Fast feet, quick reactions',st:{str:1,end:1,agi:3,stb:0}},
 {img:'68ddfed1-5224-4e37-acbb-962a7f39f1df.webp',glb:'651e4c9e-9307-4cf4-8e91-eee43ac80c55.glb',h:1.82,t:'Powerlifter',d:'Huge strides, heavy',st:{str:4,end:0,agi:0,stb:2}},
 {img:'4333c723-77f0-4852-84d7-40b96a19b209.webp',glb:'edbcabc5-722f-44a0-ba10-abbad659e31a.glb',h:1.76,t:'Balanced',d:'A bit of everything',st:{str:1,end:2,agi:1,stb:1}},
 {img:'34c1619a-c138-4384-b61b-c76e49f5506c.webp',glb:'b4d5f053-d620-4a57-931e-35b8b791c7f2.glb',h:1.74,t:'The rock',d:'Hard to knock down',st:{str:2,end:1,agi:0,stb:3}}];
var $=function(s){return document.querySelector(s)},D2R=Math.PI/180,store=function(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
$('#grid').innerHTML=CHARS.map(function(c,i){return '<button class="ch" data-i="'+i+'"><img alt="" src="'+CDN+c.img+'"><div class="tag"><b>'+c.t+'</b><span>'+c.d+'</span></div></button>'}).join('');
if(window.parent!==window){$('#exit').hidden=false;$('#exit').onclick=function(){try{AU.ctx&&AU.ctx.suspend()}catch(e){}parent.postMessage('wb-close','*')}}
document.querySelectorAll('.ch').forEach(function(b){b.onclick=function(){start(+b.dataset.i)}});

/* ---------- rig: the lunge is computed on a simple skeleton, then copied onto the 3D model's bones ---------- */
function V(x,y,z){return new THREE.Vector3(x,y,z)}
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function ikP(A,C,l1,l2,poleT){var ax=C.clone().sub(A),d=ax.length();d=Math.min(d,l1+l2-0.002);d=Math.max(d,Math.abs(l1-l2)+0.002);ax.normalize();
  var p=poleT.clone().sub(A);p.addScaledVector(ax,-p.dot(ax));if(p.lengthSq()<1e-8)p.set(0,0,1);p.normalize();
  var a=Math.acos(Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*d))));return A.clone().addScaledVector(ax,l1*Math.cos(a)).addScaledVector(p,l1*Math.sin(a))}
var SZ=.2,HZ=.09;
function base(hy,tor){var up=V(Math.sin(tor*D2R),Math.cos(tor*D2R),0),J={tor:tor,up:up,pel:V(0,hy,0)};var shC=J.pel.clone().addScaledVector(up,.44);J.shC=shC;
  J.sh=[shC.clone().setZ(SZ),shC.clone().setZ(-SZ)];J.hp=[J.pel.clone().setZ(HZ),J.pel.clone().setZ(-HZ)];return J}
function legs(J,an){J.an=an;J.kn=[0,1].map(function(s){return ikP(J.hp[s],an[s],.34,.34,J.hp[s].clone().add(V(1,-.15,0)))})}
function arms(J,ha,poles){J.ha=ha;J.el=[0,1].map(function(s){return ikP(J.sh[s],ha[s],.27,.25,poles[s])})}
// one walking lunge, u = 0..1 from the bottom of one lunge to the bottom of the next. Planted foot never slides; back leg steps through
function walkJ(S,u,swing,low,wt){var e=ease(u),hx=-.45*S+S*e,hy=low+(.67-low)*Math.sin(Math.PI*u),J=base(hy,4);
  var an=[];an[swing]=V(-S+2*S*e-hx,.14*Math.sin(Math.PI*u),swing?-HZ:HZ);an[1-swing]=V(-hx,0,swing?HZ:-HZ);legs(J,an);
  var sw=wt?.05:.17,ha=[0,1].map(function(s){var f=(s===swing?-1:1)*sw*(2*e-1),sd=s?-1:1;return V(J.sh[s].x+f,J.sh[s].y-.48,J.sh[s].z+sd*(wt?.07:.03))});
  arms(J,ha,[0,1].map(function(s){return V(J.sh[s].x-.4,J.sh[s].y-.2,J.sh[s].z+(s?-.1:.1))}));J.hx=hx;return J}
// running: ph counts strides, k = how fast (0..1). Knee drive, foot strike under the hip, arms pumping at 90 degrees
function runJ(ph,k,wt){var th=ph*Math.PI*2,A=.18+.2*k,Lf=.1+.17*k,J=base(.62-.03*k+.03*Math.abs(Math.cos(th)),6+9*k),an=[];
  [0,1].forEach(function(s){var q=th+s*Math.PI;an[s]=V(A*Math.sin(q)+.04,Lf*Math.max(0,Math.cos(q))+.04*k*Math.max(0,-Math.sin(q)),s?-HZ:HZ)});legs(J,an);
  var sw=wt?.06:.13+.12*k,ha=[0,1].map(function(s){var q=th+s*Math.PI;return V(J.sh[s].x-sw*Math.sin(q)+.1,J.sh[s].y-.3+.05*Math.cos(q),J.sh[s].z+(s?-.04:.04))});
  arms(J,ha,[0,1].map(function(s){return V(J.sh[s].x-.5,J.sh[s].y-.2,J.sh[s].z+(s?-.15:.15))}));return J}
function jumpJ(u){var J=base(.6+.08*Math.sin(Math.PI*u),-4),t=Math.sin(Math.PI*u);legs(J,[V(.12,.16*t,HZ),V(-.08,.2*t,-HZ)]);
  arms(J,[V(J.sh[0].x+.15,J.sh[0].y+.42,SZ+.08),V(J.sh[1].x+.15,J.sh[1].y+.42,-SZ-.08)],[V(-.5,1.2,1),V(-.5,1.2,-1)]);return J}
function slideJ(u){var J=base(.3,22),k=.5;legs(J,[V(.5,0,HZ),V(-.2,0,-HZ)]);
  arms(J,[V(J.sh[0].x+.36,J.sh[0].y-.06,SZ),V(J.sh[1].x-.25,J.sh[1].y-.36,-SZ)],[V(0,-1,1),V(-1,0,-1)]);return J}
function tripJ(){var J=base(.42,55);legs(J,[V(.2,0,HZ),V(-.25,.08,-HZ)]);arms(J,[V(J.sh[0].x+.3,.05,SZ),V(J.sh[1].x+.3,.05,-SZ)],[V(-1,0,1),V(-1,0,-1)]);return J}
function standJ(t){var J=base(.67+.005*Math.sin(t*2),0);legs(J,[V(.03,0,HZ),V(-.03,0,-HZ)]);arms(J,[V(J.sh[0].x+.02,J.sh[0].y-.49,SZ+.04),V(J.sh[1].x-.02,J.sh[1].y-.49,-SZ-.04)],[V(-1,0,1),V(-1,0,-1)]);return J}

/* ---------- the 3D model, driven bone by bone ---------- */
var loader=new THREE.GLTFLoader(),MODELS={};
function loadModel(i){if(MODELS[i])return Promise.resolve(MODELS[i]);return new Promise(function(res,rej){loader.load(CDN+CHARS[i].glb,function(g){MODELS[i]=g;res(g)},undefined,rej)})}
function Rig(gltf,height){var root=gltf.scene,holder=new THREE.Group(),B={};
  root.traverse(function(o){if(o.isBone)B[o.name]=o;if(o.isMesh){o.frustumCulled=false;if(o.material)o.material.metalness=0}});
  holder.add(root);root.rotation.y=Math.PI/2;root.position.set(0,0,0);root.scale.set(1,1,1);root.updateMatrixWorld(true);
  var rest={};Object.keys(B).forEach(function(k){rest[k]=B[k].quaternion.clone()});
  var wy=function(n){return B[n].getWorldPosition(V(0,0,0)).y};
  var g0=Math.min(wy('LeftToeBase'),wy('RightToeBase'))-0.02,s=height/(wy('head_end')-g0);root.scale.set(s,s,s);root.updateMatrixWorld(true);
  root.position.y=-(Math.min(wy('LeftToeBase'),wy('RightToeBase'))-0.02*s);root.updateMatrixWorld(true);
  var w=function(n){return B[n].getWorldPosition(V(0,0,0))};
  var leg=w('RightUpLeg').distanceTo(w('RightLeg'))+w('RightLeg').distanceTo(w('RightFoot')),upY=w('RightUpLeg').y,ftY=w('RightFoot').y;
  var hipsRest=B.Hips.position.clone(),_q=new THREE.Quaternion(),_pq=new THREE.Quaternion(),_d=V(0,0,0);
  function aim(name,child,dir){var b=B[name],c=B[child];if(!b||!c)return;b.updateMatrixWorld(true);
    var pb=b.getWorldPosition(V(0,0,0)),pc=c.getWorldPosition(V(0,0,0));_d.subVectors(pc,pb).normalize();
    _q.setFromUnitVectors(_d,dir.clone().normalize());var wq=b.getWorldQuaternion(new THREE.Quaternion());b.parent.getWorldQuaternion(_pq);
    b.quaternion.copy(_pq.invert().multiply(_q.multiply(wq)));b.updateMatrixWorld(true)}
  function pose(J,x,lift){Object.keys(rest).forEach(function(k){B[k].quaternion.copy(rest[k])});B.Hips.position.copy(hipsRest);
    holder.position.set(x+J.pel.x*(leg/.68),ftY+J.pel.y*leg/.68-upY+(lift||0),0);holder.updateMatrixWorld(true);
    var up=J.up.clone();aim('Spine02','Spine01',up);aim('Spine01','Spine',up);aim('Spine','neck',up);aim('neck','Head',up);aim('Head','head_end',V(Math.sin((J.tor-6)*D2R),1,0));
    [['Right',0],['Left',1]].forEach(function(p){var n=p[0],i=p[1];
      aim(n+'UpLeg',n+'Leg',J.kn[i].clone().sub(J.hp[i]));aim(n+'Leg',n+'Foot',J.an[i].clone().sub(J.kn[i]));aim(n+'Foot',n+'ToeBase',V(1,-.25,0));
      aim(n+'Arm',n+'ForeArm',J.el[i].clone().sub(J.sh[i]));aim(n+'ForeArm',n+'Hand',J.ha[i].clone().sub(J.el[i]))})}
  return {holder:holder,pose:pose,B:B,leg:leg}}

/* ---------- music and sounds (made in the browser, no files) ---------- */
var AU={ctx:null,on:store('cr_mute')!=='1',bpm:104,step:0,next:0,timer:0,master:null};
function auInit(){if(AU.ctx)return;try{AU.ctx=new (window.AudioContext||window.webkitAudioContext)();AU.master=AU.ctx.createGain();AU.master.gain.value=AU.on?.55:0;AU.master.connect(AU.ctx.destination);
  var n=AU.ctx.sampleRate*.2,b=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;AU.noise=b}catch(e){}}
function tone(type,f1,f2,dur,vol,at){var c=AU.ctx;if(!c)return;var o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f1,at);if(f2)o.frequency.exponentialRampToValueAtTime(f2,at+dur);
  g.gain.setValueAtTime(vol,at);g.gain.exponentialRampToValueAtTime(.001,at+dur);o.connect(g);g.connect(AU.master);o.start(at);o.stop(at+dur+.02)}
function hat(at,vol){var c=AU.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=AU.noise;f.type='highpass';f.frequency.value=7000;g.gain.setValueAtTime(vol,at);g.gain.exponentialRampToValueAtTime(.001,at+.05);s.connect(f);f.connect(g);g.connect(AU.master);s.start(at);s.stop(at+.06)}
