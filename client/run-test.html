<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Corniche Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Lalezar&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#10181c;--pink:#e0457a;--crim:#a3263f;--mint:#1f6e5b;--sun:#ffc23d;--sea:#0fa3c9;--disp:'Archivo Black',Impact,system-ui,sans-serif;--body:Inter,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#0b1418;color:#fff;font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
#pick{position:fixed;inset:0;overflow-y:auto;touch-action:pan-y;background:radial-gradient(120% 60% at 100% 0%,rgba(163,38,63,.45),transparent 55%),radial-gradient(90% 50% at 0% 100%,rgba(31,110,91,.45),transparent 60%),#080d10;padding:calc(18px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 30px max(16px,env(safe-area-inset-left))}
#pick .plogo{display:block;height:44px;width:auto;margin:6px 0 2px}#pick h1{font:400 44px/1 var(--disp);margin:6px 0 4px;color:#fff;letter-spacing:.01em;text-transform:uppercase}#pick p{margin:0 0 16px;color:rgba(255,255,255,.65);font-weight:600}
.back{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:#fff;font-weight:800;font-size:15px;padding:9px 14px;border-radius:99px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:520px}
.ch{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:3/4;background:#141c20;box-shadow:0 14px 30px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.08)}
.ch:before{content:"";position:absolute;inset:0;background:radial-gradient(70% 55% at 50% 38%,rgba(224,69,122,.30),transparent 70%)}.ch img{position:relative;width:100%;height:100%;object-fit:contain;object-position:50% 12%;padding:6px 4px 0;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))}
.ch .tag{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,transparent,rgba(5,8,10,.92) 45%);padding:30px 12px 11px;text-align:left}
.ch .tag b{display:block;font:400 15px var(--disp)}.ch .tag span{font-size:11.5px;opacity:.85;font-weight:700}
.ch.sel{box-shadow:0 0 0 3px #e0457a,0 14px 34px rgba(163,38,63,.45)}.ch .you{position:absolute;top:8px;left:8px;background:#a3263f;color:#fff;font:400 11px var(--disp);letter-spacing:.06em;padding:4px 8px;border-radius:99px}
#game{position:fixed;inset:0;display:none}
#cv{position:absolute;inset:0}#cv canvas{display:block;width:100%!important;height:100%!important}
.hud{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));z-index:3;pointer-events:none;display:flex;align-items:flex-start;gap:8px}
.pill{background:rgba(16,24,28,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:16px;padding:7px 11px;line-height:1}
.score{flex:1;text-align:center}.score b{font:400 32px var(--disp);display:block}.score span,.coins span{font-size:10.5px;font-weight:800;letter-spacing:.1em;opacity:.8}
.coins{text-align:right;min-width:86px}.coins b{font:400 24px var(--disp);display:block;color:var(--sun)}
.lives{font-size:18px;min-width:70px}.lives small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.1em;opacity:.8;margin-top:5px}
.mult{position:absolute;left:50%;transform:translateX(-50%);top:calc(74px + env(safe-area-inset-top));background:var(--crim);font:400 14px var(--disp);padding:5px 12px;border-radius:99px;z-index:3;pointer-events:none}
.pw{position:absolute;left:max(12px,env(safe-area-inset-left));top:calc(126px + env(safe-area-inset-top));z-index:3;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.pw div{display:flex;align-items:center;gap:6px;background:rgba(16,24,28,.62);border-radius:99px;padding:4px 10px 4px 6px;font-weight:800;font-size:13px}.pw i{display:block;width:46px;height:5px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden}.pw i b{display:block;height:100%;background:var(--sun)}
.cbtn{position:absolute;top:calc(74px + env(safe-area-inset-top));width:42px;height:42px;border-radius:50%;background:rgba(16,24,28,.55);z-index:4;font-size:16px;font-weight:900}
#pause{right:max(12px,env(safe-area-inset-right));letter-spacing:-1px;font-size:13px}#mute{right:calc(max(12px,env(safe-area-inset-right)) + 50px)}
.msg{position:absolute;left:50%;top:30%;transform:translate(-50%,-8px);z-index:3;padding:8px 16px;border-radius:99px;background:rgba(16,24,28,.75);font-weight:800;font-size:16px;opacity:0;transition:all .2s;white-space:nowrap;pointer-events:none}
.msg.on{opacity:1;transform:translate(-50%,0)}.msg.ok{color:#7ef0c8}.msg.bad{color:#ff9fbd}.msg.gold{color:var(--sun)}
.zone{position:absolute;left:0;right:0;top:40%;text-align:center;z-index:3;pointer-events:none;opacity:0;transition:opacity .4s}.zone.on{opacity:1}
.zone b{display:block;font:400 42px/1 var(--disp);color:var(--sun);text-shadow:0 6px 24px rgba(0,0,0,.5)}.zone span{font-weight:800;font-size:16px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.hint{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));text-align:center;z-index:3;pointer-events:none;transition:opacity .6s}
.hint span{display:inline-block;background:rgba(16,24,28,.62);border-radius:99px;padding:7px 14px;font-weight:800;font-size:13px}
.count{position:absolute;inset:0;display:grid;place-items:center;font:400 96px var(--disp);background:linear-gradient(180deg,rgba(11,20,24,.35),rgba(11,20,24,0) 45%);z-index:6;pointer-events:none;text-align:center;text-shadow:0 6px 24px rgba(0,0,0,.45)}.count small{display:block;font:800 18px/1.3 var(--body);margin-bottom:10px}
.flash{position:absolute;inset:0;z-index:5;pointer-events:none;background:#fff;opacity:0;transition:opacity .25s}
.end{position:absolute;inset:0;z-index:7;display:none;flex-direction:column;justify-content:flex-end;padding:20px max(16px,env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:linear-gradient(180deg,rgba(11,20,24,0) 15%,rgba(11,20,24,.95) 55%)}
.end h2{font:400 50px/1 var(--disp);margin:0;color:var(--sun)}.end .big{font-size:18px;margin-top:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.end .big div{background:rgba(255,255,255,.08);border-radius:14px;padding:10px;text-align:center}.end .big b{font:400 26px var(--disp);display:block}.end .big span{font-size:11px;font-weight:800;letter-spacing:.08em;opacity:.75}
.end .sub{opacity:.85;margin-top:10px;font-weight:700}.end .btns{display:flex;gap:10px;margin-top:16px}
.end .btns button{flex:1;min-height:54px;border-radius:16px;font-weight:800;font-size:17px;background:var(--pink)}.end .btns button+button{background:rgba(255,255,255,.14)}
.homeb{display:block;width:100%;margin-top:10px;min-height:46px;border-radius:14px;background:rgba(255,255,255,.08);font-weight:800}
.pz{position:absolute;inset:0;z-index:8;display:none;place-items:center;background:rgba(11,20,24,.62);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}.pz.on{display:grid}
.snd{position:absolute;inset:0;z-index:10;display:none;place-items:center;background:rgba(11,20,24,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}.snd.on{display:grid}
.snd>div{width:min(320px,88vw);background:rgba(16,24,28,.92);border-radius:22px;padding:20px 18px;box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.08)}
.snd h2{font:400 34px var(--disp);margin:0 0 14px;text-align:center}
.vrow{display:flex;align-items:center;gap:10px;margin:14px 0}.vrow .ic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.08);font-size:18px;flex:none}
.vrow .ic.off{background:rgba(224,69,122,.25)}.vrow label{flex:1}.vrow b{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-bottom:6px}.vrow b span{color:var(--sun)}
.vrow input{width:100%;accent-color:#e0457a;height:28px}
.snd .done{display:block;width:100%;min-height:52px;border-radius:16px;font-weight:800;font-size:17px;background:var(--pink);margin-top:8px}.pz>div{text-align:center}
.pz h2{font:400 50px var(--disp);margin:0 0 6px}.pz p{margin:0 0 18px;font-weight:700;opacity:.85}.pz button{display:block;width:230px;min-height:54px;border-radius:16px;font-weight:800;font-size:17px;background:var(--pink);margin:10px auto}.pz button+button{background:rgba(255,255,255,.16)}
.spark{position:absolute;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:8;animation:sp .9s ease-out forwards}@keyframes sp{to{transform:translate(var(--x),var(--y));opacity:0}}
#pick{padding-bottom:110px}
.bh{display:flex;align-items:center;justify-content:space-between;gap:10px}.bh .plogo{height:34px!important;margin:0!important}
#pick h1{font-size:34px!important;margin:12px 0 2px!important}#pick .sub{margin:0 0 6px;color:rgba(255,255,255,.6);font-weight:600;font-size:14px}
.stage3{position:relative;height:min(46vh,380px);margin:4px -16px 6px;background:radial-gradient(60% 55% at 50% 58%,rgba(224,69,122,.28),transparent 70%)}
#pv{width:100%;height:100%;display:block;touch-action:none}
#pvl{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:14px;color:rgba(255,255,255,.7);pointer-events:none;transition:opacity .3s}
.opt{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);border-radius:18px;padding:12px 14px;margin-top:10px}
.opt>b{display:block;font:400 13px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips+.sw,.sw+.chips{margin-top:10px}
.chips button{padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.08);font-weight:800;font-size:14px}.chips button.on{background:#e0457a}
.sw{display:flex;flex-wrap:wrap;gap:9px}.sw button{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}.sw button.on{box-shadow:0 0 0 3px #080d10,0 0 0 5px #fff}
.gobar{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:linear-gradient(180deg,rgba(8,13,16,0),#080d10 40%);z-index:5}
#go{display:block;width:100%;max-width:520px;margin:0 auto;min-height:58px;border-radius:18px;font:400 20px var(--disp);letter-spacing:.08em;background:linear-gradient(180deg,#c9405e,#a3263f 55%,#86172f);box-shadow:0 12px 30px rgba(163,38,63,.5)}
.rv{position:absolute;inset:0;z-index:9;display:none;place-items:center;background:rgba(11,20,24,.7);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}.rv.on{display:grid}.rv>div{text-align:center;width:min(300px,86vw)}
.rv h2{font:400 40px var(--disp);margin:0 0 6px;color:var(--sun)}.rv p{margin:0 0 14px;font-weight:700;opacity:.85}.rv button{display:block;width:100%;min-height:56px;border-radius:16px;font-weight:800;font-size:17px;background:var(--pink);margin-top:10px}.rv button+button{background:rgba(255,255,255,.16)}
.rv .tb{height:6px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:14px}.rv .tb i{display:block;height:100%;width:100%;background:var(--sun);transition:width 1s linear}
.ex{margin-top:10px;display:flex;flex-direction:column;gap:6px}.ex div{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px}.ex .g{color:var(--sun)}
.load{position:fixed;inset:0;display:none;place-items:center;background:#0b1418;z-index:9;font-weight:800;text-align:center;padding:20px}
.word{position:absolute;right:max(12px,env(safe-area-inset-right));top:calc(124px + env(safe-area-inset-top));z-index:3;display:flex;align-items:center;gap:2px;background:rgba(16,24,28,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:12px;padding:5px 8px;pointer-events:none}
.word i{width:15px;font:400 14px/20px var(--disp);text-align:center;font-style:normal;color:rgba(255,255,255,.25)}.word i.on{color:var(--sun)}
.word img{width:20px;height:20px;margin-left:3px;opacity:.28;filter:grayscale(1)}.word img.on{opacity:1;filter:none}
.spr{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom));z-index:3;pointer-events:none;background:linear-gradient(90deg,#e0457a,#a3263f);font:400 15px var(--disp);letter-spacing:.06em;padding:7px 15px;border-radius:99px;white-space:nowrap;animation:sprp .8s infinite}
.spr small{font:800 11px var(--body);letter-spacing:0;opacity:.9;margin-left:6px}.spr.rec{background:#1f6e5b;animation:none}
@keyframes sprp{50%{box-shadow:0 0 0 9px rgba(224,69,122,0)}0%{box-shadow:0 0 0 0 rgba(224,69,122,.6)}}
.cash{color:#7ef0c8;font-weight:700;margin-top:4px}
#vob{position:fixed;right:14px;top:118px;max-width:62%;background:#fff;color:#1b1d20;border-radius:20px 20px 4px 20px;padding:8px 16px 9px;box-shadow:0 8px 22px rgba(0,0,0,.28);opacity:0;transform:translateY(8px) scale(.7);transform-origin:100% 100%;transition:opacity .2s,transform .25s;z-index:40;pointer-events:none;text-align:right}#vob.on{opacity:1;transform:none}#vob b{display:block;direction:rtl;font:400 28px/1.25 Lalezar,Tahoma,sans-serif;color:#c8102e}#vob small{display:block;font:700 13px Inter,sans-serif;color:#555}
#pfx{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .35s}
#pfx.mag,#pfx.jet,#pfx.shoes{opacity:1}#pfx.end{animation:pfxb .35s steps(2) infinite}@keyframes pfxb{50%{opacity:.25}}
#pfx.mag{box-shadow:inset 0 0 70px 18px rgba(224,69,122,.55);background:radial-gradient(ellipse at 50% 60%,transparent 55%,rgba(224,69,122,.18))}
#pfx.shoes{box-shadow:inset 0 0 70px 18px rgba(46,214,140,.55);background:radial-gradient(ellipse at 50% 60%,transparent 55%,rgba(46,214,140,.16))}
#pfx.jet{box-shadow:inset 0 0 80px 22px rgba(255,140,30,.6);background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(255,120,20,.22))}
#pfx i{position:absolute;inset:-20%;opacity:0}#pfx.jet i{opacity:.55;background:repeating-conic-gradient(from 0deg at 50% 52%,rgba(255,255,255,.0) 0deg 7deg,rgba(255,255,255,.35) 7deg 8deg);-webkit-mask:radial-gradient(circle at 50% 52%,transparent 32%,#000 62%);mask:radial-gradient(circle at 50% 52%,transparent 32%,#000 62%);animation:pfxs .25s linear infinite}
@keyframes pfxs{to{transform:rotate(8deg)}}
#pfx.flash::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.85),rgba(255,255,255,0) 70%);animation:pfxf .5s ease-out forwards}@keyframes pfxf{from{opacity:1}to{opacity:0}}
.cpop{position:fixed;right:22px;top:62px;font:900 20px Inter,sans-serif;color:#ffd257;text-shadow:0 2px 6px rgba(0,0,0,.45);z-index:45;pointer-events:none;animation:cpu .9s ease-out forwards}.cpop.bad{color:#ff6b6b;font-size:26px}@keyframes cpu{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-34px)}}
#intro{position:fixed;inset:0;z-index:60;background:rgba(6,10,12,.82);backdrop-filter:blur(6px);display:grid;place-items:center;padding:14px}
#intro .ib{width:100%;max-width:440px;background:#11181a;border-radius:24px;padding:18px 14px 16px;color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.6);font-family:Inter,sans-serif}
#intro h3{margin:0;font:900 22px Inter,sans-serif;text-align:center}#intro p{margin:4px 0 12px;text-align:center;color:#9fb0b2;font-size:14px}
#intro .icols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}#intro .ic{background:#182124;border-radius:16px;padding:10px 8px}
#intro h4{margin:0;font:900 14px Inter,sans-serif}#intro .ic small{display:block;font-size:11px;font-weight:700;margin-bottom:6px;opacity:.75}
#intro .j h4{color:#7ef0c8}#intro .s h4{color:#ffd257}#intro .a h4{color:#ff7a93}
#intro .io{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 0;color:#e3ecec}#intro .io span{font-size:17px;width:22px;text-align:center}
#intro button{margin-top:14px;width:100%;min-height:52px;border-radius:14px;background:#e0457a;color:#fff;font:800 17px Inter,sans-serif}

/* phone portrait: slimmer top bar so buildings stay in view */
@media (max-aspect-ratio:3/4){
 .hud{padding-top:calc(6px + env(safe-area-inset-top));gap:6px;justify-content:space-between}
 .pill{padding:5px 9px;border-radius:12px}
 .pill b{font-size:22px}.pill span,.pill small{font-size:9px}
 .pill.score{flex:0 1 auto;min-width:92px;text-align:center}
 .cbtn{top:calc(50px + env(safe-area-inset-top));width:34px;height:34px;font-size:13px}
 .mult{top:calc(50px + env(safe-area-inset-top));font-size:12px;padding:3px 10px}
 .pw{top:calc(92px + env(safe-area-inset-top))}
}
/* ---------- levels: HUD chip, level up chest, run tickets ---------- */
.lvc{position:absolute;left:max(12px,env(safe-area-inset-left));top:calc(74px + env(safe-area-inset-top));z-index:3;pointer-events:none;display:flex;align-items:center;gap:7px;background:rgba(16,24,28,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:99px;padding:4px 10px 4px 4px}
.lvc b{display:grid;place-items:center;min-width:30px;height:22px;padding:0 6px;border-radius:99px;background:linear-gradient(135deg,#ffd54a,#f2a33b);color:#3a2400;font:400 13px var(--disp);letter-spacing:.5px}
.lvc i{display:block;width:64px;height:6px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden}.lvc i u{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ef0c8,#3fe0c5);transition:width .8s}
@media (max-aspect-ratio:3/4){.lvc{top:calc(50px + env(safe-area-inset-top))}}
.lvup{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:radial-gradient(circle at 50% 40%,#3a2a10 0,#0b0f11 62%)}
.lvup.on{display:grid}
.lvx{position:relative;width:min(320px,86vw);text-align:center;color:#fff}
.lvx .rays{position:absolute;left:50%;top:120px;width:420px;height:420px;margin:-210px 0 0 -210px;background:repeating-conic-gradient(rgba(255,214,90,.20) 0 10deg,transparent 10deg 24deg);border-radius:50%;animation:lvspin 9s linear infinite;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
@keyframes lvspin{to{transform:rotate(360deg)}}
.lvx small{position:relative;display:block;font:400 14px var(--disp);letter-spacing:3px;color:#ffd54a}
.lvx h2{position:relative;font:400 54px/1 var(--disp);margin:4px 0 6px;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.chest{position:relative;width:160px;height:150px;margin:30px auto 12px;perspective:420px}
.chest .base{position:absolute;left:0;right:0;bottom:0;height:88px;border-radius:8px 8px 16px 16px;background:linear-gradient(90deg,transparent 0 22%,#ffcf4a 22% 28%,transparent 28% 72%,#ffcf4a 72% 78%,transparent 78%),linear-gradient(180deg,#c4823a,#8a5220);box-shadow:inset 0 0 0 5px #ffcf4a,inset 0 -12px 0 rgba(0,0,0,.2),0 16px 30px rgba(0,0,0,.55)}
.chest .base::before{content:"";position:absolute;left:50%;top:-2px;width:22px;height:30px;margin-left:-11px;border-radius:5px;background:#ffcf4a;box-shadow:inset 0 -6px 0 #d99a1f}
.chest .lid{position:absolute;left:-5px;right:-5px;bottom:84px;height:56px;border-radius:44px 44px 6px 6px;background:linear-gradient(90deg,transparent 0 22%,#ffcf4a 22% 28%,transparent 28% 72%,#ffcf4a 72% 78%,transparent 78%),linear-gradient(180deg,#d18c40,#9b5d25);box-shadow:inset 0 0 0 5px #ffcf4a;transform-origin:50% 100%;transform:rotateX(0)}
.lvup.on .chest .lid{animation:lvlid .7s cubic-bezier(.3,1.6,.5,1) .55s forwards}
@keyframes lvlid{to{transform:rotateX(-62deg) translateY(-10px)}}
.chest .glow{position:absolute;left:14px;right:14px;bottom:76px;height:20px;border-radius:50%;background:#fff3b0;filter:blur(8px);opacity:0}
