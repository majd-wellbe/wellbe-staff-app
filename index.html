<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wellbe Team</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f6e5b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wellbe Team">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first staff app. One sticky top bar, one bottom tab bar per role,
   every task is one screen; actions open a bottom sheet. */
:root{
  --bg:#f2f5f4; --card:#ffffff; --ink:#151b1e; --ink-2:#4b565b; --ink-3:#6d777b; --line:#dde3e1;
  --mint:#6fc7b1; --mint-deep:#1f6e5b; --mint-soft:#e2f3ee;
  --crimson:#a3263f; --crimson-soft:#f8e7eb;
  --amber:#8a5a00; --amber-soft:#fff2d6;
  --good:#1f6e5b; --good-soft:#e2f3ee; --warn:#8a5a00; --warn-soft:#fff2d6; --bad:#a3263f; --bad-soft:#f8e7eb;
  --series:#139a72; --track:#e6ecea;
  --wa:#1f8f4e;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:Barlow,"Segoe UI",Roboto,Arial,sans-serif;
  --r:14px; --tabh:64px;
  /* same in both themes */
  --on-accent:#fff; --on-mint:#151b1e; --scrim:rgba(10,14,16,.5); --mark:#fff1b8; --mark-ink:#151b1e;
  --sh-fab:0 10px 24px rgba(163,38,63,.35); --sh-float:0 8px 24px rgba(0,0,0,.25); --sh-pop:0 12px 30px rgba(31,110,91,.18);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1416; --card:#182024; --ink:#eef2f1; --ink-2:#b9c3c0; --ink-3:#8e9a97; --line:#2a3539;
  --mint:#6fc7b1; --mint-deep:#7fd3bd; --mint-soft:#163a31;
  --crimson:#ef7c93; --crimson-soft:#3a1820; --amber:#f2c46b; --amber-soft:#3a2d10;
  --good:#7fd3bd; --good-soft:#163a31; --warn:#f2c46b; --warn-soft:#3a2d10; --bad:#ef7c93; --bad-soft:#3a1820;
  --series:#199e70; --track:#24302f; --wa:#2fae63; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1416; --card:#182024; --ink:#eef2f1; --ink-2:#b9c3c0; --ink-3:#8e9a97; --line:#2a3539;
  --mint:#6fc7b1; --mint-deep:#7fd3bd; --mint-soft:#163a31;
  --crimson:#ef7c93; --crimson-soft:#3a1820; --amber:#f2c46b; --amber-soft:#3a2d10;
  --good:#7fd3bd; --good-soft:#163a31; --warn:#f2c46b; --warn-soft:#3a2d10; --bad:#ef7c93; --bad-soft:#3a1820;
  --series:#199e70; --track:#24302f; --wa:#2fae63; color-scheme:dark }
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:var(--body);font-size:16px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink)}
h1,h2,h3{font-family:var(--display);line-height:1.05;text-wrap:balance}
:focus-visible{outline:3px solid var(--mint-deep);outline-offset:2px;border-radius:8px}
.icon{width:22px;height:22px;flex:none}
.num{font-variant-numeric:tabular-nums}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;height:58px;padding-inline:16px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--mint);display:grid;place-items:center;font:800 18px var(--display);color:var(--on-mint)}
.who{flex:1;min-width:0}
.who b{display:block;font-size:15px;line-height:1.2}
.who span{font-size:12.5px;color:var(--ink-3)}
.rolechip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:var(--mint-soft);color:var(--mint-deep)}
main{max-width:760px;margin:0 auto;padding:18px 16px calc(var(--tabh) + 28px)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:760px;margin:0 auto;display:flex}
.tab{flex:1;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--ink-3);position:relative}
.tab[aria-current=page]{color:var(--mint-deep)}
.tab[aria-current=page]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--mint-deep)}
.tab .badge{position:absolute;top:8px;left:55%;min-width:18px;height:18px;border-radius:9px;background:var(--crimson);color:var(--on-accent);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* common */
.h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 0 10px}
.h:first-child{margin-top:0}
.h h2{font-size:26px;font-weight:800;text-transform:uppercase}
.h small{color:var(--ink-3);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:60px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
button.row:hover{border-color:var(--ink-3)}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-size:16px;line-height:1.25}
.row .main span{display:block;font-size:13.5px;color:var(--ink-2)}
.time{font:800 20px/1 var(--display);min-width:54px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill svg{width:14px;height:14px}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-mute{background:var(--bg);color:var(--ink-2)}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;background:var(--crimson);color:var(--on-accent);font-weight:700;font-size:16px}
.btn.full{width:100%}
.btn.sec{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.wa{background:var(--wa);color:var(--on-accent)}
.btn.ok{background:var(--mint-deep);color:var(--on-accent)}
.btn.sm{min-height:40px;font-size:14px;padding:0 12px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.muted{color:var(--ink-3)}
.empty{padding:22px;text-align:center;color:var(--ink-3);border:1.5px dashed var(--line);border-radius:var(--r)}
.search{width:100%;min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 14px 0 44px}
.searchwrap{position:relative;margin-bottom:12px}
.searchwrap svg{position:absolute;left:14px;top:14px;width:20px;height:20px;color:var(--ink-3)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}

/* home tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;min-height:128px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:left;position:relative}
.tile .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--mint-soft);color:var(--mint-deep)}
.tile b{font:800 21px/1.05 var(--display);text-transform:uppercase}
.tile span{font-size:13px;color:var(--ink-2)}
.tile .count{position:absolute;top:14px;right:14px;font:800 26px/1 var(--display)}
.tile.alert .ic{background:var(--bad-soft);color:var(--bad)}
.tile.alert .count{color:var(--bad)}

/* quick actions + to do */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qb{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700}
.qb .ic{position:relative;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--mint-soft);color:var(--mint-deep)}
.qb .dot{position:absolute;top:-6px;right:-8px;min-width:20px;height:20px;border-radius:10px;background:var(--crimson);color:var(--on-accent);font-size:11.5px;display:grid;place-items:center;padding:0 5px}
.todo{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 12px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r)}
.todo.t-bad{border-left-color:var(--bad)} .todo.t-warn{border-left-color:var(--warn)} .todo.t-mute{border-left-color:var(--mint)}
.todo .ti{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--bg);color:var(--ink-2);flex:none}
.todo .ti svg{width:19px;height:19px}
.todo .main{flex:1;min-width:0}
.todo .main b{display:block;font-size:15px;line-height:1.25}
.todo .main span{display:block;font-size:13px;color:var(--ink-3)}
.iconbtn.sm{width:40px;height:40px;color:var(--ink-3)}
.fab{position:fixed;right:16px;bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));z-index:25;width:58px;height:58px;border-radius:18px;background:var(--crimson);color:var(--on-accent);display:grid;place-items:center;box-shadow:var(--sh-fab)}
.fab svg{width:26px;height:26px}
.notebox{border-radius:12px;background:var(--bg);padding:10px 12px;font-size:14.5px;margin-bottom:10px}
.notebox b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.pick{max-height:240px;overflow-y:auto;display:grid;gap:6px;margin-top:6px}
/* sessions */
.sess{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.sess[data-sess]{cursor:pointer}
.sxc{padding:12px 14px;margin-bottom:10px}.sxc .top{display:flex;align-items:center;gap:10px;margin-bottom:8px}.sxc .top .main{flex:1;min-width:0}.sxc .top b{display:block;font-size:16px}.sxc .top span.muted{font-size:13.5px}.sxc .payrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.sxc .att{padding:0}.sxmenu{display:grid;gap:6px;margin:-2px 0 10px}.sxnote{display:grid;gap:6px;margin-bottom:12px}.sxnote textarea{min-height:84px}
.sess .hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sess .hd .main{flex:1;min-width:0}
.sess .hd b{font-size:15px}
.sess .hd span{display:block;font-size:13px;color:var(--ink-3)}
.cl{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.cl:first-of-type{border-top:0}
.cl .main{flex:1;min-width:0}
.cl .main b{font-size:15.5px}
.cl .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.att{display:flex;gap:4px;flex-wrap:wrap;padding:0 14px 12px}
.att button{flex:1;min-width:70px;min-height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:700;color:var(--ink-2)}
.att button[aria-pressed=true].a-present{background:var(--good);border-color:var(--good);color:var(--card)}
.att button[aria-pressed=true].a-late,.att button[aria-pressed=true].a-noshow{background:var(--bad);border-color:var(--bad);color:var(--card)}
.att button[aria-pressed=true].a-early{background:var(--warn);border-color:var(--warn);color:var(--card)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:90vh;display:flex;flex-direction:column;background:var(--card);border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:760px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:10px auto 0}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:10px 16px 6px}
.sheet .sh h3{flex:1;font-size:24px;text-transform:uppercase}
.sheet .sb{overflow-y:auto;padding:6px 16px 16px}
.sheet .sf{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;gap:8px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.iconbtn:hover{background:var(--bg)}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>label,.flabel{font-weight:700;font-size:14px}
.field input,.field select,.field textarea{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px;width:100%}
.field textarea{padding:10px 12px;min-height:74px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.two>*{min-width:0}
input[type=date],input[type=time]{min-width:0;width:100%;max-width:100%;-webkit-appearance:none;appearance:none}
.note{font-size:13.5px;padding:10px 12px;border-radius:12px;display:flex;gap:8px;align-items:flex-start}
.note svg{width:18px;height:18px;flex:none;margin-top:1px}
.note.warn{background:var(--warn-soft);color:var(--warn)} .note.good{background:var(--good-soft);color:var(--good)} .note.bad{background:var(--bad-soft);color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.kv dt{color:var(--ink-3)}
.kv dd{font-weight:600}

/* week grid */
.week{display:grid;gap:10px}
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.day h3{font-size:19px;text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline}
.day h3 small{font:600 13px var(--body);color:var(--ink-3);text-transform:none}
.slot{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.slot:first-of-type{border-top:0}
.slot .t{font:800 17px var(--display);min-width:48px}
.slot .main{flex:1;min-width:0;font-size:14px}
.slot .main b{font-size:14.5px}
.tag{font-size:11.5px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--mint-soft);color:var(--mint-deep)}
.tag.new{background:var(--warn-soft);color:var(--warn)}

/* dashboard */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi span{display:block;font-size:13px;color:var(--ink-3);font-weight:600}
.kpi b{display:block;font:800 30px/1.1 var(--display);margin-top:4px}
.kpi small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.kpi.hero{grid-column:1/-1}
.kpi.hero b{font-size:44px}
.bars{display:grid;gap:10px;padding:14px}
.bar{display:grid;grid-template-columns:110px 1fr 62px;align-items:center;gap:10px;font-size:14px}
.bar .lab{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:14px;background:var(--track);border-radius:0 4px 4px 0;position:relative}
.bar .fill{height:100%;background:var(--series);border-radius:0 4px 4px 0;min-width:2px}
.bar .val{text-align:right;font-weight:700}
.bar:hover .fill{filter:brightness(1.12)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line)}
.tbl td.r,.tbl th.r{text-align:right}
.tblwrap{overflow-x:auto}

/* login */
.login{max-width:440px;margin:0 auto;padding:40px 16px}
.login h1{font-size:44px;text-transform:uppercase;margin:18px 0 6px}
.login p{color:var(--ink-2);margin-bottom:22px}
.who-pick{display:grid;gap:10px}
.who-pick button{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:left}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 18px var(--display);background:var(--mint-soft);color:var(--mint-deep);flex:none}
.demo{margin-top:22px;font-size:13px;color:var(--ink-3)}
.busy{font:700 12px var(--body);color:var(--mint-deep);background:var(--mint-soft);padding:4px 8px;border-radius:99px;margin-right:6px}

.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:60;background:var(--ink);color:var(--card);padding:12px 16px;border-radius:12px;font-weight:600;font-size:14.5px;opacity:0;pointer-events:none;transition:all .2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:700px){ .tiles{grid-template-columns:repeat(4,1fr)} .kpis{grid-template-columns:repeat(3,1fr)} .kpi.hero{grid-column:span 3} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.woh{display:flex;align-items:center;gap:10px;margin:0 0 14px}.woh h2{font-size:26px;font-weight:800;text-transform:uppercase;margin:0}.woh small{color:var(--ink-3);font-size:13px}.woh .main{flex:1;min-width:0}
.woask{background:var(--bad-soft);border-radius:var(--r);padding:14px;margin-bottom:12px;display:grid;gap:6px}.woask b{color:var(--bad);font-size:16px}.woask span{font-size:14px;color:var(--ink-2)}.woask .two{margin-top:6px}
.wops{display:grid;gap:2px;padding:10px 0;border-top:1px solid var(--line)}.wops:first-of-type{border-top:0;padding-top:0}.wops span{font-size:13px;color:var(--ink-3)}.wops.on b{color:var(--good)}
.wop{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.woph{display:flex;align-items:center;gap:8px;margin-bottom:4px}.won{flex:none;width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--card);display:grid;place-items:center;font-weight:800;font-size:14px}.won.w{background:var(--mint-soft);color:var(--mint-deep);width:38px}
.wop input,.wop select{min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:0 10px;width:100%;font-size:15px}
.woph input.pn,.wowb>input.pn{flex:1;font-weight:700}
.wof{display:flex;gap:6px;align-items:center;margin-top:6px}.wof .s{flex:0 0 62px}.wof .r{flex:0 0 86px}.wof .d{flex:1;min-width:0}.wof select{flex:0 0 104px}.wodt{font-size:13px;color:var(--ink-3)}
input.wonote{margin-top:6px}
.woctl{display:flex;gap:4px;flex:none}.woctl button,.wox{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);font-weight:800;color:var(--ink-2);flex:none}
.wox{margin-top:4px}

<script>
/* =====================================================================
   WELLBE TEAM APP. Live: reads and writes the Operations + Client Portal
   sheets through the Wellbe W40 Backend (App.gs). Rules mirror the CRM: Done / Late Cancel / No Show deduct a
   pass, Early Cancel does not; 1:3 is counted per client attendance.
   ===================================================================== */
(function(){
// shared helpers live in core/wb-core.js (WB). Short local names kept so the code below reads the same.
var $=WB.$, $$=WB.$$, esc=WB.esc, pad=WB.pad, ymd=WB.ymd, first=WB.first, store=WB.store, wa=WB.wa;
var code=WB.code;   // sheet values used as codes (tab, id, status, time...): stripped so they are safe in HTML and attributes
var dayLabel=WB.dayShort, dayLong=WB.dayLong, dOf=WB.dOf;   // dOf('yyyy-mm-dd') -> Date at noon
function money(n){return WB.money(n,0)}
function addDays(d,n){return WB.addDaysDate(d,n)}
function hl(t){return WB.hourLabel(t,false)}
function num(v){var n=Number(v);return isFinite(n)?n:0}
function byName(a,b){return a.name<b.name?-1:1}
function byStart(a,b){return (a.start||'')<(b.start||'')?-1:1}
var ICON=function(id,cls){return '<svg class="'+(cls||'icon')+'"><use href="#'+id+'"/></svg>'};

/* ---------------- settings (sent by the server in boot as d.cfg) ----------------
   CFG_FALLBACK: today's values, used only while the server does not send d.cfg yet (old server, old cached boot),
   and for keys the server does not send. Delete after Supabase. Read settings only through C() and the helpers below. */
var CFG_FALLBACK={v:1,
 center:{name:'Wellbe Health Center',desk:'romy',wa:'96176511048',country:'961',location:'Bsalim',area:'Beirut area',maps:'https://maps.google.com/?q=Wellbe+Health+Center+Bsalim'},
 staff:[
  {id:'majd',name:'Majd Bou Habib',role:'owner',trainer:'Majd',train:true,pay:{rule:'fixed',fixed:{training:20,Physio:38,PhysioIns:28,Prehab:38}}},
  {id:'romy',name:'Romy',role:'assistant',trainer:''},
  {id:'joe',name:'Joe Al Hosny',role:'trainer',trainer:'Joe',train:true,cap:3,pay:{rule:'tier',base:0}},
  {id:'mikel',name:'Mikel',role:'trainer',trainer:'Mikel',train:true,pay:{rule:'tier',base:50}},
  {id:'melanie',name:'Melanie',role:'trainer',trainer:'Melanie',train:true,pay:{rule:'cut',cut:4}},
  {id:'jad',name:'Jad Barakat',role:'trainer',trainer:'Jad',pay:{rule:'fixed',fixed:{Osteo:140}}}],
 pay:{tiers:[[40,7],[80,9],[null,10.5]]},
 types:[
  {name:'1:3 - 12x/month ($200pp)',passes:12,price:200,kind:'1:3'},{name:'1:3 - 8x/month ($140pp)',passes:8,price:140,kind:'1:3'},
  {name:'1:2 - 12x/month ($270pp)',passes:12,price:270,kind:'1:2'},{name:'1:2 - 8x/month ($180pp)',passes:8,price:180,kind:'1:2'},
  {name:'1:1 - 12x/month ($300)',passes:12,price:300,kind:'1:1'},{name:'1:1 - 8x/month ($220)',passes:8,price:220,kind:'1:1'},{name:'1:1 - 4x/month ($110)',passes:4,price:110,kind:'1:1'},
  {name:'PT with Mel 1:1 - 8 Sessions ($250)',passes:8,price:250,kind:'1:1',mel:true},{name:'PT with Mel 1:1 - 12 Sessions ($350)',passes:12,price:350,kind:'1:1',mel:true},
  {name:'Prehab - 10 Sessions ($400)',passes:10,price:400,kind:'Prehab',months:3},{name:'Physio - Single Session ($50)',passes:1,price:50,kind:'Physio',days:10},
  {name:'Osteo - Single Session ($150)',passes:1,price:150,kind:'Osteo',days:10},{name:'Madero - 6 Sessions ($270)',passes:6,price:270,kind:'Madero',months:2,mel:true},{name:'Madero - 12 Sessions ($500)',passes:12,price:500,kind:'Madero',months:2,mel:true},
  {name:'Stretching & Mobility - 4 Sessions ($140)',passes:4,price:140,kind:'1:1',days:42},
  {name:'Trial Session - 1:3 (Free)',passes:1,price:0,kind:'1:3',days:10,trial:true,free:true},{name:'Assessment - Majd (Free)',passes:1,price:0,kind:'Physio',days:10,free:true}],
 // key order = order in the Book menu (the first one is the default)
 services:{'1:3':{label:'1:3',room:'Training Room',cap:3,trainer:'joe'},'1:2':{label:'1:2',room:'Training Room',cap:2},'1:1':{label:'1:1',room:'Training Room',cap:1},
  'Madero':{label:'Madero',room:'Madero Room',cap:1,fixed:'melanie'},'Prehab':{label:'Prehab',room:'Physio Room',cap:1,fixed:'majd'},'Physio':{label:'Physio',room:'Physio Room',cap:1,fixed:'majd'},'Osteo':{label:'Osteo',room:'Osteo Room',cap:1,fixed:'jad'}},
 offers:{m3Pct:7,m6Pct:15,bundleDays:70,physioPct:20,physioPrice:40,physioWas:50},
 late:{limits:[[12,3],[8,2]],'else':1},
 hours:{trial:[7,8,9,10],open:6,close:20,step:30,defaultStart:'07:00'},
 windows:{staffBack:70,ownerBack:800,ahead:35,trainerSee:60,freezeDays:7,patternDays:60,myClientsDays:45,oldPkgDays:45,renewDays:21,expenseDueDays:5,advisorDays:30,packDays:30,singleDays:10,backfillDays:14},
 lists:{methods:['Cash','Whish','Neo'],expenseCats:['Rent','Utilities','Salaries','Supplies','Equipment','Software','Marketing','Other'],repeats:['Weekly','Monthly','Every 3 months','Every 6 months','Yearly']}
};
// server settings over the fallback: objects merge key by key, lists (staff, types, ...) are taken whole from the server
function cfgMerge(a,b){if(b==null)return a;if(Array.isArray(b)||typeof b!=='object'||typeof a!=='object'||a==null||Array.isArray(a))return b;var o={};Object.keys(a).forEach(function(k){o[k]=a[k]});Object.keys(b).forEach(function(k){o[k]=cfgMerge(a[k],b[k])});return o}
// staff rows from the server keep today's train / cap / pay for anyone the server row says nothing about
function cfgStaffFill(c){var fb={};CFG_FALLBACK.staff.forEach(function(s){fb[s.id]=s});(c.staff||[]).forEach(function(s){var f=fb[s.id];if(!f)return;['train','cap','pay'].forEach(function(k){if(s[k]===undefined&&f[k]!==undefined)s[k]=f[k]})});return c}
WB.setCfg(CFG_FALLBACK);
function C(path){return WB.get(path)}
function svc(k){return C('services')[k]||{}}
function svcKeys(){return Object.keys(C('services'))}
function staffT(name){return WB.staffByTrainer(name)||{}}           // staff row from a trainer name ('Joe')
function trName(id){var s=WB.staffById(id);return s?s.trainer:''}   // trainer name from a staff id ('joe' -> 'Joe')
function fixedTr(ty){return trName(svc(ty).fixed)}                   // the one trainer who always runs this service ('' = any)
function trialTr(){return trName(svc('1:3').trainer)}               // who runs the 1:3 trials
function DESK(){return WB.deskName()}
function OWNER(){return WB.ownerName()}
function MEL(){var m=WB.staff().filter(function(s){return s.pay&&s.pay.rule==='cut'})[0];return m||{}}   // the trainer paid as a cut (her own clients pay her)
function melName(){return first(MEL().name||'')}
function melCut(){return (MEL().pay||{}).cut||0}
function melSvc(tab){var f=WB.staffById(svc(tab).fixed);return !!(f&&f.pay&&f.pay.rule==='cut')}   // a service that is 100% hers (Madero)
function cfgType(name){return C('types').filter(function(t){return t.name===name})[0]||null}
function singleType(kind){return C('types').filter(function(t){return t.kind===kind&&t.passes===1&&t.price>0&&!t.free})[0]||null}
function typeShort(t){return String(t).replace(/\s*\(\$[^)]*\)/,'')}
// trainers for pickers: the 1:3 trainer first, then trainers, then the owner; 'train' = runs 1:1 / 1:2 / 1:3
function trainerList(trainOnly){var all=WB.staff().filter(function(s){return s.trainer&&s.active!==false}),def=svc('1:3').trainer;
  var rank=function(s){return s.id===def?0:s.role==='trainer'?1:2},l=all.slice().sort(function(a,b){return rank(a)-rank(b)||all.indexOf(a)-all.indexOf(b)});
  var tr=l.filter(function(s){return s.train}).map(function(s){return s.trainer});
  return trainOnly?tr:tr.concat(l.filter(function(s){return !s.train}).map(function(s){return s.trainer}))}
function onlySvc(name){var st=staffT(name);if(st.train)return '';return svcKeys().filter(function(k){return svc(k).fixed&&svc(k).fixed===st.id})[0]||''}   // Jad -> 'Osteo'
function capOf(name){return +staffT(name).cap||0}   // max clients at the same hour (0 = no limit)
function pct(k){return C('offers.'+k)}
function afterPct(v,p){return Math.round(v*((100-p)/100))}
function daysText(n){return n%7===0&&n>=14?n/7+' weeks':n===7?'1 week':n+' days'}
function methods(){return C('lists.methods')}
function methodSeg(id){return '<div class="seg" id="'+id+'">'+methods().map(function(m,i){return '<button aria-pressed="'+(i===0)+'">'+esc(m)+'</button>'}).join('')+'</div>'}
function methodsOr(){var m=methods().map(function(x){return x==='Cash'?'cash':x});return m.length>1?m.slice(0,-1).join(', ')+' or '+m[m.length-1]:m.join('')}
// one pressed button in a group; cb(button) after each press
function segBind(sel,cb){$$(sel+' button').forEach(function(b){b.onclick=function(){$$(sel+' button').forEach(function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true');if(cb)cb(b)}})}
function segVal(sel,fb){return ($(sel+' [aria-pressed="true"]')||{}).textContent||fb}

/* ---------------- live data ---------------- */

function pkgOf0(cid){var l=pkgsOfClient(cid);if(!l.length)return null;var a=l.filter(function(p){return !/cancel/i.test(p.status)&&avail(p)>0});
  var srt=function(x){return x.slice().sort(byStart)};return a.length?srt(a)[0]:srt(l)[l.length-1]}
// passes already booked (scheduled, not marked yet) count against the package, so "left" = what can still be booked
function pend(p){return ix().pend[p.id]||0}

function bookPkg(cid,ty,d){var ok=function(x){return x.client===cid&&!/cancel/i.test(x.status)&&(x.kind===ty||(ty==='1:3'&&/trial/i.test(x.type)))};

function offerOf(p){var m=/(\d+)x\/month \(\$(\d+)/.exec(p.type);if(!m||(p.months||1)>=3)return null;var mo=+m[2];
 var t3=mo*3,p3=afterPct(t3,pct('m3Pct')),t6=mo*6,p6=afterPct(t6,pct('m6Pct'));return {mo:mo,t3:t3,p3:p3,t6:t6,p6:p6,half:Math.round(p6/2)}}

function lateRule(p){ if(!p||!p.price) return null; if(p.status&&p.status!=='Active') return null; var due=Math.round((p.price-p.paid)*100)/100; if(due<=0) return null; var limit=lateLimit(p.total); return {due:due, late:p.used>=limit, limit:limit} }
// payment is late after this session: 12 pack -> 3, 8 pack -> 2, else 1 (cfg.late)
function lateLimit(total){var l=(C('late.limits')||[]).filter(function(x){return total>=x[0]})[0];return l?l[1]:C('late.else')}
function lateText(){return (C('late.limits')||[]).map(function(x){return 'session '+x[1]+' ('+x[0]+' pack)'}).join(' or ')}

var BOOTSEQ=0,BOOTING=0;
function boot(silent){
  if(!silent){LOADED=false;LOAD_ERR='';render()}
  var seq=++BOOTSEQ;BOOTING++;
  return api('app_boot').then(function(d){BOOTING--;
    if(seq!==BOOTSEQ)return;   // a newer refresh was started (e.g. after a save): ignore this older answer
    applyBoot(d);render();if(Date.now()-WOT>60000)woLoad();nutQLoad();
    CACHE_KEY='wb_cache_'+String(KEY).slice(0,8);cacheBoot(d);
  }).catch(function(e){BOOTING--;if(seq!==BOOTSEQ)return;if(e.message==='auth'){try{localStorage.removeItem(CACHE_KEY)}catch(x){}KEY=null;store('wb_key','');LOADED=false}LOAD_ERR=e.message;if(!LOADED||e.message==='auth')render();else toast('Could not refresh: '+e.message)})}

var CACHE_MAX=3000000;   // with the workout cache (max 1 MB) this stays under the ~5 MB phones allow
function cacheBoot(d){try{var js=JSON.stringify(d);
  if(js.length>CACHE_MAX){var lite=Object.assign({},d,{files:[],intakes:(d.intakes||[]).map(function(x){var y=Object.assign({},x);delete y.data;return y})});js=JSON.stringify(lite)}
  if(js.length>CACHE_MAX)localStorage.removeItem(CACHE_KEY);else localStorage.setItem(CACHE_KEY,js)}catch(e){try{localStorage.removeItem(CACHE_KEY)}catch(x){}}}
// weekly pattern from the last windows.patternDays: a slot that ran in 3+ different weeks, with the clients who came at least half the time
function buildPatterns(){
  var from=ymd(addDays(TODAY,-C('windows.patternDays'))),slots={};
  var team={};trainerList().forEach(function(t){team[t]=1});
  SESS.forEach(function(s){if(s.date<from||s.date>=T||s.status==='Cancelled'||!team[s.trainer])return;var dow=dOf(s.date).getDay();if(!dow)return;
    var k=s.tab+'|'+s.trainer+'|'+dow+'|'+s.start,x=slots[k]=slots[k]||{tab:s.tab,trainer:s.trainer,dow:dow,time:s.start,weeks:{},n:0,who:{}};
    var wk=ymd(addDays(dOf(s.date),-((dow+6)%7)));if(x.weeks[wk])return;x.weeks[wk]=1;x.n++;
    s.clients.forEach(function(c){if(c.cid)x.who[c.cid]=(x.who[c.cid]||0)+1})});
  return Object.keys(slots).map(function(k){return slots[k]}).filter(function(x){return x.n>=3}).map(function(x){
    return {tab:x.tab,trainer:x.trainer,dow:x.dow,time:x.time,clients:Object.keys(x.who).filter(function(c){return x.who[c]>=Math.max(2,x.n/2)})}}).filter(function(p){return p.clients.length})}

// pay rules per person: cfg.staff[].pay  {rule:'tier', base} | {rule:'cut', cut} | {rule:'fixed', fixed:{training, Physio, PhysioIns, Prehab, Osteo...}}
function payOf(name){return staffT(name).pay||{}}
// per session pay for fixed-rate people (by service, PhysioIns = physio paid by insurance, training = any other session)
function fixedPay(s){var r=payOf(s.trainer),f=r.fixed;if(r.rule!=='fixed'||!f)return 0;
  if(s.tab==='Physio'&&/insur/i.test(s.pay||'')&&f.PhysioIns!=null)return f.PhysioIns;if(f[s.tab]!=null)return f[s.tab];if(f.training!=null)return f.training;var k=Object.keys(f);return k.length===1?f[k[0]]:0}
function fixedText(f){var k=Object.keys(f||{});if(k.length===1&&k[0]!=='training')return '$'+f[k[0]]+'/session';
  var out=[],grp={};if(f.training!=null)out.push('$'+f.training+' training');
  k.filter(function(x){return x!=='training'&&x!=='PhysioIns'}).forEach(function(x){(grp[f[x]]=grp[f[x]]||[]).push(x.toLowerCase())});
  Object.keys(grp).forEach(function(v){out.push('$'+v+' '+grp[v].join('/'))});if(f.PhysioIns!=null)out.push('$'+f.PhysioIns+' insurance');return out.join(', ')}
// the cut trainer's own clients pay her; the center only gets her cut per pass (paid upfront by her). Her fixed service (Madero) is 100% hers.
function isMel(cid){var c=clientById(cid);return !!(c&&c.mel)}
function centerValue(s,c){if(melSvc(s.tab))return 0;if(isMel(c.cid))return melCut();var p=pkgById(c.pkg);return p&&p.total?p.price/p.total:0}
function delivered(s){return s.clients.some(function(c){return deducts(c.att||(s.date<=T?'Present':''))})}
function tier(n){var t=(C('pay.tiers')||[]).filter(function(x){return x[0]==null||n<x[0]})[0];return t?t[1]:0}
function deducts(att){return att==='Present'||att==='Late Cancel'||att==='No Show'}
function cancelKind(s){ // Early = cancelled before the day of the session
  return s.date>T?'Early Cancel':'Late Cancel'}
// clients a trainer already has in that hour (all services), and whether `add` more would go over their cap
function loadAt(date,start,tr){var n=0,h=String(start||'').split(':')[0];(ix().byD[date]||[]).forEach(function(s){if(s.date===date&&String(s.start).split(':')[0]===h&&s.trainer===tr&&s.status!=='Cancelled')n+=s.clients.filter(function(c){return c.att!=='Early Cancel'}).length});return n}
function overCap(date,start,tr,add){var cp=capOf(tr);return cp>0&&loadAt(date,start,tr)+add>cp}

function dueSoon(){return payLists().soon.map(function(x){return {p:x.p,due:x.due,limit:x.limit}})}
function clientById(id){return ix().cl[id]}
// never undefined: guests and clients outside this phone's list get an empty card instead of crashing
function clientOf(id){return clientById(id)||{id:id,name:'',phone:'',email:'',notes:'',program:'',log:[]}}
function pkgById(id){return ix().pk[id]}
function sessOn(date,trainer){return (ix().byD[date]||[]).filter(function(s){return !trainer||s.trainer===trainer}).sort(function(a,b){return a.start<b.start?-1:1})}
function clientBadges(c,showMoney){

  if(p){var left=avail(p); out+='<span class="pill '+(left<=1?'p-warn':'p-mute')+'">'+left+' of '+p.total+' left</span>';
    var r=lateRule(p); if(r) out+='<span class="pill '+(r.late?'p-bad':'p-warn')+'">'+ICON('i-cash')+(r.late?'Payment due '+money(r.due):'Pays '+money(r.due)+' by session '+r.limit)+'</span>'}

     (opts.change?'<button class="btn sec sm" data-change="'+s.id+'">Change</button>':'')+'</div>';

      $('#excWhy').hidden=!ex};

    if($('#nd')){$('#nd').onchange=check;$('#nt').onchange=check;check()}
  }
  var wPaint=function(){$$('#what button').forEach(function(x){var on=x.getAttribute('aria-pressed')==='true';x.style.background=on?'var(--ink)':'';x.style.color=on?'var(--on-accent)':''})};
  $$('#what button').forEach(function(b){b.onclick=function(){$$('#what button').forEach(function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true');var w=b.dataset.w;if(/Cancel|Show/.test(w)){what='cancel';pick=w}else what=w;wPaint();paint()}});wPaint();

      '<a class="btn wa full" href="'+wa(c.phone,msg)+'" target="_blank" rel="noopener">'+ICON('i-wa')+'Send on WhatsApp</a><button class="btn sec full" id="doneBtn">Done</button>');

}

ACTIONS.week=function(){

  var nm=addDays(monday,7), days=[];
  for(var d=0;d<6;d++)days.push(ymd(addDays(nm,d)));
  var n=0,draft=[]; days.forEach(function(dd,i){PATTERNS.forEach(function(p){if(p.dow!==i+1)return;
    var cl=p.clients.map(function(cid){var c=clientById(cid),k=pkgOf(cid);return c&&k&&k.status==='Active'?{cid:cid,name:c.name,pkg:k.id}:null}).filter(Boolean)
      .filter(function(c){return !SESS.some(function(x){return x.date===dd&&x.start===p.time&&x.clients.some(function(y){return y.pkg===c.pkg})})});
    if(cl.length)draft.push({id:'D'+(n++),tab:p.tab,date:dd,start:p.time,trainer:p.trainer,clients:cl})})});
  var exists=SESS.some(function(s){return s.date>=days[0]&&s.date<=days[5]});
  var body='<div class="note good" style="margin-bottom:12px">'+ICON('i-check')+'<span>Built from what happened every week over the last '+C('windows.patternDays')+' days, only clients with an active package. Remove anything that changed, then confirm. Clients already booked are left out.</span></div>'+
   (exists?'<div class="note warn" style="margin-bottom:12px">'+ICON('i-alert')+'<span>Next week already has sessions. Confirming adds only the missing ones.</span></div>':'')+(draft.length?'':'<div class="empty">Nothing to add: everyone with a weekly slot is already booked.</div>')+
   '<div class="week">'+days.map(function(dd){var m=draft.filter(function(s){return s.date===dd});return '<div class="day"><h3>'+dayLabel(dd)+'<small>'+m.length+' sessions</small></h3>'+m.map(function(s){return '<div class="slot"><span class="t">'+hl(s.start).replace(':00','')+'</span><div class="main"><b>'+esc(s.tab)+' · '+esc(s.trainer)+'</b><br>'+s.clients.map(function(c){return esc(c.name)}).join(', ')+'</div><button class="iconbtn" aria-label="Remove" data-rm="'+s.id+'">'+ICON('i-x')+'</button></div>'}).join('')+'</div>'}).join('')+'</div>';
  openSheet('Next week',body,'<button class="btn full" id="confirmWeek">Confirm '+draft.length+' sessions</button>');

};

ACTIONS.sell=function(cid){
  var months=1,PRICE=null;   // PRICE: final price typed by staff (the discount is then calculated)
  openSheet('Sell a package','<div class="field"><label for="sc">Client</label><select id="sc">'+CLIENTS.slice().sort(byName).map(function(c){return '<option value="'+c.id+'"'+(c.id===cid?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')+'</select></div>'+
   '<div class="field"><label for="st">Package</label><select id="st">'+PKG_TYPES.map(function(t,i){return '<option value="'+i+'">'+esc(t.t)+'</option>'}).join('')+'</select></div>'+
   '<div class="field" id="smf"><span class="flabel">Length</span><div class="seg" id="smo"><button aria-pressed="true" data-m="1">1 month</button><button aria-pressed="false" data-m="3">3 months · '+pct('m3Pct')+'% off</button><button aria-pressed="false" data-m="6">6 months · '+pct('m6Pct')+'% off</button></div></div>'+
   '<div class="two"><div class="field"><label for="sfp">Final price ($)</label><input id="sfp" type="number" inputmode="decimal" min="0" step="0.5"></div><div class="field"><label for="sd">Discount %</label><input id="sd" type="number" inputmode="decimal" value="0" min="0" max="100"></div></div>'+
   '<div class="field"><label for="sp">Paid now ($)</label><input id="sp" type="number" inputmode="decimal" value="0" min="0"></div>'+
   '<div class="field"><label for="sday">Starts</label><input id="sday" type="date" value="'+T+'"></div>'+
   '<div class="field"><span class="flabel">Paid by</span>'+methodSeg('sm')+'</div><div id="sumP" class="note good"></div>',
   '<button class="btn ok full" id="doSell">'+ICON('i-check')+'Create package</button>');
  segBind('#sm');
  var clientDisc=function(){var c=clientById($('#sc').value);return c&&c.disc||0};
  var setDisc=function(){PRICE=null;$('#sd').value=Math.max(clientDisc(),months===3?pct('m3Pct'):months===6?pct('m6Pct'):0)};
  segBind('#smo',function(b){months=+b.dataset.m;setDisc();
    var t=PKG_TYPES[+$('#st').value],tot=Math.round(t.p*months*(1-(+$('#sd').value||0)/100));$('#sp').value=months===6?Math.round(tot/2):months===3?tot:0;sum()});
  var sum=function(){var t=PKG_TYPES[+$('#st').value],mel=isMel($('#sc').value),mad=melSvc(t.kind),monthly=/x\/month/.test(t.t);
    $('#smf').hidden=!monthly;if(!monthly&&months!==1){months=1;$$('#smo button').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.m==='1'?'true':'false')});setDisc()}
    var list=t.p*months,d=+$('#sd').value||0,total=Math.round(list*(1-d/100));if(PRICE!=null){total=Math.round(PRICE*100)/100;d=list>0?Math.max(0,Math.round((1-total/list)*10000)/100):0;$('#sd').value=d}else $('#sfp').value=total;var paid=Math.min(total,+$('#sp').value||0),st=$('#sday').value||T,each=Math.round(total/months*100)/100;
    var lines=months>1?'<br>'+[].concat.apply([],Array(months).fill(0).map(function(x,k){return [k]})).map(function(k){var dd=ymd(addDays(dOf(st),C('windows.packDays')*k));return 'Month '+(k+1)+': '+dayLabel(dd)+' · '+t.n+' sessions · '+money(k<months-1?each:total-each*(months-1))}).join('<br>'):'';
    $('#sumP').innerHTML=ICON('i-check')+'<span>'+(months>1?'<b>'+months+' packages, one per month.</b> ':'')+t.n+' passes'+(months>1?' each':'')+' · total '+money(total)+(months>1?' instead of '+money(t.p*months):'')+' · '+money(Math.max(0,total-paid))+' left to pay'+(months===6?' (2nd half due on day 1 of month 3)':'')+'.'+
      (months===1?' Valid '+validText(t)+'.':'')+lines+(mad?'<br>'+esc(t.kind)+': 100% '+esc(melName())+', '+DESK()+' collects from the client as usual.':mel?'<br>'+esc(melName())+'\'s client: '+DESK()+' collects from the client, '+esc(melName())+' pays the center $'+melCut()+'/pass upfront.':'')+'</span>'};
  ['sp','sday'].forEach(function(i){$('#'+i).oninput=sum});$('#sd').oninput=function(){PRICE=null;sum()};$('#sfp').oninput=function(){var v=this.value;PRICE=v===''?null:Math.max(0,+v||0);sum()};$('#st').onchange=$('#st').oninput=function(){PRICE=null;sum()};$('#sc').onchange=function(){setDisc();sum()};setDisc();sum();
  $('#doSell').onclick=function(){var t=PKG_TYPES[+$('#st').value],c=clientById($('#sc').value),m=segVal('#sm',methods()[0]);if(!c){toast('Pick a client');return}
    var tot=PRICE!=null?Math.round(PRICE*100)/100:Math.round(t.p*months*(1-(+$('#sd').value||0)/100));closeSheet();
    save('app_sell',{cid:c.id,type:t.t,months:months,discount:+$('#sd').value||0,price:PRICE!=null?PRICE:undefined,paid:Math.max(0,Math.min(tot,+$('#sp').value||0)),method:m,start:$('#sday').value||T},null,true).then(function(j){toast((j.ids&&j.ids.length>1?j.ids.length+' months created':j.id+' created')+' for '+c.name)})};
};

// next free trial slots (Mon to Sat, hours.trial, the trial trainer under their cap), for the "pick another time" message
function freeTrialSlots(n,skip){var out=[],tr=trialTr(),hs=C('hours.trial').map(function(h){return pad(h)+':00'});for(var i=1;i<15&&out.length<n;i++){var d=addDays(TODAY,i);if(d.getDay()===0)continue;var dd=ymd(d);
  hs.forEach(function(t){if(out.length<n&&!overCap(dd,t,tr,1)&&!(skip&&skip.date===dd&&hl(t)===skip.time))out.push(dayLabel(dd)+' at '+hl(t))})}return out}
function otherTimeMsg(l){var sl=freeTrialSlots(3,l);
  return 'Hi '+first(l.name)+', this is '+DESK()+' from '+C('center.name')+'. Thank you for booking your free session'+(l.date?' on '+dayLabel(l.date)+' at '+l.time:'')+'! '+(l.date?'That time is not available anymore. ':'')+'Which of these suits you better?\n\n'+sl.map(function(x,i){return (i+1)+'. '+x}).join('\n')+'\n\nJust reply with the number, or tell me another morning that works for you.'}

/* ---------- confirm a trial lead: what she receives ---------- */
// whole hours the center is open (hours.open to hours.close)
function hourList(){var o=[];for(var h=C('hours.open');h<=C('hours.close');h++)o.push(h);return o}
function stepSec(){return C('hours.step')*60}
function confirmLead(id){
  var l=LEADS.filter(function(x){return x.id===id})[0];
  var h0=l.time?(function(){var m=/^(\d{1,2})(?::\d{2})?\s*([ap])/i.exec(l.time);if(!m)return 9;var h=+m[1];if(/p/i.test(m[2])&&h<12)h+=12;if(/a/i.test(m[2])&&h===12)h=0;return h})():9;
  var d0=l.date||ymd(nextWorkday());
  var msgFor=function(d,h){return 'Hi '+first(l.name)+', this is '+DESK()+' from '+C('center.name')+'. Your free session is confirmed for '+dayLong(d)+' at '+hl(pad(h)+':00')+'.\n\n'+
    'Bring: comfortable clothes, training shoes, a water bottle and a towel (at least 30 x 50 cm).\n'+
    'Location: '+C('center.maps')+'\n\nSee you there! Reply here if anything changes.'};
  openSheet('Confirm '+first(l.name),
   '<div class="note good" style="margin-bottom:12px">'+ICON('i-check')+'<span>Confirming creates her client file, the free trial package and her spot in the 1:3 session.</span></div>'+
   '<div class="muted" style="font-size:14px">'+(l.date?'She picked '+dayLabel(l.date)+' at '+esc(l.time)+'. Change it here if you agreed on another time.':'She did not pick a time. Set the one you agreed on.')+'</div>'+
   '<div class="two"><div class="field"><label for="cfD">Day</label><input id="cfD" type="date" value="'+d0+'" min="'+T+'"></div><div class="field"><label for="cfH">Time</label><select id="cfH">'+hourList().map(function(h){return '<option value="'+h+'"'+(h===h0?' selected':'')+'>'+hl(pad(h)+':00')+'</option>'}).join('')+'</select></div></div><div id="cfCap"></div>'+
   '<p class="muted" style="margin:12px 0 8px">She receives this on WhatsApp when you press send:</p><div class="card" id="cfMsg" style="padding:12px 14px;font-size:15px;white-space:pre-line"></div>',
   '<a class="btn wa full" id="cfSend" target="_blank" rel="noopener">'+ICON('i-wa')+'Confirm and send on WhatsApp</a><button class="btn sec full" id="cfOnly">Confirm without message</button><div class="two" style="margin-top:8px"><a class="btn sec" href="'+wa(l.phone,otherTimeMsg(l))+'" target="_blank" rel="noopener">'+ICON('i-wa')+'Ask for another time</a><button class="btn sec" id="cfCancel">Cancel trial</button></div>');
  var cur=function(){return {d:$('#cfD').value,h:+$('#cfH').value}};
  var tr=trialTr();
  var paint=function(){var c=cur(),m=msgFor(c.d,c.h);$('#cfMsg').textContent=m;$('#cfSend').href=wa(l.phone,m);var n=loadAt(c.d,pad(c.h)+':00',tr);
    $('#cfCap').innerHTML=(c.d&&overCap(c.d,pad(c.h)+':00',tr,1)?'<div class="note bad">'+ICON('i-alert')+'<span>'+esc(tr)+' already has '+n+' clients at that hour. Pick another time.</span></div>':'')+(c.d&&c.d!==l.date||c.h!==h0&&l.date?'<div class="note warn" style="margin-top:8px">'+ICON('i-swap')+'<span>Moved: the trial will be booked on '+dayLabel(c.d)+' at '+hl(pad(c.h)+':00')+'.</span></div>':'')};
  $('#cfD').onchange=paint;$('#cfH').onchange=paint;paint();
  $('#cfCancel').onclick=function(){cancelLead(id)};
  var done=function(e){var c=cur();if(!c.d){if(e)e.preventDefault();toast('Pick the day');return false}if(overCap(c.d,pad(c.h)+':00',tr,1)){if(e)e.preventDefault();toast(tr+' is full at that hour');return false}
    l.status='Confirmed';l.date=c.d;l.time=hl(pad(c.h)+':00');closeSheet();render();
    save('app_lead',{row:l.row,id:l.id,date:c.d,time:hl(pad(c.h)+':00')},null,true).then(function(){toast(l.name+' confirmed for '+dayLabel(c.d)+' at '+l.time)});return true};
  $('#cfSend').addEventListener('click',function(e){if(done(e)===false)return});$('#cfOnly').onclick=function(){done()};
}

// photos are shrunk to 1600px JPEG before upload; PDFs go as they are (max 15 MB)
function prepFile(file){return new Promise(function(res,rej){
  if(file.size>15*1024*1024){rej(new Error(file.name+' is over 15 MB'));return}
  var r=new FileReader();r.onerror=function(){rej(new Error('Could not read '+file.name))};
  if(/^image\//.test(file.type)&&!/gif|svg/.test(file.type)){r.onload=function(){var img=new Image();img.onload=function(){var k=Math.min(1,1600/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      res({name:file.name.replace(/\.\w+$/,'')+'.jpg',mime:'image/jpeg',b64:cv.toDataURL('image/jpeg',0.85).split(',')[1]})};img.onerror=function(){res({name:file.name,mime:file.type,b64:r.result.split(',')[1]})};img.src=r.result};}
  else r.onload=function(){res({name:file.name,mime:file.type||'application/pdf',b64:r.result.split(',')[1]})};
  r.readAsDataURL(file)})}
function uploadAll(cid,cname,files){var chain=Promise.resolve();files.forEach(function(file){chain=chain.then(function(){return prepFile(file)}).then(function(x){toast('Uploading '+x.name+'…');return save('app_upload',{cid:cid,cname:cname,name:x.name,mime:x.mime,b64:x.b64})}).then(function(j){FILES.unshift({cid:cid,name:j.name,url:j.url,date:T,by:ME.name})})});return chain}

    var rows=mine.filter(function(x){return x.c.pkg===p.id}).sort(function(a,b){return (a.s.date+a.s.start)<(b.s.date+b.s.start)?1:-1});
    var used=p.used,left=Math.max(0,p.total-used),y=rows.filter(function(x){return x.c.flag==='Y'}).length;
    var pres=rows.filter(function(x){return hxState(x.s,x.c)[0]==='Present'}).length,late=rows.filter(function(x){return /Late|No show/.test(hxState(x.s,x.c)[0])}).length,booked=rows.filter(function(x){return hxState(x.s,x.c)[0]==='Booked'}).length;
    var wrong=rows.filter(function(x){return p.kind&&p.kind!==x.s.tab});   // a package only holds sessions of its own service
    var warn='';
    if(wrong.length)warn+='<div class="hx-warn"><b>'+wrong.length+' session'+(wrong.length>1?'s':'')+' on the wrong package:</b> '+wrong.map(function(x){return x.s.tab+' '+dayLabel(x.s.date)+' ('+x.s.id+')'}).join(', ')+'. A '+esc(p.kind)+' package should only hold '+esc(p.kind)+' sessions. Move '+(wrong.length>1?'them':'it')+' to the right package in the sheet.</div>';
    if(p.start&&p.start>=from&&y!==used)warn+='<div class="hx-warn">The sheet says <b>'+used+' used</b>, the sessions below took <b>'+y+' passes</b>. Check the Pass column for this package.</div>';
    var dw=p.total?Math.min(100,used/p.total*100):0,lw=p.total?Math.min(100-dw,late/p.total*100):0;
    var list=rows.map(function(x,i){var st=hxState(x.s,x.c);return '<div class="hx-s"'+(i>=5?' data-hxm hidden':'')+'><span class="hx-n">'+(rows.length-i)+'</span><span class="d">'+dayLabel(x.s.date)+' · '+hl(x.s.start)+'<small>'+esc(x.s.tab)+' with '+esc(x.s.trainer)+(x.c.flag==='Y'?' · pass taken':'')+'</small></span><span class="pill '+st[1]+'">'+st[0]+'</span></div>'}).join('');
    var done=/complete|finish|expired|cancel/i.test(p.status)||(!left&&!booked);
    return '<div class="hx-pk"><div class="hx-h"><b>'+esc(p.type.replace(/\s*\(\$[^)]*\)/,''))+'</b><span class="pill '+(done?'p-mute':'p-good')+'">'+(done?'Finished':esc(p.status||'Active'))+'</span></div>'+
      '<div class="hx-meta">'+esc(p.id)+(p.start?' · '+dayLabel(p.start):'')+(p.expiry?' → '+dayLabel(p.expiry):'')+(ME.role!=='trainer'&&p.price?' · '+money(p.price)+(p.paid>=p.price?' paid':' ('+money(p.paid||0)+' paid)'):'')+'</div>'+
      '<div class="hx-bar"><i style="width:'+dw+'%"></i><u style="width:'+lw+'%"></u></div>'+
      '<div class="hx-cnt"><span><b>'+pres+'</b> attended'+(late?' · <b>'+late+'</b> late cancel / no show':'')+(booked?' · <b>'+booked+'</b> booked':'')+'</span><b style="color:var(--good)">'+left+' of '+p.total+' left</b></div>'+
      (rows.length?list:'<div class="hx-s"><span class="d muted">'+(p.start&&p.start<from?'Sessions older than '+back+' days are not loaded here.':'No sessions yet.')+'</span></div>')+
      (rows.length>5?'<button class="hx-more" data-hxmore>Show '+(rows.length-5)+' more</button>':'')+warn+'</div>'}).join('');
  return '<span class="flabel">Session history</span>'+chips+(cards||'<p class="muted">No packages.</p>')+(!HIST&&ME.role!=='owner'?'<p class="muted" style="font-size:12px">Showing the last '+back+' days of sessions.</p>':'')}
function hxMount(id,svc){
  var body=$('#shBody');if(!body)return;var box=body.querySelector('#hxBox');
  if(!box){box=document.createElement('div');box.id='hxBox';body.appendChild(box)}
  box.innerHTML=hxView(id,svc||'All');ssScan(box);
  $$('[data-hx]',box).forEach(function(b){b.onclick=function(){hxMount(id,b.dataset.hx)}});
  $$('[data-hxmore]',box).forEach(function(b){b.onclick=function(){$$('[data-hxm]',b.parentNode).forEach(function(r){r.hidden=false});b.remove()}});
  if(ME.role==='owner'&&!HIST)loadHistory()}

/* ---------- NUTRITION PLANS: coach approval (approved preview, 23 Oct) ----------
   Every role loads its own list (app_nut_list): owner and the front desk see all, trainers only their clients. */
var NUTQ=[],NUTO=null,NUTDAY=0,NUTFULL=false,NUTWK=[0,1,2,3,0,1,2];
function nutQLoad(){if(!ME)return;api('app_nut_list').then(function(j){var n=j.plans||[],same=JSON.stringify(n)===JSON.stringify(NUTQ);NUTQ=n;if(!same)render()}).catch(function(){})}
function nutTodoItems(){return NUTQ.map(function(p){var w=p.status==='Pending';
  return {id:'nut-'+p.id,level:w?'warn':'bad',icon:'i-heart',title:esc(p.name)+' · Nutrition plan',sub:w?'Ready to check · '+(p.kcal||'?')+' kcal · P '+(p.p||'?')+' C '+(p.c||'?')+' F '+(p.f||'?'):p.status==='Coach review'?'Health answers: build it with them personally':'The AI could not write it: regenerate',btn:'Open',act:'nut|'+p.cid+'|'+p.id}})}
function nutTodoBlock(){var it=nutTodoItems().filter(function(x){return !DONE_TODO[x.id]});if(!it.length)return '';
  return '<div class="h"><h2>Nutrition plans</h2><small>'+it.length+' to check</small></div><div class="list" style="margin-bottom:16px">'+it.map(todoRow).join('')+'</div>'}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-todo^="nut|"]');if(!b)return;var x=b.dataset.todo.split('|');nutSheet(x[1],x[2])});
function nutDate(ymd){return ymd?dayLabel(ymd):''}
function nutView(){var o=NUTO,p=o.plan||{},m=p.macros||o.calc||{},pl=p.plan,a=o.answers||{},b=o.body||{},fl=o.flags||[];
  var st={Pending:['Waiting for you','p-warn'],Approved:['Approved','p-good'],'Coach review':['Coach review','p-bad'],Failed:['AI failed','p-bad'],Queued:['Writing','p-mute'],Writing:['Writing','p-mute'],Declined:['Declined','p-mute']}[p.status]||[p.status||'No plan','p-mute'];
  var L=function(v){return (v||[]).join ? (v||[]).filter(function(x){return x!=='none'}).join(', ') : (v||'')};
  var h='<div class="card" style="padding:14px"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>'+esc(o.name||o.cid)+'</b><span class="pill '+st[1]+'">'+st[0]+'</span></div>'+
   '<div class="muted" style="font-size:14px">'+(b.age?num(b.age)+' · ':'')+(b.weight?num(b.weight):'?')+' → '+(o.target?num(o.target):'?')+' kg'+(o.paid?'':' · no paid package')+'</div>'+
   '<dl class="kv" style="margin-top:10px"><dt>Daily</dt><dd>'+(m.kcal?num(m.kcal).toLocaleString()+' kcal · P '+num(m.p)+' · C '+num(m.c)+' · F '+num(m.f):'Set by coach')+'</dd>'+
   (m.rateKg?'<dt>Pace</dt><dd>'+num(m.rateKg)+' kg / week</dd>':'')+(m.method?'<dt>Method</dt><dd>'+esc(m.method)+((o.comp||{}).bf?' (body fat '+num(o.comp.bf)+'%)':'')+'</dd>':'')+
   '<dt>Allergies</dt><dd>'+esc(L(a.allergy)||'None')+(a.allergy_other?' · '+esc(a.allergy_other):'')+'</dd><dt>Rules</dt><dd>'+esc(L(a.rules)||'None')+'</dd><dt>Dislikes</dt><dd>'+esc(a.dislike||'None')+'</dd>'+
   (pl&&pl.days&&pl.days.length?'<dt>Days</dt><dd>'+pl.days.length+' templates, all checked ✓</dd>':'')+'</dl>'+
   '<div class="note '+(fl.length?'bad':'warn')+'" style="margin-top:10px">'+ICON(fl.length?'i-alert':'i-check')+'<span>'+(fl.length?'<b>Health answers: '+esc(fl.join(', '))+'.</b> Check this plan carefully'+(/minor|pregnant|ed|kidney/.test(fl.join(','))?', or build it with them personally.':'.'):'Health answers: none. The code checked every day: calories, protein, allergies, dislikes.')+'</span></div>'+
   (p.error?'<div class="note bad" style="margin-top:8px">'+ICON('i-alert')+'<span>'+esc(p.error).slice(0,240)+'</span></div>':'')+'</div>';
  h+='<div class="field" style="margin-top:12px"><label for="nuN">Coach note to client</label><textarea id="nuN" rows="3" placeholder="e.g. On training days have the banana before the session">'+esc(p.note||'')+'</textarea></div>';
  h+='<details class="card" style="padding:12px 14px;margin-top:4px"><summary style="font-weight:700;cursor:pointer">Regenerate with different numbers (optional)</summary><div class="two" style="margin-top:10px"><div class="field"><label for="nuK">Calories</label><input id="nuK" type="number" inputmode="numeric" placeholder="'+(m.kcal?num(m.kcal):'')+'"></div><div class="field"><label for="nuP">Protein g</label><input id="nuP" type="number" inputmode="numeric" placeholder="'+(m.p?num(m.p):'')+'"></div><div class="field"><label for="nuC">Carbs g</label><input id="nuC" type="number" inputmode="numeric" placeholder="'+(m.c?num(m.c):'')+'"></div><div class="field"><label for="nuF">Fat g</label><input id="nuF" type="number" inputmode="numeric" placeholder="'+(m.f?num(m.f):'')+'"></div></div><div class="muted" style="font-size:13px">Empty = same numbers. The note above is sent to the AI too.</div></details>';
  h+='<details class="card" style="padding:12px 14px;margin-top:10px"><summary style="font-weight:700;cursor:pointer">Their answers</summary><dl class="kv" style="margin-top:10px">'+
   [['Goal',a.goal],['Why',a.why],['Pace',a.pace],['Job',a.job],['Training',a.train_days?a.train_days+' days · '+(a.train_time||''):''],['Meals',a.meals],['Breakfast',a.breakfast],['Cooks',a.cook],['Eats now',a.now_day],['Eats a lot',L(a.often)],['Loves',L(a.love)+(a.love_other?', '+a.love_other:'')],['Digestion',L(a.digest)],['Drinks','coffee '+(a.coffee||'?')+' · sugary '+(a.sugar_drinks||'?')+' · alcohol '+(a.alcohol||'?')],['Cravings',a.cravings],['Weekend',a.weekend],['Supplements',L(a.supps)]].filter(function(x){return x[1]}).map(function(x){return '<dt>'+x[0]+'</dt><dd>'+esc(x[1])+'</dd>'}).join('')+'</dl></details>';
  if(pl){h+='<button class="btn sec full" id="nuFull" style="margin-top:12px">'+(NUTFULL?'Hide the full plan':'Open the full plan · Day A B C D · Grocery list')+'</button>';
    if(NUTFULL&&pl.days&&pl.days.length){var di=NUTWK[NUTDAY]%pl.days.length,d=pl.days[di],t=d.totals||{};
      h+='<div class="hx-chips" style="margin-top:12px">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function(x,i){return '<button class="hx-chip" data-nuday="'+i+'" aria-pressed="'+(i===NUTDAY)+'">'+x+'</button>'}).join('')+'</div>'+
       '<div class="muted" style="font-size:13px;margin-bottom:8px">Day '+'ABCD'.charAt(di)+' · '+(t.kcal||0)+' kcal · P '+(t.p||0)+' C '+(t.c||0)+' F '+(t.f||0)+'</div>'+
       (d.meals||[]).map(function(ml){return '<div class="card" style="padding:12px 14px;margin-bottom:8px"><div class="muted" style="font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase">'+esc(ml.slot||'')+(ml.time?' · '+esc(ml.time):'')+'</div><b>'+esc((ml.name||{}).en||'')+'</b>'+
         (ml.items||[]).map(function(x){return '<div style="display:flex;justify-content:space-between;gap:10px;font-size:13.5px;border-top:1px solid var(--line);padding:5px 0;margin-top:4px"><span>'+esc((x.food||{}).en||'')+'</span><span class="muted">'+Math.round(x.g||0)+' '+esc(x.unit||'g')+' · '+esc((x.measure||{}).en||'')+' · '+Math.round(x.kcal||0)+' kcal</span></div>'}).join('')+
         (ml.swap&&ml.swap.en?'<div style="font-size:13px;color:var(--mint-deep);margin-top:4px">↺ '+esc(ml.swap.en)+'</div>':'')+'</div>'}).join('')+
       '<div class="h" style="margin-top:10px"><h2 style="font-size:20px">Grocery list</h2></div>'+(pl.grocery||[]).map(function(g){return '<div class="muted" style="font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:10px 0 4px">'+esc((g.aisle||{}).en||'')+'</div>'+(g.items||[]).map(function(x){return '<div style="display:flex;justify-content:space-between;font-size:14px;padding:5px 0;border-bottom:1px solid var(--line)"><span>'+esc(x.en)+'</span><span class="muted">'+esc(x.qty)+'</span></div>'}).join('')}).join('')}}
  return h}
function nutSheet(cid,id){NUTFULL=false;NUTDAY=0;openSheet('Nutrition plan','<p class="muted" style="padding:30px 0;text-align:center">Loading the plan…</p>');
  api('app_nut_get',{cid:cid,id:id}).then(function(o){NUTO=o;nutPaint()}).catch(function(e){closeSheet();toast('Could not open: '+e.message)})}
function nutPaint(){var p=(NUTO.plan||{}),can=p.status==='Pending'&&p.plan,open=/Pending|Coach review|Failed|Approved/.test(p.status||'');
  openSheet('Nutrition plan',nutView(),(open?'<div style="display:grid;grid-template-columns:'+(can?'1fr ':'')+'1fr 1fr;gap:8px">'+(can?'<button class="btn ok" id="nuA">'+ICON('i-check')+'Approve</button>':'')+'<button class="btn sec" id="nuR">Regenerate</button>'+(p.status!=='Approved'?'<button class="btn sec" id="nuX" style="color:var(--bad)">Decline</button>':'<button class="btn sec" id="nuS">Save note</button>')+'</div>':''));
  var sc=$('#shBody').scrollTop;
  if($('#nuFull'))$('#nuFull').onclick=function(){NUTFULL=!NUTFULL;var y=$('#shBody').scrollTop;nutPaint();$('#shBody').scrollTop=y};
  $$('[data-nuday]').forEach(function(b){b.onclick=function(){NUTDAY=+b.dataset.nuday;var y=$('#shBody').scrollTop;nutPaint();$('#shBody').scrollTop=y}});
  var go=function(act,msg,extra){var d=Object.assign({cid:NUTO.cid,id:p.id,act:act,note:$('#nuN').value.trim()},extra||{});closeSheet();
    save('app_nut_decide',d,msg).then(function(){NUTQ=NUTQ.filter(function(x){return x.id!==p.id});REQUESTS=REQUESTS.filter(function(q){return !(q.type==='Nutrition plan'&&q.cid===NUTO.cid)});render();nutQLoad()}).catch(function(){})};
  if($('#nuA'))$('#nuA').onclick=function(){go('approve','Approved: '+first(NUTO.name||'')+' can see the plan now')};
  if($('#nuX'))$('#nuX').onclick=function(){go('decline','Declined. Tell '+first(NUTO.name||'')+' what happens next.')};
  if($('#nuS'))$('#nuS').onclick=function(){go('note','Note saved')};
  if($('#nuR'))$('#nuR').onclick=function(){var n=function(id){var v=$('#'+id);return v&&+v.value||0};go('regen','A new plan is being written. It comes back here to check.',{kcal:n('nuK'),p:n('nuP'),c:n('nuC'),f:n('nuF')})}}

function nutClientBtn(cid){var body=$('#shBody');if(!body||body.querySelector('#nuOpen'))return;var b=document.createElement('button');b.className='btn sec full';b.id='nuOpen';b.style.margin='0 0 14px';b.innerHTML=ICON('i-heart')+'Nutrition plan';
  var wo=body.querySelector('#woOpen');if(wo&&wo.parentNode)wo.parentNode.insertBefore(b,wo.nextSibling);else body.appendChild(b);b.onclick=function(){nutSheet(cid,'')}}

if(KEY){try{var cached=localStorage.getItem('wb_cache_'+String(KEY).slice(0,8));if(cached){applyBoot(JSON.parse(cached))}}catch(e){}}
