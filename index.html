<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wellbe Team</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f6e5b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wellbe Team">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first staff app. One sticky top bar, one bottom tab bar per role,
   every task is one screen; actions open a bottom sheet. */
:root{
  --bg:#f2f5f4; --card:#ffffff; --ink:#151b1e; --ink-2:#4b565b; --ink-3:#6d777b; --line:#dde3e1;
  --mint:#6fc7b1; --mint-deep:#1f6e5b; --mint-soft:#e2f3ee;
  --crimson:#a3263f; --crimson-soft:#f8e7eb;
  --amber:#8a5a00; --amber-soft:#fff2d6;
  --good:#1f6e5b; --good-soft:#e2f3ee; --warn:#8a5a00; --warn-soft:#fff2d6; --bad:#a3263f; --bad-soft:#f8e7eb;
  --series:#139a72; --track:#e6ecea;
  --wa:#1f8f4e;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:Barlow,"Segoe UI",Roboto,Arial,sans-serif;
  --r:14px; --tabh:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1416; --card:#182024; --ink:#eef2f1; --ink-2:#b9c3c0; --ink-3:#8e9a97; --line:#2a3539;
  --mint:#6fc7b1; --mint-deep:#7fd3bd; --mint-soft:#163a31;
  --crimson:#ef7c93; --crimson-soft:#3a1820; --amber:#f2c46b; --amber-soft:#3a2d10;
  --good:#7fd3bd; --good-soft:#163a31; --warn:#f2c46b; --warn-soft:#3a2d10; --bad:#ef7c93; --bad-soft:#3a1820;
  --series:#199e70; --track:#24302f; --wa:#2fae63; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1416; --card:#182024; --ink:#eef2f1; --ink-2:#b9c3c0; --ink-3:#8e9a97; --line:#2a3539;
  --mint:#6fc7b1; --mint-deep:#7fd3bd; --mint-soft:#163a31;
  --crimson:#ef7c93; --crimson-soft:#3a1820; --amber:#f2c46b; --amber-soft:#3a2d10;
  --good:#7fd3bd; --good-soft:#163a31; --warn:#f2c46b; --warn-soft:#3a2d10; --bad:#ef7c93; --bad-soft:#3a1820;
  --series:#199e70; --track:#24302f; --wa:#2fae63; color-scheme:dark }
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:var(--body);font-size:16px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink)}
h1,h2,h3{font-family:var(--display);line-height:1.05;text-wrap:balance}
:focus-visible{outline:3px solid var(--mint-deep);outline-offset:2px;border-radius:8px}
.icon{width:22px;height:22px;flex:none}
.num{font-variant-numeric:tabular-nums}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;height:58px;padding-inline:16px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--mint);display:grid;place-items:center;font:800 18px var(--display);color:#151b1e}
.who{flex:1;min-width:0}
.who b{display:block;font-size:15px;line-height:1.2}
.who span{font-size:12.5px;color:var(--ink-3)}
.rolechip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:var(--mint-soft);color:var(--mint-deep)}
main{max-width:760px;margin:0 auto;padding:18px 16px calc(var(--tabh) + 28px)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:760px;margin:0 auto;display:flex}
.tab{flex:1;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--ink-3);position:relative}
.tab[aria-current=page]{color:var(--mint-deep)}
.tab[aria-current=page]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--mint-deep)}
.tab .badge{position:absolute;top:8px;left:55%;min-width:18px;height:18px;border-radius:9px;background:var(--crimson);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* common */
.h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 0 10px}
.h:first-child{margin-top:0}
.h h2{font-size:26px;font-weight:800;text-transform:uppercase}
.h small{color:var(--ink-3);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:60px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
button.row:hover{border-color:var(--ink-3)}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-size:16px;line-height:1.25}
.row .main span{display:block;font-size:13.5px;color:var(--ink-2)}
.time{font:800 20px/1 var(--display);min-width:54px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill svg{width:14px;height:14px}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-mute{background:var(--bg);color:var(--ink-2)}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;background:var(--crimson);color:#fff;font-weight:700;font-size:16px}
.btn.full{width:100%}
.btn.sec{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.wa{background:var(--wa);color:#fff}
.btn.ok{background:var(--mint-deep);color:#fff}
.btn.sm{min-height:40px;font-size:14px;padding:0 12px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.muted{color:var(--ink-3)}
.empty{padding:22px;text-align:center;color:var(--ink-3);border:1.5px dashed var(--line);border-radius:var(--r)}
.search{width:100%;min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 14px 0 44px}
.searchwrap{position:relative;margin-bottom:12px}
.searchwrap svg{position:absolute;left:14px;top:14px;width:20px;height:20px;color:var(--ink-3)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}

/* home tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;min-height:128px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:left;position:relative}
.tile .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--mint-soft);color:var(--mint-deep)}
.tile b{font:800 21px/1.05 var(--display);text-transform:uppercase}
.tile span{font-size:13px;color:var(--ink-2)}
.tile .count{position:absolute;top:14px;right:14px;font:800 26px/1 var(--display)}
.tile.alert .ic{background:var(--bad-soft);color:var(--bad)}
.tile.alert .count{color:var(--bad)}

/* quick actions + to do */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qb{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700}
.qb .ic{position:relative;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--mint-soft);color:var(--mint-deep)}
.qb .dot{position:absolute;top:-6px;right:-8px;min-width:20px;height:20px;border-radius:10px;background:var(--crimson);color:#fff;font-size:11.5px;display:grid;place-items:center;padding:0 5px}
.todo{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 12px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r)}
.todo.t-bad{border-left-color:var(--bad)} .todo.t-warn{border-left-color:var(--warn)} .todo.t-mute{border-left-color:var(--mint)}
.todo .ti{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--bg);color:var(--ink-2);flex:none}
.todo .ti svg{width:19px;height:19px}
.todo .main{flex:1;min-width:0}
.todo .main b{display:block;font-size:15px;line-height:1.25}
.todo .main span{display:block;font-size:13px;color:var(--ink-3)}
.iconbtn.sm{width:40px;height:40px;color:var(--ink-3)}
.fab{position:fixed;right:16px;bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));z-index:25;width:58px;height:58px;border-radius:18px;background:var(--crimson);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(163,38,63,.35)}
.fab svg{width:26px;height:26px}
.notebox{border-radius:12px;background:var(--bg);padding:10px 12px;font-size:14.5px;margin-bottom:10px}
.notebox b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.pick{max-height:240px;overflow-y:auto;display:grid;gap:6px;margin-top:6px}
/* sessions */
.sess{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sess .hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sess .hd .main{flex:1;min-width:0}
.sess .hd b{font-size:15px}
.sess .hd span{display:block;font-size:13px;color:var(--ink-3)}
.cl{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.cl:first-of-type{border-top:0}
.cl .main{flex:1;min-width:0}
.cl .main b{font-size:15.5px}
.cl .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.att{display:flex;gap:4px;flex-wrap:wrap;padding:0 14px 12px}
.att button{flex:1;min-width:70px;min-height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:700;color:var(--ink-2)}
.att button[aria-pressed=true].a-present{background:var(--good);border-color:var(--good);color:var(--card)}
.att button[aria-pressed=true].a-late,.att button[aria-pressed=true].a-noshow{background:var(--bad);border-color:var(--bad);color:var(--card)}
.att button[aria-pressed=true].a-early{background:var(--warn);border-color:var(--warn);color:var(--card)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,14,16,.5);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:90vh;display:flex;flex-direction:column;background:var(--card);border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:760px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:10px auto 0}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:10px 16px 6px}
.sheet .sh h3{flex:1;font-size:24px;text-transform:uppercase}
.sheet .sb{overflow-y:auto;padding:6px 16px 16px}
.sheet .sf{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;gap:8px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.iconbtn:hover{background:var(--bg)}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>label,.flabel{font-weight:700;font-size:14px}
.field input,.field select,.field textarea{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px;width:100%}
.field textarea{padding:10px 12px;min-height:74px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:13.5px;padding:10px 12px;border-radius:12px;display:flex;gap:8px;align-items:flex-start}
.note svg{width:18px;height:18px;flex:none;margin-top:1px}
.note.warn{background:var(--warn-soft);color:var(--warn)} .note.good{background:var(--good-soft);color:var(--good)} .note.bad{background:var(--bad-soft);color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.kv dt{color:var(--ink-3)}
.kv dd{font-weight:600}

/* week grid */
.week{display:grid;gap:10px}
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.day h3{font-size:19px;text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline}
.day h3 small{font:600 13px var(--body);color:var(--ink-3);text-transform:none}
.slot{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.slot:first-of-type{border-top:0}
.slot .t{font:800 17px var(--display);min-width:48px}
.slot .main{flex:1;min-width:0;font-size:14px}
.slot .main b{font-size:14.5px}
.tag{font-size:11.5px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--mint-soft);color:var(--mint-deep)}
.tag.new{background:var(--warn-soft);color:var(--warn)}

/* dashboard */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi span{display:block;font-size:13px;color:var(--ink-3);font-weight:600}
.kpi b{display:block;font:800 30px/1.1 var(--display);margin-top:4px}
.kpi small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.kpi.hero{grid-column:1/-1}
.kpi.hero b{font-size:44px}
.bars{display:grid;gap:10px;padding:14px}
.bar{display:grid;grid-template-columns:110px 1fr 62px;align-items:center;gap:10px;font-size:14px}
.bar .lab{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:14px;background:var(--track);border-radius:0 4px 4px 0;position:relative}
.bar .fill{height:100%;background:var(--series);border-radius:0 4px 4px 0;min-width:2px}
.bar .val{text-align:right;font-weight:700}
.bar:hover .fill{filter:brightness(1.12)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line)}
.tbl td.r,.tbl th.r{text-align:right}
.tblwrap{overflow-x:auto}

/* login */
.login{max-width:440px;margin:0 auto;padding:40px 16px}
.login h1{font-size:44px;text-transform:uppercase;margin:18px 0 6px}
.login p{color:var(--ink-2);margin-bottom:22px}
.who-pick{display:grid;gap:10px}
.who-pick button{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:left}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 18px var(--display);background:var(--mint-soft);color:var(--mint-deep);flex:none}
.demo{margin-top:22px;font-size:13px;color:var(--ink-3)}
.busy{font:700 12px var(--body);color:var(--mint-deep);background:var(--mint-soft);padding:4px 8px;border-radius:99px;margin-right:6px}

.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:60;background:var(--ink);color:var(--card);padding:12px 16px;border-radius:12px;font-weight:600;font-size:14.5px;opacity:0;pointer-events:none;transition:all .2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:700px){ .tiles{grid-template-columns:repeat(4,1fr)} .kpis{grid-template-columns:repeat(3,1fr)} .kpi.hero{grid-column:span 3} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
/* =====================================================================
   WELLBE TEAM APP. Live: reads and writes the Operations + Client Portal
   sheets through the Wellbe W40 Backend (App.gs). Rules mirror the CRM: Done / Late Cancel / No Show deduct a
   pass, Early Cancel does not; 1:3 is counted per client attendance.
   ===================================================================== */
(function(){
var $=function(s,r){return (r||document).querySelector(s)}, $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return '$'+Math.round(n).toLocaleString('en-US')}
function pad(n){return (n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function dayLabel(s){var d=new Date(s+'T12:00:00');return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
function dayLong(s){var d=new Date(s+'T12:00:00');return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}
function hl(t){var h=+t.split(':')[0],m=t.split(':')[1];return (h%12||12)+':'+m+(h<12?' AM':' PM')}
function first(n){return n.split(' ')[0]}
function wa(phone,msg){return 'https://wa.me/'+phone.replace(/\D/g,'').replace(/^0/,'961')+'?text='+encodeURIComponent(msg)}
var ICON=function(id,cls){return '<svg class="'+(cls||'icon')+'"><use href="#'+id+'"/></svg>'};

/* ---------------- live data ---------------- */
var API='https://script.google.com/macros/s/AKfycbxrCVPkY-h2xqTqeHhhaChdaSAf1KbEsJ_HbRSP-oyg4r-qgF-sgSJtFZ0D0uyhDiOS/exec';
var TODAY=new Date(); TODAY.setHours(12,0,0,0); var T=ymd(TODAY);
var KEY=null, LOADED=false, LOAD_ERR='', BUSY=0;
var PKG_TYPES=[], CLIENTS=[], PKGS=[], SESS=[], LEADS=[], RECURRING=[], EXPENSES=[], POS=[], INVENTORY=[], PATTERNS=[];
var REM={}; try{REM=JSON.parse(localStorage.getItem('wb_rem')||'{}')}catch(e){REM={}}
function saveRem(){try{localStorage.setItem('wb_rem',JSON.stringify(REM))}catch(e){}}
var monday=addDays(TODAY,-((TODAY.getDay()+6)%7));
// current package: the oldest Active one with passes left, else the latest one
function pkgOf(cid){var l=PKGS.filter(function(p){return p.client===cid});if(!l.length)return null;var a=l.filter(function(p){return p.status==='Active'&&p.total-p.used>0});
  var srt=function(x){return x.slice().sort(function(m,n){return (m.start||'')<(n.start||'')?-1:1})};return a.length?srt(a)[0]:srt(l)[l.length-1]}
// renewal: monthly training packages not already on 3+ months get the 3 / 6 month offer
function offerOf(p){var m=/(\d+)x\/month \(\$(\d+)/.exec(p.type);if(!m||(p.months||1)>=3)return null;var mo=+m[2];
 var t3=mo*3,p3=Math.round(t3*0.93),t6=mo*6,p6=Math.round(t6*0.85);return {mo:mo,t3:t3,p3:p3,t6:t6,p6:p6,half:Math.round(p6/2)}}
function renewMsg(p){var left=p.total-p.used,o=offerOf(p),pk=p.type.split(' (')[0];
 var head='Hi '+first(p.name)+', this is Romy from Wellbe. You '+(left===0?'just finished':'have 1 session left on')+' your '+pk+' package.';
 if(!o)return head+' Want me to renew it so you keep your spot?';
 return head+' Before you renew, two ways to save:\n\n3 months: $'+o.p3+' instead of $'+o.t3+' (7% off), one payment.\n6 months: $'+o.p6+' instead of $'+o.t6+' (15% off), paid in 2: $'+o.half+' now and $'+(o.p6-o.half)+' on day 1 of month 3.\n\nSame spot, same coach. Which one works for you?'}
function lateRule(p){ if(!p||!p.price) return null; if(p.status&&p.status!=='Active') return null; var due=Math.round((p.price-p.paid)*100)/100; if(due<=0) return null; var limit=p.total>=12?3:(p.total>=8?2:1); return {due:due, late:p.used>=limit, limit:limit} }
var ROOMS={'1:1':'Training Room','1:2':'Training Room','1:3':'Training Room','Madero':'Madero Room','Prehab':'Physio Room','Physio':'Physio Room','Osteo':'Osteo Room'};
function endT(t){var h=+t.split(':')[0]+1;return pad(h)+':'+t.split(':')[1]}

/* ---------------- server ---------------- */
function api(action,data){data=data||{};data.action=action;data.key=KEY;
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)})
   .then(function(r){return r.json()}).then(function(j){if(!j.ok)throw new Error(j.error||'Server error');return j})}
// write with a busy dot; on failure the screen reloads from the sheet so nothing lies
function save(action,data,okMsg,reload){BUSY++;paintBusy();
  return api(action,data).then(function(j){BUSY--;paintBusy();if(okMsg)toast(okMsg);if(reload)boot(true);return j})
   .catch(function(e){BUSY--;paintBusy();toast('Not saved: '+e.message);boot(true);throw e})}
function paintBusy(){var b=$('#busy');if(b)b.hidden=!BUSY}
// the last answer is kept on this phone: the app opens instantly from it, then refreshes in the background
var HIST=null, HIST_LOADING=false, CACHE_KEY='wb_cache_'+(String(store('wb_key')||'').slice(0,8));
function applyBoot(d){
    TODAY=new Date(d.today+'T12:00:00');T=d.today;monday=addDays(TODAY,-((TODAY.getDay()+6)%7));
    var keepView=ME&&ME.id===d.me.id; ME=d.me; if(!keepView)VIEW=ME.role==='owner'?'mine':'home';
    PKG_TYPES=d.types;CLIENTS=d.clients;PKGS=d.pkgs;LEADS=d.leads;RECURRING=d.recurring;EXPENSES=d.expenses;POS=d.pos;INVENTORY=d.inventory;
    SESS=d.sessions.concat(HIST||[]);SESS.forEach(function(s){s.clients.forEach(function(c){c.reminded=!!REM[s.date+'|'+s.id+'|'+c.pkg]})});
    INTAKES=d.intakes||[];FILES=d.files||[];REQUESTS=d.requests||[];PATTERNS=buildPatterns();LOADED=true;LOAD_ERR='';}
// older sessions (more than 70 days back) only load when the owner opens the numbers
function loadHistory(){if(HIST||HIST_LOADING||!ME||ME.role!=='owner')return;HIST_LOADING=true;
  api('app_history').then(function(h){HIST=h.sessions||[];SESS=SESS.concat(HIST);HIST_LOADING=false;render()}).catch(function(){HIST_LOADING=false})}
function boot(silent){
  if(!silent){LOADED=false;LOAD_ERR='';render()}
  return api('app_boot').then(function(d){
    applyBoot(d);render();
    try{CACHE_KEY='wb_cache_'+String(KEY).slice(0,8);localStorage.setItem(CACHE_KEY,JSON.stringify(d))}catch(e){}
  }).catch(function(e){if(e.message==='auth'){try{localStorage.removeItem(CACHE_KEY)}catch(x){}KEY=null;store('wb_key','');LOADED=false}LOAD_ERR=e.message;if(!LOADED||e.message==='auth')render();else toast('Could not refresh: '+e.message)})}
// weekly pattern from the last 60 days: a slot that ran in 3+ different weeks, with the clients who came at least half the time
function buildPatterns(){
  var from=ymd(addDays(TODAY,-60)),slots={};
  var team={Joe:1,Mikel:1,Melanie:1,Majd:1,Jad:1};
  SESS.forEach(function(s){if(s.date<from||s.date>=T||s.status==='Cancelled'||!team[s.trainer])return;var dow=new Date(s.date+'T12:00:00').getDay();if(!dow)return;
    var k=s.tab+'|'+s.trainer+'|'+dow+'|'+s.start,x=slots[k]=slots[k]||{tab:s.tab,trainer:s.trainer,dow:dow,time:s.start,weeks:{},n:0,who:{}};
    var wk=ymd(addDays(new Date(s.date+'T12:00:00'),-((dow+6)%7)));if(x.weeks[wk])return;x.weeks[wk]=1;x.n++;
    s.clients.forEach(function(c){if(c.cid)x.who[c.cid]=(x.who[c.cid]||0)+1})});
  return Object.keys(slots).map(function(k){return slots[k]}).filter(function(x){return x.n>=3}).map(function(x){
    return {tab:x.tab,trainer:x.trainer,dow:x.dow,time:x.time,clients:Object.keys(x.who).filter(function(c){return x.who[c]>=Math.max(2,x.n/2)})}}).filter(function(p){return p.clients.length})}

/* ---------------- rules ---------------- */
var RATES={Majd:{fixed:true},Mikel:{tier:true,base:50},Joe:{tier:true,base:0},Melanie:{flatCut:4},Jad:{fixed:true}};
// per session pay for fixed-rate people: Majd $20 training, $38 physio direct / $28 insurance, $38 prehab; Jad $140 osteo
function fixedPay(s){if(s.trainer==='Jad')return 140;if(s.trainer!=='Majd')return 0;if(s.tab==='Prehab')return 38;if(s.tab==='Physio')return /insur/i.test(s.pay||'')?28:38;return 20}
// Melanie's own clients pay her; the center only gets $4 per pass (paid upfront by Melanie). Madero is 100% Melanie's.
function isMel(cid){var c=clientById(cid);return !!(c&&c.mel)}
function melOwes(p){return false}   // Melanie pays her $4/pass upfront: nothing to chase from her
function centerValue(s,c){if(s.tab==='Madero')return 0;if(isMel(c.cid))return 4;var p=pkgById(c.pkg);return p&&p.total?p.price/p.total:0}
function delivered(s){return s.clients.some(function(c){return deducts(c.att||(s.date<=T?'Present':''))})}
function tier(n){return n<40?7:(n<80?9:10.5)}
function deducts(att){return att==='Present'||att==='Late Cancel'||att==='No Show'}
function cancelKind(s){ // Early = cancelled before the day of the session
  return s.date>T?'Early Cancel':'Late Cancel'}
function joeLoad(date,start){var n=0;SESS.forEach(function(s){if(s.date===date&&s.start===start&&s.trainer==='Joe'&&s.status!=='Cancelled')n+=s.clients.filter(function(c){return c.att!=='Early Cancel'}).length});return n}

/* ---------------- state + shell ---------------- */
var ME=null, VIEW='home', DAY=T, UI={week:'next', q:'', month:0};
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var NAV={
 assistant:[['home','Today','i-home'],['schedule','Schedule','i-cal'],['clients','Clients','i-users'],['money','Money','i-cash'],['more','More','i-more']],
 trainer:[['home','Today','i-home'],['week','My week','i-cal'],['myclients','Clients','i-users'],['me','Me','i-user']],
 owner:[['mine','My day','i-user'],['schedule','Schedule','i-cal'],['clients','Clients','i-users'],['numbers','Numbers','i-chart'],['more','More','i-more']]};
function badgeFor(v){ if(v==='home'&&ME.role!=='trainer'){var n=overdue().length;return n?n:''} return '' }

function render(){
  var app=$('#app');
  if(!KEY){app.innerHTML=loginView();return}
  if(!LOADED){app.innerHTML='<div class="login"><div class="logo" style="width:54px;height:54px;font-size:26px">W</div>'+(LOAD_ERR?'<h1>Could not load</h1><p>'+esc(LOAD_ERR)+'</p><button class="btn" id="retry">Try again</button>':'<h1>Loading</h1><p>Reading the schedule from the sheets.</p>')+'</div>';if($('#retry'))$('#retry').onclick=function(){boot()};return}
  var roleName={owner:'Owner',assistant:'Assistant',trainer:'Trainer'}[ME.role];
  app.innerHTML='<header class="top"><div class="in"><div class="logo">W</div><div class="who"><b>'+esc(ME.name)+'</b><span>Wellbe Health Center</span></div><span class="rolechip">'+roleName+'</span>'+
    '<span class="busy" id="busy" hidden title="Saving">Saving</span><button class="iconbtn" id="refreshBtn" aria-label="Refresh from the sheets" title="Refresh">'+ICON('i-repeat')+'</button></div></header>'+
    (ME.role!=='trainer'?'<button class="fab" id="fab" aria-label="New">'+ICON('i-plus')+'</button>':'')+'<main id="main"></main><nav class="tabs" aria-label="Main"><div class="in">'+NAV[ME.role].map(function(n){var b=badgeFor(n[0]);return '<button class="tab" data-nav="'+n[0]+'" '+(VIEW===n[0]?'aria-current="page"':'')+'>'+ICON(n[2])+n[1]+(b?'<span class="badge">'+b+'</span>':'')+'</button>'}).join('')+'</div></nav>';
  $('#refreshBtn').onclick=function(){HIST=null;if(SESS)SESS=SESS.filter(function(x){return x.date>=ymd(addDays(TODAY,-70))});boot(true);toast('Refreshing')};paintBusy();
  if($('#fab')) $('#fab').onclick=ACTIONS.newMenu;
  $$('[data-nav]').forEach(function(b){b.onclick=function(){closeSheet();VIEW=b.dataset.nav;render();scrollTo(0,0)}});
  var fn=VIEWS[VIEW]||VIEWS.home; $('#main').innerHTML=fn(); bindView(); if(VIEW==='numbers')bindNumbers();
}
function loginView(){
  return '<div class="login"><div class="logo" style="width:54px;height:54px;font-size:26px">W</div><h1>Wellbe Team</h1><p>Open the private link Majd sent you on WhatsApp. It signs you in on this phone, once.</p>'+
   '<p class="demo">Lost your link or changed phone? Ask Majd for a new one. On iPhone: open your link in Safari first, wait for it to load, then Share, Add to Home Screen.</p></div>';
}

/* ---------------- shared pieces ---------------- */
function overdue(){var out=[];PKGS.forEach(function(p){var r=lateRule(p);if(r&&r.late)out.push({p:p,due:r.due,limit:r.limit})});return out}
function dueSoon(){var out=[];PKGS.forEach(function(p){var r=lateRule(p);if(r&&!r.late)out.push({p:p,due:r.due,limit:r.limit})});return out}
function clientById(id){return CLIENTS.filter(function(c){return c.id===id})[0]}
function pkgById(id){return PKGS.filter(function(p){return p.id===id})[0]}
function sessOn(date,trainer){return SESS.filter(function(s){return s.date===date&&(!trainer||s.trainer===trainer)}).sort(function(a,b){return a.start<b.start?-1:1})}
function clientBadges(c,showMoney){
  var p=pkgById(c.pkg)||pkgOf(c.cid), out='';
  if(p){var left=p.total-p.used; out+='<span class="pill '+(left<=1?'p-warn':'p-mute')+'">'+left+' of '+p.total+' left</span>';
    var r=lateRule(p); if(r) out+='<span class="pill '+(r.late?'p-bad':'p-warn')+'">'+ICON('i-cash')+(r.late?'Payment due '+money(r.due):'Pays '+money(r.due)+' by session '+r.limit)+'</span>'}
  var cl=clientById(c.cid); if(cl&&cl.notes) out+='<span class="pill p-warn" title="'+esc(cl.notes)+'">'+ICON('i-heart')+esc(cl.notes)+'</span>'; if(c.note) out+='<span class="pill p-mute">'+ICON('i-edit')+esc(c.note)+'</span>';
  return out;
}
function sessCard(s,opts){
  opts=opts||{};
  var head='<div class="hd"><span class="time">'+hl(s.start).replace(' AM','').replace(' PM','')+'<br><span style="font:600 11px var(--body);color:var(--ink-3)">'+(+s.start.split(':')[0]<12?'AM':'PM')+'</span></span><div class="main"><b>'+s.tab+(s.tab==='1:1'?' personal':(s.tab.indexOf(':')>0?' semi private':''))+' · '+esc(s.trainer)+'</b><span>'+esc(s.room)+' · '+s.id+'</span></div>'+
     (s.status==='Done'?'<span class="pill p-good">'+ICON('i-check')+'Done</span>':s.status==='Cancelled'?'<span class="pill p-mute">Cancelled</span>':'')+
     (opts.change?'<button class="btn sec sm" data-change="'+s.id+'">Change</button>':'')+'</div>';
  var body=s.clients.map(function(c,i){
    var row='<div class="cl"><div class="main"><b>'+esc(c.name)+'</b><div class="meta">'+clientBadges(c)+(c.att&&c.att!=='Present'?'<span class="pill p-bad">'+c.att+'</span>':'')+'</div></div>'+(opts.notes?'<button class="btn sec sm" data-note="'+s.id+'|'+i+'" aria-label="Notes for '+esc(c.name)+'">'+ICON('i-edit')+'Notes</button>':'')+'</div>';
    if(opts.attendance&&s.status!=='Cancelled'){
      var a=c.att||'Present';
      row+='<div class="att" role="group" aria-label="Attendance for '+esc(c.name)+'">'+[['Present','a-present'],['Late Cancel','a-late'],['No Show','a-noshow'],['Early Cancel','a-early']].map(function(x){return '<button class="'+x[1]+'" aria-pressed="'+(a===x[0])+'" data-att="'+s.id+'|'+i+'|'+x[0]+'">'+x[0].replace(' Cancel',' cancel')+'</button>'}).join('')+'</div>';
    }
    return row}).join('');
  return '<div class="sess">'+head+body+'</div>';
}

/* ---------------- views ---------------- */
var VIEWS={};
VIEWS.home=function(){
  if(ME.role==='trainer') return trainerToday();
  var tomorrowS=sessOn(ymd(nextWorkday())).reduce(function(n,s){return n+s.clients.filter(function(c){return !c.reminded}).length},0);
  var od=overdue().length, today=sessOn(T), todo=todoItems();
  return '<div class="h"><h2>Good '+(new Date().getHours()<12?'morning':'afternoon')+', '+esc(first(ME.name))+'</h2><small>'+dayLong(T)+'</small></div>'+
   '<div class="quick">'+
   qbtn('change','i-swap','Change','')+qbtn('pay','i-cash','Payments',od)+qbtn('week','i-cal','Next week','')+qbtn('remind','i-bell','Reminders',tomorrowS)+'</div>'+
   '<div class="h"><h2>To do</h2><small>'+(todo.length?todo.length+' left':'All clear')+'</small></div>'+
   (todo.length?'<div class="list">'+todo.map(todoRow).join('')+'</div>':'<div class="empty">'+ICON('i-check')+' Nothing waiting. Enjoy the quiet.</div>')+
   '<div class="h"><h2>Today</h2><small>'+today.length+' sessions</small></div><div class="list">'+(today.length?today.map(function(s){return sessCard(s,{change:true})}).join(''):'<div class="empty">No sessions today.</div>')+'</div>';
};
function qbtn(act,ic,t,count){return '<button class="qb" data-act="'+act+'"><span class="ic">'+ICON(ic)+(count?'<span class="dot num">'+count+'</span>':'')+'</span>'+t+'</button>'}
var DONE_TODO={};
function todoItems(){
  var items=[];
  (typeof REQUESTS!=='undefined'?REQUESTS:[]).forEach(function(q){var m=REQ_META[q.type]||['i-bell','mute'];items.push({id:'req-'+q.id,level:m[1],icon:m[0],title:esc(q.client)+' · '+esc(q.type),sub:esc(q.slot?q.slot+' · ':'')+esc(q.details).slice(0,120),btn:'Open',act:'req|'+q.id})});
  LEADS.filter(function(l){return l.status!=='Confirmed'}).forEach(function(l){items.push({id:'lead-'+l.id,level:l.date?'warn':'bad',icon:'i-users',title:esc(l.name)+(l.date?' booked a free trial':' left without booking'),sub:l.date?dayLabel(l.date)+' · '+l.time+' · '+l.type:'Call her to find a time',btn:l.date?'Confirm':'Call',act:'lead|'+l.id})});
  overdue().forEach(function(x){var m=melOwes(x.p);items.push({id:'pay-'+x.p.id,level:'bad',icon:'i-cash',title:m?'Melanie owes '+money(x.due)+' · '+esc(x.p.name):esc(x.p.name)+' owes '+money(x.due),sub:m?'Center share $4 x '+x.p.total+' passes, paid upfront':'Session '+x.p.used+' of '+x.p.total+' · late',btn:m?'Record':'Remind',act:(m?'paid|':'pay|')+x.p.id})});

  var up=SESS.filter(function(s){return s.date>=T&&s.status!=='Cancelled'}).sort(function(a,b){return (a.date+a.start)<(b.date+b.start)?-1:1}).slice(0,30);
  openSheet('Change a session','<div class="searchwrap">'+ICON('i-search')+'<input class="search" id="cq" type="search" placeholder="Client name" aria-label="Find a session by client"></div><div class="list" id="clist">'+up.map(function(s){return '<button class="row" data-pick="'+s.id+'"><span class="time" style="font-size:16px;min-width:64px">'+(s.date===T?'Today':dayLabel(s.date).split(' ').slice(0,2).join(' '))+'<br>'+hl(s.start)+'</span><div class="main"><b>'+s.clients.map(function(c){return esc(first(c.name))}).join(', ')+'</b><span>'+s.tab+' · '+esc(s.trainer)+'</span></div></button>'}).join('')+'</div>');
  $('#cq').oninput=function(){var v=this.value.toLowerCase();$$('#clist [data-pick]').forEach(function(r){r.hidden=r.textContent.toLowerCase().indexOf(v)<0})};
  $$('[data-pick]').forEach(function(b){b.onclick=function(){changeSession(b.dataset.pick)}});
};
function changeSession(id){
  var s=SESS.filter(function(x){return x.id===id})[0]; var kind=cancelKind(s);
  var body='<div class="card" style="padding:12px 14px;margin-bottom:14px"><b>'+dayLong(s.date)+' · '+hl(s.start)+'</b><div class="muted" style="font-size:14px">'+s.tab+' with '+esc(s.trainer)+' · '+s.clients.map(function(c){return esc(c.name)}).join(', ')+'</div></div>'+
   (s.clients.length>1?'<div class="field"><span class="flabel">Who?</span><div class="seg" id="who">'+s.clients.map(function(c,i){return '<button aria-pressed="'+(i===0)+'" data-i="'+i+'">'+esc(first(c.name))+'</button>'}).join('')+'<button data-i="all" aria-pressed="false">Whole session</button></div></div>':'')+
   '<div class="field"><span class="flabel">What happened?</span><div class="seg" id="what"><button aria-pressed="true" data-w="move">Reschedule</button><button aria-pressed="false" data-w="cancel">Cancel</button><button aria-pressed="false" data-w="trainer">Change trainer</button></div></div>'+
   '<div id="whatBody"></div>';
  openSheet('Change session',body,'<button class="btn full" id="doChange">Save change</button>');
  var who=0, what='move';
  $$('#who button').forEach(function(b){b.onclick=function(){$$('#who button').forEach(function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true');who=b.dataset.i==='all'?'all':+b.dataset.i}});
  function paint(){
    var h='';
    if(what==='move'){h='<div class="two"><div class="field"><label for="nd">New day</label><input id="nd" type="date" value="'+s.date+'" min="'+T+'"></div><div class="field"><label for="nt">New time</label><input id="nt" type="time" value="'+s.start+'" step="1800"></div></div><div id="cap"></div><div class="note good">'+ICON('i-check')+'<span>A reschedule never costs a pass.</span></div>'}
    if(what==='cancel'){h='<div class="note '+(kind==='Early Cancel'?'good':'bad')+'">'+ICON('i-alert')+'<span>Cancelled '+(kind==='Early Cancel'?'a day or more before':'on the day')+': counts as <b>'+kind+'</b>'+(kind==='Early Cancel'?' (pass kept).':' (1 pass used).')+'</span></div>'+
      (kind==='Late Cancel'?'<label style="display:flex;gap:10px;align-items:center;margin:12px 0;font-weight:600"><input type="checkbox" id="exc" style="width:22px;height:22px"> Make an exception: count as Early cancel</label><div class="field" id="excWhy" hidden><label for="why">Reason (required)</label><input id="why" type="text" placeholder="e.g. sick, urgent at work"></div>':'')}
    if(what==='trainer'){h='<div class="field"><label for="ntr">New trainer</label><select id="ntr">'+['Joe','Mikel','Melanie','Majd'].map(function(t){return '<option'+(t===s.trainer?' selected':'')+'>'+t+'</option>'}).join('')+'</select></div>';if(['1:1','1:2','1:3'].indexOf(s.tab)<0)h='<div class="note warn">'+ICON('i-alert')+'<span>'+s.tab+' always runs with '+esc(s.trainer)+'.</span></div>'}
    $('#whatBody').innerHTML=h;
    var exc=$('#exc'); if(exc) exc.onchange=function(){$('#excWhy').hidden=!exc.checked};
    var check=function(){var nd=$('#nd'),nt=$('#nt');if(!nd)return;var n=joeLoad(nd.value,nt.value)+(s.trainer==='Joe'?1:0);$('#cap').innerHTML=(s.trainer==='Joe'&&n>3)?'<div class="note bad" style="margin-bottom:10px">'+ICON('i-alert')+'<span>Joe would have '+n+' clients at that hour. Max is 3.</span></div>':''};
    if($('#nd')){$('#nd').onchange=check;$('#nt').onchange=check;check()}
  }
  $$('#what button').forEach(function(b){b.onclick=function(){$$('#what button').forEach(function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true');what=b.dataset.w;paint()}});
  paint();
  $('#doChange').onclick=function(){
    var targets=who==='all'?s.clients:[s.clients[who]], msg='';
    var req={ref:s.ref,id:s.id,who:who==='all'?'all':s.clients[who].slot,what:what};
    if(what==='cancel'){var k=kind;if($('#exc')&&$('#exc').checked){if(!$('#why').value.trim()){toast('Add the reason for the exception');return}k='Early Cancel';req.reason=$('#why').value.trim()}
      req.kind=k;targets.forEach(function(c){c.att=k}); if(who==='all') s.status='Cancelled';
      msg='Hi '+first(targets[0].name)+', your session on '+dayLabel(s.date)+' at '+hl(s.start)+' is cancelled. '+(k==='Early Cancel'?'No pass was used.':'As it was cancelled on the day, it counts as a session.')+' See you next time! Wellbe';}
    if(what==='move'){var nd=$('#nd').value,nt=$('#nt').value;if(!nd||!nt){toast('Pick the new day and time');return}if(s.trainer==='Joe'&&joeLoad(nd,nt)+targets.length>3&&!(nd===s.date&&nt===s.start)){toast('Joe is full at that hour');return}
      req.date=nd;req.time=nt;if(who==='all'){s.date=nd;s.start=nt;s.end=endT(nt)}else{s.clients.splice(who,1)}
      msg='Hi '+first(targets[0].name)+', your session is moved to '+dayLabel(nd)+' at '+hl(nt)+' with '+s.trainer+'. See you then! Wellbe';}
    if(what==='trainer'){s.trainer=$('#ntr').value;req.trainer=s.trainer;msg='Hi '+first(targets[0].name)+', small update: your session on '+dayLabel(s.date)+' at '+hl(s.start)+' will be with '+s.trainer+'. Wellbe'}
    var c=clientById(targets[0].cid)||{phone:''};
    save('app_change',req,null,true);
    openSheet('Saved','<div class="note good" style="margin-bottom:14px">'+ICON('i-check')+'<span>Schedule, passes and calendar updated.</span></div><p class="muted" style="margin-bottom:8px">Message ready for '+esc(targets[0].name)+':</p><div class="card" style="padding:12px 14px;font-size:15px">'+esc(msg)+'</div>',
      '<a class="btn wa full" href="'+wa(c.phone,msg)+'" target="_blank" rel="noopener">'+ICON('i-wa')+'Send on WhatsApp</a><button class="btn sec full" id="doneBtn">Done</button>');
    $('#doneBtn').onclick=function(){closeSheet();render()};
  };
}
ACTIONS.pay=function(){
  var od=overdue();
  openSheet('Payment reminders',(od.length?'<p class="muted" style="margin-bottom:10px">Late = still owing after session 3 (12 pack) or session 2 (8 pack).</p><div class="list">'+od.filter(function(x){return !melOwes(x.p)}).map(function(x){var c=clientById(x.p.client),msg='Hi '+first(x.p.name)+', a friendly reminder that '+money(x.due)+' is still due for your '+x.p.type.split(' (')[0]+' package. You can pay cash, Whish or Neo at your next session. Thank you! Wellbe';
    return '<div class="card" style="padding:12px 14px"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>'+esc(x.p.name)+'</b><div class="muted" style="font-size:13.5px">'+esc(x.p.type)+' · session '+x.p.used+' of '+x.p.total+'</div></div><b class="num" style="color:var(--bad)">'+money(x.due)+'</b></div><div class="two" style="margin-top:10px"><a class="btn wa sm" href="'+wa(c.phone,msg)+'" target="_blank" rel="noopener">'+ICON('i-wa')+'Remind</a><button class="btn sec sm" data-paid="'+x.p.id+'">Record payment</button></div></div>'}).join('')+'</div>':'<div class="empty">Nobody is late.</div>'));
  $$('[data-paid]').forEach(function(b){b.onclick=function(){paySheet(b.dataset.paid)}});
};
function paySheet(pid){
  var p=pkgById(pid),r=lateRule(p)||{due:0};
  openSheet('Record payment','<div class="kv" style="margin-bottom:14px"><dt>Client</dt><dd>'+esc(p.name)+'</dd><dt>Package</dt><dd>'+esc(p.type)+'</dd><dt>Price</dt><dd class="num">'+money(p.price)+'</dd><dt>Paid so far</dt><dd class="num">'+money(p.paid)+'</dd><dt>Still due</dt><dd class="num" style="color:var(--bad)">'+money(r.due)+'</dd></dl>'.replace('</dl>','</div>')+
    '<div class="field"><label for="amt">Amount received ($)</label><input id="amt" type="number" inputmode="decimal" value="'+r.due+'" min="1"></div><div class="field"><span class="flabel">Paid by</span><div class="seg" id="meth"><button aria-pressed="true">Cash</button><button aria-pressed="false">Whish</button><button aria-pressed="false">Neo</button></div></div>',
    '<button class="btn ok full" id="savePay">'+ICON('i-check')+'Save payment</button>');
  $$('#meth button').forEach(function(b){b.onclick=function(){$$('#meth button').forEach(function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true')}});
  $('#savePay').onclick=function(){var a=+$('#amt').value;if(!(a>0)){toast('Enter an amount');return}var m=($('#meth [aria-pressed="true"]')||{}).textContent||'Cash';p.paid=p.paid+a;closeSheet();render();save('app_pay',{pkg:p.id,amount:a,method:m},money(a)+' recorded for '+p.name)};
}
ACTIONS.remind=function(){
  var d=ymd(nextWorkday()), list=sessOn(d);
  var body='<p class="muted" style="margin-bottom:10px">'+dayLong(d)+'. Tap each name: WhatsApp opens with the message ready, you press send.</p><div class="list">'+list.map(function(s){return s.clients.map(function(c,i){var cl=clientById(c.cid),msg='Hi '+first(c.name)+', a reminder of your session tomorrow '+dayLabel(d)+' at '+hl(s.start)+' with '+s.trainer+' at Wellbe. Bring a towel and water. See you!';
    return '<a class="row" href="'+wa(cl.phone,msg)+'" target="_blank" rel="noopener" data-rem="'+s.id+'|'+i+'" style="text-decoration:none"><span class="time" style="font-size:16px">'+hl(s.start)+'</span><div class="main"><b>'+esc(c.name)+'</b><span>'+s.tab+' · '+esc(s.trainer)+'</span></div>'+(c.reminded?'<span class="pill p-good">'+ICON('i-check')+'Sent</span>':'<span class="pill p-mute" style="color:var(--wa)">'+ICON('i-wa')+'Send</span>')+'</a>'}).join('')}).join('')+'</div>';
  openSheet('Session reminders',list.length?body:'<div class="empty">No sessions tomorrow.</div>');
  $$('[data-rem]').forEach(function(a){a.addEventListener('click',function(){var x=a.dataset.rem.split('|'),s=SESS.filter(function(y){return y.id===x[0]})[0];var cc=s.clients[+x[1]];cc.reminded=true;REM[s.date+'|'+s.id+'|'+cc.pkg]=1;saveRem();setTimeout(function(){ACTIONS.remind();render()},300)})});
};
ACTIONS.week=function(){
  // next week built from the weekly pattern of the last 60 days
  var nm=addDays(monday,7), days=[];
  for(var d=0;d<6;d++)days.push(ymd(addDays(nm,d)));
  var n=0,draft=[]; days.forEach(function(dd,i){PATTERNS.forEach(function(p){if(p.dow!==i+1)return;
    var cl=p.clients.map(function(cid){var c=clientById(cid),k=pkgOf(cid);return c&&k&&k.status==='Active'?{cid:cid,name:c.name,pkg:k.id}:null}).filter(Boolean)
      .filter(function(c){return !SESS.some(function(x){return x.date===dd&&x.start===p.time&&x.clients.some(function(y){return y.pkg===c.pkg})})});
    if(cl.length)draft.push({id:'D'+(n++),tab:p.tab,date:dd,start:p.time,trainer:p.trainer,clients:cl})})});
  var exists=SESS.some(function(s){return s.date>=days[0]&&s.date<=days[5]});
  var body='<div class="note good" style="margin-bottom:12px">'+ICON('i-check')+'<span>Built from what happened every week over the last 60 days, only clients with an active package. Remove anything that changed, then confirm. Clients already booked are left out.</span></div>'+
   (exists?'<div class="note warn" style="margin-bottom:12px">'+ICON('i-alert')+'<span>Next week already has sessions. Confirming adds only the missing ones.</span></div>':'')+(draft.length?'':'<div class="empty">Nothing to add: everyone with a weekly slot is already booked.</div>')+
   '<div class="week">'+days.map(function(dd){var m=draft.filter(function(s){return s.date===dd});return '<div class="day"><h3>'+dayLabel(dd)+'<small>'+m.length+' sessions</small></h3>'+m.map(function(s){return '<div class="slot"><span class="t">'+hl(s.start).replace(':00','')+'</span><div class="main"><b>'+s.tab+' · '+esc(s.trainer)+'</b><br>'+s.clients.map(function(c){return esc(c.name)}).join(', ')+'</div><button class="iconbtn" aria-label="Remove" data-rm="'+s.id+'">'+ICON('i-x')+'</button></div>'}).join('')+'</div>'}).join('')+'</div>';
  openSheet('Next week',body,'<button class="btn full" id="confirmWeek">Confirm '+draft.length+' sessions</button>');
  $$('[data-rm]').forEach(function(b){b.onclick=function(){draft=draft.filter(function(s){return s.id!==b.dataset.rm});b.closest('.slot').remove();$('#confirmWeek').textContent='Confirm '+draft.length+' sessions'}});
  $('#confirmWeek').onclick=function(){if(!draft.length){closeSheet();return}closeSheet();toast('Adding next week…');
    save('app_week',{items:draft.map(function(s){return {type:s.tab,date:s.date,time:s.start,trainer:s.trainer,clients:s.clients.map(function(c){return {pkg:c.pkg,name:c.name}})}})},null,true)
     .then(function(j){toast(j.added+' bookings added'+(j.skipped.length?' · '+j.skipped.length+' skipped (Joe full or no package)':''))})};
};
// discount + freeze, inside the client sheet
function staffClientTools(c){
  var open=PKGS.filter(function(p){return p.client===c.id&&p.status==='Active'&&(p.total-p.used>0||(p.expiry&&p.expiry>=T))}).sort(function(a,b){return (a.start||'')<(b.start||'')?-1:1});
  return '<div class="card" style="padding:12px 14px;margin-bottom:12px"><div style="display:flex;gap:10px;align-items:flex-end"><div class="field" style="margin:0;flex:1"><label for="cdisc">Client discount %</label><input id="cdisc" type="number" inputmode="decimal" min="0" max="100" value="'+(c.disc||0)+'"></div><button class="btn sec sm" id="saveDisc" style="min-height:48px">Save</button></div><div class="muted" style="font-size:13px;margin-top:6px">Filled in automatically every time you sell this client a package.</div></div>'+
   (open.length?'<span class="flabel">Freeze (1 week per package)</span><div class="list" style="margin:8px 0 14px">'+open.map(function(p){return '<div class="row" style="min-height:54px"><div class="main"><b>'+esc(p.type.split(' (')[0])+'</b><span>Ends '+(p.expiry?dayLabel(p.expiry):'?')+' · '+(p.total-p.used)+' left</span></div>'+(p.frozen?'<span class="pill p-mute">Freeze used</span>':'<button class="btn sec sm" data-frz="'+p.id+'">'+ICON('i-cal')+'Freeze 1 week</button>')+'</div>'}).join('')+'</div>':'');
}
function bindStaffClientTools(c){
  if($('#saveDisc'))$('#saveDisc').onclick=function(){var d=Math.max(0,Math.min(100,+$('#cdisc').value||0));c.disc=d;save('app_disc',{cid:c.id,name:c.name,disc:d},d?first(c.name)+' now gets '+d+'% off':'Discount removed for '+first(c.name));render()};
  $$('[data-frz]').forEach(function(b){b.onclick=function(){var p=pkgById(b.dataset.frz);
    openSheet('Freeze '+first(c.name)+'’s package','<div class="card" style="padding:12px 14px"><b>'+esc(p.type)+'</b><div class="muted" style="font-size:14px">Ends '+(p.expiry?dayLabel(p.expiry):'?')+'</div></div><div class="note good" style="margin-top:12px">'+ICON('i-cal')+'<span>Moves the end date 7 days later. Only once per package.</span></div>'+
     '<div class="two"><div class="field"><label for="fzf">Freeze starts</label><input id="fzf" type="date" value="'+T+'"></div><div class="field"><label for="fzn">Reason</label><input id="fzn" type="text" placeholder="e.g. travel"></div></div>','<button class="btn ok full" id="doFz">'+ICON('i-check')+'Freeze 1 week</button>');
    $('#doFz').onclick=function(){var from=$('#fzf').value,note=$('#fzn').value.trim();p.frozen=1;closeSheet();save('app_freeze',{pkg:p.id,from:from,note:note},null,true).then(function(j){toast('Frozen: '+first(c.name)+' now ends '+dayLabel(j.end))})}}});
}
function clientSheet(id){
  var c=clientById(id);if(!c){toast('Client file not found');return}var p=pkgOf(id),r=p&&lateRule(p),hist=SESS.filter(function(s){return s.clients.some(function(x){return x.cid===id})}).sort(function(a,b){return a.date<b.date?1:-1}).slice(0,6);

   (ME.role!=='trainer'?'<label style="display:flex;gap:10px;align-items:center;margin:0 0 12px;font-weight:600"><input type="checkbox" id="melFlag" style="width:22px;height:22px"'+(c.mel?' checked':'')+'> Melanie\'s own client <span class="muted" style="font-weight:500;font-size:13px">(Melanie pays the center $4/pass)</span></label>':'')+
   (ME.role!=='trainer'?'<button class="btn sec full" id="editCl" style="margin-bottom:12px">'+ICON('i-edit')+'Edit name, phone, email</button>':'')+
   (ME.role!=='trainer'&&!c.email?'<div class="note warn" style="margin-bottom:12px">'+ICON('i-alert')+'<span>No email: '+esc(first(c.name))+' cannot sign in to the client app yet.</span></div>':'')+
   (ME.role!=='trainer'?staffClientTools(c):'')+
   (c.notes?'<div class="note warn" style="margin-bottom:10px">'+ICON('i-heart')+'<span><b>Always show:</b> '+esc(c.notes)+'</span></div>':'')+(c.program?'<div class="notebox"><b>Training program</b>'+esc(c.program)+'</div>':'')+(c.log.length?'<div class="notebox"><b>Session notes</b>'+c.log.slice(0,4).map(function(l){return dayLabel(l.d)+' · '+esc(l.by)+': '+esc(l.t)}).join('<br>')+'</div>':'')+
   (ME.role==='owner'?ownerClientExtras(c):'')+'<span class="flabel">Recent sessions</span><div class="list" style="margin-top:8px">'+hist.map(function(s){var me=s.clients.filter(function(x){return x.cid===id})[0];return '<div class="row" style="min-height:50px"><div class="main"><b>'+dayLabel(s.date)+' · '+hl(s.start)+'</b><span>'+s.tab+' · '+esc(s.trainer)+'</span></div><span class="pill '+(me.att==='Present'?'p-good':me.att?'p-bad':'p-mute')+'">'+(me.att||'Scheduled')+'</span></div>'}).join('')+'</div>',
   ME.role==='trainer'?'<button class="btn ok full" id="editNotes">'+ICON('i-edit')+'Edit notes and program</button>':'<div class="two"><a class="btn wa" href="'+wa(c.phone,'Hi '+first(c.name)+', ')+'" target="_blank" rel="noopener">'+ICON('i-wa')+'WhatsApp</a><button class="btn sec" id="sellTo">Sell package</button></div>');
  if($('#sellTo'))$('#sellTo').onclick=function(){ACTIONS.sell(id)};
  if(ME.role==='owner')bindOwnerExtras(c);
  if(ME.role!=='trainer')bindStaffClientTools(c);
  if($('#editCl'))$('#editCl').onclick=function(){
    openSheet('Edit '+first(c.name),'<div class="field"><label for="ecn">Full name</label><input id="ecn" type="text" value="'+esc(c.name)+'" autocomplete="off"></div><div class="field"><label for="ecp">Phone</label><input id="ecp" type="tel" inputmode="tel" value="'+esc(c.phone)+'"></div><div class="field"><label for="ece">Email <span class="muted" style="font-weight:500">(used to sign in to the client app)</span></label><input id="ece" type="email" inputmode="email" autocomplete="off" value="'+esc(c.email)+'"></div><p class="muted" style="font-size:13px;margin-top:10px">Parents: put the parent\u2019s email on the child\u2019s profile, they will see it from their own sign in.</p>',
     '<button class="btn ok full" id="doEc">'+ICON('i-check')+'Save</button>');
    $('#doEc').onclick=function(){var n=$('#ecn').value.trim(),ph=$('#ecp').value.trim(),em=$('#ece').value.trim().toLowerCase();
      if(!n){toast('Name needed');return}if(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){toast('Check the email');return}
      c.name=n;c.phone=ph;c.email=em;closeSheet();render();save('app_cedit',{cid:c.id,name:n,phone:ph,email:em},'Saved: '+first(n)+(em?' can now sign in with '+em:''))}};
  if($('#melFlag'))$('#melFlag').onchange=function(){c.mel=this.checked;save('app_flag',{cid:c.id,name:c.name,mel:c.mel},c.mel?first(c.name)+' is now Melanie\'s client':first(c.name)+' is a center client again');render()};
  if($('#editNotes'))$('#editNotes').onclick=function(){var s=SESS.filter(function(x){return x.clients.some(function(y){return y.cid===id})}).sort(function(a,b){return a.date<b.date?1:-1}).filter(function(x){return x.date<=T})[0]||SESS.filter(function(x){return x.clients.some(function(y){return y.cid===id})})[0];noteSheet(s.id,s.clients.findIndex(function(y){return y.cid===id}))};
}
ACTIONS.sell=function(cid){
  var months=1;

function prepFile(file){return new Promise(function(res,rej){
  if(file.size>15*1024*1024){rej(new Error(file.name+' is over 15 MB'));return}
  var r=new FileReader();r.onerror=function(){rej(new Error('Could not read '+file.name))};
  if(/^image\//.test(file.type)&&!/gif|svg/.test(file.type)){r.onload=function(){var img=new Image();img.onload=function(){var k=Math.min(1,1600/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      res({name:file.name.replace(/\.\w+$/,'')+'.jpg',mime:'image/jpeg',b64:cv.toDataURL('image/jpeg',0.85).split(',')[1]})};img.onerror=function(){res({name:file.name,mime:file.type,b64:r.result.split(',')[1]})};img.src=r.result};}
  else r.onload=function(){res({name:file.name,mime:file.type||'application/pdf',b64:r.result.split(',')[1]})};
  r.readAsDataURL(file)})}

function payByTrainer(from,to){var out={},d=new Date(from+'T12:00:00');

function stats(R){

  var firstSeen={};SESS.slice().sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(s){if(s.date>T)return;s.clients.forEach(function(c){if(c.cid&&deducts(c.att||'Present')&&!firstSeen[c.cid])firstSeen[c.cid]=s.date})});
  var tot={rev:0,clients:{},newC:{},sold:0,soldN:0},prevC={},att={Present:0,'Late Cancel':0,'No Show':0,'Early Cancel':0},attBy={},byClient={},slot={};

    s.clients.forEach(function(c){var a=c.att||(s.status==='Cancelled'?'Early Cancel':'Present');

      if(!deducts(a))return;var v=centerValue(s,c),b=B[bucketKey(s.date,kind)];
      tot.rev+=v;b.rev+=v;if(c.cid){tot.clients[c.cid]=1;b.clients[c.cid]=1;byClient[c.cid]=(byClient[c.cid]||0)+v;if(firstSeen[c.cid]===s.date||(firstSeen[c.cid]>=R.from&&firstSeen[c.cid]<=R.to)){tot.newC[c.cid]=1;if(bucketKey(firstSeen[c.cid],kind)===bucketKey(s.date,kind))b.newC[c.cid]=1}}});
    if(inR&&s.tab==='1:3'&&s.status!=='Cancelled'){var x=slot[s.start]=slot[s.start]||{seats:0,cap:0,n:0};x.seats+=s.clients.length;x.cap+=3;x.n++}});
  PKGS.forEach(function(p){if(!p.start||p.start<R.from||p.start>R.to||!(p.price>0)||p.kind==='Madero'||isMel(p.client))return;tot.sold+=p.price;tot.soldN++;var b=B[bucketKey(p.start,kind)];if(b){b.sold+=p.price;b.soldN++}});
  var ended=[];PKGS.forEach(function(p){if(!(p.price>0)||p.total<4||!p.expiry)return;var done=p.total-p.used<=0||p.expiry<T;if(!done||p.expiry<R.from||p.expiry>R.to)return;
    var lim=ymd(addDays(new Date(p.expiry+'T12:00:00'),21));ended.push({p:p,renewed:PKGS.some(function(q){return q.id!==p.id&&q.client===p.client&&q.start&&q.start>=p.start&&q.start<=lim})})});
  var retained=Object.keys(prevC).filter(function(c){return tot.clients[c]}).length;
  var lost=R.to===T?Object.keys(prevC).filter(function(c){return !tot.clients[c]&&!SESS.some(function(s){return s.date>=T&&s.clients.some(function(x){return x.cid===c})})}):[];
  return {R:R,P:P,kind:kind,keys:keys,B:B,tot:tot,prevN:Object.keys(prevC).length,retained:retained,lost:lost,att:att,attBy:attBy,byClient:byClient,slot:slot,ended:ended};
}
function analyticsView(){
  var S=stats(),R=S.R,K=S.keys,mx=function(f){return Math.max.apply(null,K.map(function(k){return f(S.B[k])}).concat([1]))};
  var nCur=Object.keys(S.tot.clients).length,arpc=nCur?S.tot.rev/nCur:0,ren=S.ended.length?Math.round(S.ended.filter(function(x){return x.renewed}).length/S.ended.length*100):null;
  var attT=Object.keys(S.att).reduce(function(a,k){return a+S.att[k]},0)||1;
  var top=Object.keys(S.byClient).sort(function(a,b){return S.byClient[b]-S.byClient[a]}).slice(0,8);
  var inL=function(l){var d=parseYmdLoose(l.submitted)||l.date;return !d||(d>=R.from&&d<=R.to)},L=LEADS.filter(inL);
  var booked=L.filter(function(l){return l.date}).length,conf=L.filter(function(l){return l.status==='Confirmed'}).length;
  var paidAfter=L.filter(function(l){var c=CLIENTS.filter(function(x){return x.phone&&l.phone&&x.phone.replace(/\D/g,'').slice(-6)===l.phone.replace(/\D/g,'').slice(-6)})[0];return c&&PKGS.some(function(p){return p.client===c.id&&p.price>0})}).length;
  var expCat={};EXPENSES.filter(function(e){return e.d>=R.from&&e.d<=R.to}).forEach(function(e){expCat[e.cat]=(expCat[e.cat]||0)+e.amt});
  var mxE=Math.max.apply(null,Object.keys(expCat).map(function(k){return expCat[k]}).concat([1]));
  var by=S.kind==='day'?'by day':S.kind==='week'?'by week':'by month';
  var bl=function(k){return S.kind==='week'&&k<R.from?'Week from '+dayLabel(R.from).split(' ').slice(1).join(' '):bucketLabel(k,S.kind)};
  return '<div class="h"><h2>'+esc(R.label)+'</h2><small>'+rangeText(R)+'</small></div>'+
   '<div class="kpis">'+kpi('Delivered revenue',money(S.tot.rev),'Center share of sessions given')+kpi('Active clients',nCur,(nCur>=S.prevN?'+':'')+(nCur-S.prevN)+' vs '+S.P.label)+
     kpi('Kept from before',S.prevN?Math.round(S.retained/S.prevN*100)+'%':'-',S.retained+' of '+S.prevN+' from the '+S.P.label)+kpi('Revenue per client',money(arpc),'In this period')+
     kpi('New clients',Object.keys(S.tot.newC).length,'First ever session in this period')+kpi('Packages sold',money(S.tot.sold),S.tot.soldN+' center packages')+
     kpi('Renewal rate',ren===null?'-':ren+'%','Packages that ended in this period, renewed within 3 weeks')+'</div>'+
   (K.length>1?'<div class="h"><h2>Delivered revenue</h2><small>'+by+'</small></div><div class="card bars">'+K.map(function(k){return bar(bl(k),S.B[k].rev,mx(function(x){return x.rev}),money(S.B[k].rev))}).join('')+'</div>'+
    '<div class="h"><h2>Active clients</h2><small>'+by+'</small></div><div class="card bars">'+K.map(function(k){var n=Object.keys(S.B[k].clients).length;return bar(bl(k),n,mx(function(x){return Object.keys(x.clients).length}),n+(Object.keys(S.B[k].newC).length?' ('+Object.keys(S.B[k].newC).length+' new)':''))}).join('')+'</div>'+
    '<div class="h"><h2>Packages sold</h2><small>'+by+', center only</small></div><div class="card bars">'+K.map(function(k){return bar(bl(k),S.B[k].sold,mx(function(x){return x.sold}),money(S.B[k].sold))}).join('')+'</div>':'')+
   '<div class="h"><h2>Attendance</h2></div><div class="card bars">'+['Present','Late Cancel','No Show','Early Cancel'].map(function(k){return bar(k,S.att[k]||0,attT,Math.round((S.att[k]||0)/attT*100)+'%')}).join('')+'</div>'+
   (Object.keys(S.attBy).length?'<div class="card tblwrap" style="margin-top:10px"><table class="tbl"><thead><tr><th>Trainer</th><th class="r">Client visits</th><th class="r">Late / no show</th></tr></thead><tbody>'+Object.keys(S.attBy).map(function(k){var t=S.attBy[k];return '<tr><td><b>'+esc(k)+'</b></td><td class="r num">'+t.n+'</td><td class="r num">'+Math.round(t.miss/t.n*100)+'%</td></tr>'}).join('')+'</tbody></table></div>':'')+
   (Object.keys(S.slot).length?'<div class="h"><h2>1:3 seats filled</h2><small>By hour</small></div><div class="card bars">'+Object.keys(S.slot).sort().map(function(h){var x=S.slot[h],p=Math.round(x.seats/x.cap*100);return bar(hl(h)+' · '+x.n+' sessions',p,100,p+'%')}).join('')+'</div>':'')+
   '<div class="h"><h2>Trial leads</h2><small>Landing page</small></div><div class="card bars">'+bar('Leads',L.length,L.length||1,L.length)+bar('Booked a time',booked,L.length||1,booked)+bar('Confirmed',conf,L.length||1,conf)+bar('Bought a package',paidAfter,L.length||1,paidAfter)+'</div>'+
   (top.length?'<div class="h"><h2>Top clients</h2><small>Center revenue</small></div><div class="card tblwrap"><table class="tbl"><tbody>'+top.map(function(c){var cl=clientById(c);return '<tr><td>'+esc(cl?cl.name:c)+'</td><td class="r num">'+money(S.byClient[c])+'</td></tr>'}).join('')+'</tbody></table></div>':'')+
   (Object.keys(expCat).length?'<div class="h"><h2>Expenses by category</h2></div><div class="card bars">'+Object.keys(expCat).sort(function(a,b){return expCat[b]-expCat[a]}).map(function(k){return bar(k,expCat[k],mxE,money(expCat[k]))}).join('')+'</div>':'')+
   (S.lost.length?'<div class="h"><h2>Did not come back</h2><small>Came in the '+S.P.label+', nothing since or booked</small></div><div class="list">'+S.lost.slice(0,12).map(function(c){var cl=clientById(c);return cl?'<button class="row" data-client="'+c+'"><div class="main"><b>'+esc(cl.name)+'</b><span>Win back: call or WhatsApp</span></div></button>':''}).join('')+'</div>':'');
}
function parseYmdLoose(s){s=String(s||'');var m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]):''}
function last30(){return {from:ymd(addDays(TODAY,-29)),to:T,label:'Last 30 days'}}
// one decision, ranked by money at stake (always on the last 30 days, whatever period is picked)
function decisions(){
  var S=stats(last30()),out=[],seat=200/12;
  var od=overdue(),late=od.reduce(function(a,b){return a+b.due},0);
  if(late>0)out.push({usd:late,title:'Collect '+money(late)+' already owed',why:od.length+' clients are past their payment session. This is money you earned and have not received, it costs nothing to collect.',act:'pay',btn:'Open payment reminders'});
  var empty=0,worst=null;Object.keys(S.slot).forEach(function(h){var x=S.slot[h],e=x.cap-x.seats;empty+=e;if(!worst||e>worst.e)worst={h:h,e:e,n:x.n}});
  if(empty>0)out.push({usd:empty*seat,title:'Fill the empty 1:3 seats'+(worst?', starting with '+hl(worst.h):''),why:empty+' seats went empty in the last 30 days, about '+money(empty*seat)+' a month at the 12-session price. Empty seats cost you nothing to sell: point the morning W40 ads and a "bring a friend" offer at the emptiest hour.',act:'leads',btn:'See trial leads'});
  var soon=PKGS.filter(function(p){return p.status==='Active'&&p.price>0&&p.total>1&&p.total-p.used<=2&&offerOf(p)});
  if(soon.length)out.push({usd:soon.reduce(function(a,p){var o=offerOf(p);return a+(o?o.p3-o.mo:0)},0),title:'Offer 3 months to '+soon.length+' clients about to finish',why:'Each one moved from monthly to 3 months locks 2 extra months of revenue upfront and removes 2 chances to drop off.',act:'home',btn:'Open the To do list'});
  if(S.lost.length)out.push({usd:S.lost.length*140,title:'Win back '+S.lost.length+' clients who stopped',why:'They trained with you in the 30 days before and have nothing booked now. A personal message from their coach is the cheapest new revenue you have.',act:null});
  var ren=S.ended.length?S.ended.filter(function(x){return x.renewed}).length/S.ended.length:1;
  if(S.ended.length>=4&&ren<0.7)out.push({usd:(0.7-ren)*S.ended.length*170,title:'Renewal rate is '+Math.round(ren*100)+'%',why:'Fewer than 7 in 10 finished packages are renewed. Ask for the renewal at session 6 of 8 or 9 of 12, not after the last one.',act:null});
  return out.sort(function(a,b){return b.usd-a.usd});
}
function advisorView(){
  var d=decisions(),top=d[0];
  return (top?'<div class="card" style="padding:18px"><span class="flabel">Your next move</span><h3 style="font:800 26px/1.1 var(--display);text-transform:uppercase;margin:6px 0 8px">'+esc(top.title)+'</h3><p style="margin-bottom:12px">'+esc(top.why)+'</p><p class="muted" style="font-size:14px;margin-bottom:12px">Money at stake: about <b class="num">'+money(top.usd)+'</b></p>'+(top.act?'<button class="btn full" data-go="'+top.act+'">'+top.btn+'</button>':'')+'</div>':'<div class="empty">Nothing urgent. Ask Claude for growth ideas below.</div>')+
   (d.length>1?'<div class="h"><h2>After that</h2></div><div class="list">'+d.slice(1).map(function(x){return '<div class="row"><div class="main"><b>'+esc(x.title)+'</b><span>About '+money(x.usd)+' at stake</span></div></div>'}).join('')+'</div>':'')+
   '<div class="card" style="padding:16px;margin-top:16px"><b>Ask your marketing advisor</b><p class="muted" style="font-size:14px;margin:6px 0 12px">Sends this month\'s numbers (no client names or health data) to Claude with your consultant brief: challenge me, rank decisions by money, one clear next step.</p><textarea id="askQ" placeholder="Optional: what are you deciding? e.g. raise 1:3 prices or run a new ad?" style="min-height:70px"></textarea><button class="btn full" id="askClaude" style="margin-top:10px">'+ICON('i-chart')+'Ask Claude</button></div>';
}
function askClaude(){
  var y=TODAY.getFullYear(),m=TODAY.getMonth(),S=stats({from:dOf(y,m-5,1),to:T,label:'Last 6 months'}),S30=stats(last30()),monthStart=T.slice(0,8)+'01',by=monthByTrainer(monthStart),d=decisions();
  var lines=['You are my business consultant (Hormozi offers, Neil Patel acquisition, Iman Gadzhi operations). Do not start by agreeing. Challenge my assumptions, give the uncomfortable truth first, rank options by money and speed, end with ONE next decision for this week and a confidence rating. No dashes.',
   '','Business: Wellbe Health Center, Beirut area. Semi-private 1:3 training ($200 for 12 / $140 for 8 per month), 1:2, 1:1, physio, prehab, osteo, Madero. Trial leads come from a Meta ad landing page for women 40+ in the mornings.',
   '','Last 6 months (center delivered revenue | active clients | new | center packages sold):'];
  S.keys.forEach(function(k){var x=S.B[k];lines.push(bucketLabel(k,S.kind)+': '+money(x.rev)+' | '+Object.keys(x.clients).length+' | '+Object.keys(x.newC).length+' | '+money(x.sold))});
  if(UI.range!=='month'){var C=stats();lines.push('','Period I am looking at ('+C.R.label+', '+rangeText(C.R)+'): revenue '+money(C.tot.rev)+', '+Object.keys(C.tot.clients).length+' active clients, '+Object.keys(C.tot.newC).length+' new, packages sold '+money(C.tot.sold)+'.')}
  lines.push('','This month so far: trainer pay '+money(Object.keys(by).reduce(function(a,k){return a+trainerPay(k,by[k])},0))+', expenses '+money(EXPENSES.filter(function(e){return e.d>=monthStart}).reduce(function(a,e){return a+e.amt},0))+'.');
  lines.push('Last 30 days: kept '+S30.retained+' of '+S30.prevN+' clients from the 30 days before. Renewal rate: '+(S30.ended.length?Math.round(S30.ended.filter(function(x){return x.renewed}).length/S30.ended.length*100)+'% of '+S30.ended.length:'n/a')+'.');
  var attT=Object.keys(S30.att).reduce(function(a,k){return a+S30.att[k]},0)||1;lines.push('Attendance 30 days: '+Object.keys(S30.att).map(function(k){return k+' '+Math.round(S30.att[k]/attT*100)+'%'}).join(', ')+'.');
  lines.push('1:3 seat fill by hour (30 days): '+Object.keys(S30.slot).sort().map(function(h){var x=S30.slot[h];return hl(h)+' '+Math.round(x.seats/x.cap*100)+'%'}).join(', ')+'.');
  lines.push('Late payments: '+money(overdue().reduce(function(a,b){return a+b.due},0))+' from '+overdue().length+' clients.');
  lines.push('Trial leads: '+LEADS.length+' total, '+LEADS.filter(function(l){return l.date}).length+' booked, '+LEADS.filter(function(l){return l.status==='Confirmed'}).length+' confirmed.');
  lines.push('Trainers this month: '+Object.keys(by).map(function(k){var t=by[k];return k+' '+t.sessions+' sessions, revenue '+money(t.rev)+', pay '+money(trainerPay(k,t))}).join('; ')+'.');
  if(d.length)lines.push('','The app ranks these first: '+d.slice(0,3).map(function(x){return x.title+' (~'+money(x.usd)+')'}).join('; ')+'.');
  var q=($('#askQ')&&$('#askQ').value.trim())||'What is the single best decision for me this week, and what am I not seeing?';
  lines.push('','My question: '+q);
  var text=lines.join('\n');
  try{navigator.clipboard.writeText(text).catch(function(){})}catch(e){}
  window.open('https://claude.ai/new?q='+encodeURIComponent(text),'_blank');
  toast('Opening Claude. The brief is also copied: paste it if the box is empty.');
}

/* boot */
try{var th=store('wb_theme');if(th&&th!=='system')document.documentElement.setAttribute('data-theme',th)}catch(e){}
// private link: #k=KEY, kept on this phone, then removed from the address bar
// the key stays in the address so "Add to Home Screen" saves it (iPhone home screen apps do not share Safari's storage)
var hk=/[#&]k=([a-f0-9]{16,64})/i.exec(location.hash);if(hk){KEY=hk[1];store('wb_key',KEY)}else{KEY=store('wb_key')||null;if(KEY)history.replaceState(null,'',location.pathname+'#k='+KEY)}
if(KEY){try{var cached=localStorage.getItem('wb_cache_'+String(KEY).slice(0,8));if(cached){applyBoot(JSON.parse(cached))}}catch(e){}}
render();if(KEY)boot(LOADED);
// fresh data when the app comes back to the front, and every 3 minutes while open
document.addEventListener('visibilitychange',function(){if(!document.hidden&&KEY&&LOADED&&!BUSY&&!$('#sheet').classList.contains('on'))boot(true)});
setInterval(function(){if(!document.hidden&&KEY&&LOADED&&!BUSY&&!$('#sheet').classList.contains('on'))boot(true)},180000);
})();
