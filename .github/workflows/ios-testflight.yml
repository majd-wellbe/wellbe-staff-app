name: iOS TestFlight

# Builds the Wellbe client app for iPhone on a cloud Mac and uploads it to TestFlight.
# Run by hand: Actions tab, "iOS TestFlight", Run workflow.
# Needs 3 repo secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (App Store Connect API key).

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      TEAM_ID: 3LNJF23FSP
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Select Xcode 26 (Apple only accepts uploads built with the iOS 26 SDK)
        run: |
          ls /Applications | grep -i xcode
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "No Xcode 26 on this machine"; exit 1; fi
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Install and pack the web app
        working-directory: phase5/mobile
        run: |
          # First builds ship without Health and in-app purchases (nothing purchasable at launch).
          npm pkg delete "dependencies.@capgo/capacitor-health" "dependencies.@revenuecat/purchases-capacitor"
          npm install
          # phone contacts picker for Invite a friend (version 6 = Capacitor 6)
          npm install @capacitor-community/contacts@6
          # The build reads a JSON copy of capacitor.config.ts (no TypeScript needed on the build machine)
          rm capacitor.config.ts
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.wellbe.client","appName":"Wellbe","webDir":"www","backgroundColor":"#151b1e","ios":{"contentInset":"always"},"plugins":{"SplashScreen":{"launchShowDuration":800,"backgroundColor":"#151b1e","showSpinner":false},"PushNotifications":{"presentationOptions":["badge","sound","alert"]},"LocalNotifications":{"smallIcon":"ic_stat_wellbe","iconColor":"#1f6e5b"}}}
          JSON
          # copy-web.js looks one folder too high for client and core: point it at the repo root
          sed -i '' "s#'../..'#'../../..'#" scripts/copy-web.js
          npm run web
          npx cap add ios
          npx cap sync ios

      - name: App settings
        working-directory: phase5/mobile/ios/App
        run: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" App/Info.plist
          /usr/libexec/PlistBuddy -c 'Add :NSContactsUsageDescription string "Wellbe opens your contacts so you can pick a friend to invite to a free trial session."' App/Info.plist
          # app icon: the Wellbe icon from the client app, sized up to the 1024 px the App Store asks for
          sips -z 1024 1024 ../../../../client/icon-512.png --out App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          ls -la App/Assets.xcassets/AppIcon.appiconset

      - name: API key file
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Archive
        working-directory: phase5/mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION=1.0.0 CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Sign and upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove key file
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
